[project]
name = "california-political-knowledge-map"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "neo4j>=5.18.0",
    "httpx>=0.27.0",
    "crawl4ai>=0.9.0",
    "pydantic-ai>=2.0.0",
    "chonkie>=1.6.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic_ai.*",
]
markers = [
    "no_mock_ensure_index: do not mock the _ensure_vector_index method in Neo4jManager"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_map"]