[project]
name = "california-political-knowledge-map"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "neo4j>=5.18.0",
    "httpx>=0.27.0",
    "crawl4ai>=0.9.0",
    "pydantic-ai>=2.0.0",
    "chonkie>=1.6.8",
    "logfire[system-metrics]>=4.37.0",
    "structlog>=26.1.0",
    "python-dateutil>=2.9.0.post0",
    "pydantic-evals>=2.0.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
ca-map = "knowledge_map.cli.main:main"

[dependency-groups]
dev = [
    "ca-political-classifier",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "classifier/src"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic_ai.*",
    "ignore::logfire._internal.config.LogfireNotConfiguredWarning",
]
markers = [
    "no_mock_ensure_index: do not mock the _ensure_vector_index method in Neo4jManager"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_map"]

[tool.uv.workspace]
members = ["classifier"]

[tool.uv.sources]
ca-political-classifier = { workspace = true, editable = true }
