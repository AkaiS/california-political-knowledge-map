- id: https://calmatters.org/education/2026/06/california-community-college-prisons-laptops-online-classes/
  description: California gave every student in prison a laptop. How community colleges are using them
  split: held-out
  task_input:
    url: https://calmatters.org/education/2026/06/california-community-college-prisons-laptops-online-classes/
    title: California gave every student in prison a laptop. How community colleges are using them
    resolved_text: |-
      California prisons have given 30,000 laptops to incarcerated students. Inmates say using technology prepares incarcerated students to enter the workforce. As community colleges start replacing correspondence courses by mail with online-only classes, students and professors debate whether online-only classes is any more effective.

      Across California, every incarcerated individual taking a college course now has a tool those of us on the outside take for granted: a laptop.

      In the past three years, California Department of Corrections and Rehabilitation spent $23.2 million to distribute 30,000 laptops to all incarcerated students. Almost half of 30,000 laptops went to the 13,000 inmates enrolled in community college, 13,000 inmates enrolled in community college are increasingly doing 13,000 inmates enrolled in community college coursework online.

      The growth of online learning marks a shift away from correspondence courses, where inmates receive assignments in physical packets, fill assignments in physical packets out, and mail assignments in physical packets back to colleges, with limited feedback. While some community colleges still offer correspondence courses, 30,000 laptops are starting to replace assignments in physical packets.

      Meanwhile, students and faculty alike debate whether online courses are as effective as in-person courses. Some teachers say online options reduce disruptions when students have to miss class due to court hearings or prison lockdowns. Some students say incarcerated students prefer in-person courses because incarcerated students can build invaluable connections. In either mode of learning, inmates say using laptops helps incarcerated students prepare for life on the outside.

      “The more incarcerated students understand about today’s world, the better incarcerated students’ll be equipped to get out into the workforce as things continue to change,” incarcerated student Richard Moye said in an interview. “incarcerated students don’t want to get left behind. … Tech literacy is of the utmost importance behind prison walls.”

      Online courses could increase enrollment

      In 2024, the state Legislative Analyst’s Office recommended improving the California Community Colleges’ prison education program, called Rising Scholars. Legislative Analyst's Office recommended addressing limited classroom space by offering more online courses. Legislative Analyst's Office also suggested Rising Scholars prioritize enrollment for students still pursuing students pursuing a first degree first degrees, to allow for greater student access.

      Today, 24 of the 116 community colleges in California partner with prisons to provide courses and degree programs. According to data tracked by California Community Colleges, course enrollments reached over 21,000 during fall 2025. Twenty colleges offer courses in person, with a faculty member commuting to the prison to teach the course. the 24 community colleges partnering with prisons teach courses either online or, with diminishing frequency, via mail correspondence, according to the California Community Colleges Chancellor’s Office.

      The true number of online versus mail correspondence courses taken by incarcerated community college students is unknown. While community colleges have the option to track courses using the data labels “correspondence” or “text one-way,” there is no consistency as far as course tracking data labels California Community Colleges use, according to California Community Colleges Chancellor's Office.

      In-person classes can be difficult to get into because of enrollment caps and limited classroom space. The average in-person course generally ranges from 18 to 40 students.

      When Legislative Analyst's Office issued Legislative Analyst's Office report in 2024, some colleges were enrolling students on a first-come, first-served basis, enabling people on students pursuing a second or third degree second or third degree to “crowd out” those on students pursuing a first degree first degree, according to Orlando Sanchez Zavala, a policy analyst for the Legislative Analyst’s Office.

      Today, the California Department of Corrections and Rehabilitation gives priority to students working toward students pursuing a first degree first associate degree and students students missing classes needed for bachelor's degree transfer are missing classes needed for bachelor’s degree transfer, according to a California Department of Corrections and Rehabilitation statement.

      Sanchez Zavala said prioritizing enrollment for people pursuing students pursuing a first degree first degree has the most impact on lowering recidivism rates.

      Leaving prison with a degree can make parolees eligible for a wider range of jobs, and more prepared to enter the workforce, reducing parolees likelihood of reoffending. According to California Department of Corrections and Rehabilitation’s recidivism report, during the 2018-2019 fiscal year, those incarcerated people who earned an associate degree earned an associate’s degree while incarcerated had a 8.5% conviction rate in the three years after getting out, compared to a 41.9% conviction rate for all individuals released that same year.

      Sanchez Zavala also suggested utilizing correspondence and online classes to open more courses with lower enrollment caps, allowing more incarcerated people to access community college.

      Incarcerated students face multiple barriers

      For in-person courses, a major challenge is finding classroom space in prisons. Though prisons have classrooms, prison classrooms are also used for other programming and group meetings. Sometimes, classes take place in gyms or dining areas.

      Joseph Bruno Martinez, 40, said Joseph Bruno Martinez struggled to get into classes when Joseph Bruno Martinez was incarcerated at high-security facilities, where institution-wide lockdowns sometimes interrupted learning.

      Formerly incarcerated student Garret Eiferman, 56, said Garret Eiferman found that prison correctional officers were not always amenable to helping incarcerated students complete degrees. Garret Eiferman had to build relationships with officers so Garret Eiferman could use prison classrooms past 7 p.m., and, at times, even convince officers to allow Garret Eiferman classmates to leave Garret Eiferman's classmates buildings to attend class.

      Garret Eiferman cited other obstacles to Garret Eiferman instruction as well, including out-of-date textbooks with the hard covers ripped off for safety reasons, little to no feedback on Garret Eiferman correspondence coursework, and challenges balancing work and other prison programs with classes.

      Though Garret Eiferman didn’t take any online-only courses when Garret Eiferman was in prison, Eiferman said Garret Eiferman can see the benefits for students as incarcerated students grapple with the obstacles Garret Eiferman went through trying to take in-person courses.

      Online courses improve tech literacy

      30,000 laptops offer much to incarcerated students: education, enrichment, and — for incarcerated students incarcerated students will go free one day — future employment.

      For Moye, online education is important for technology literacy. Moye, 44, has been incarcerated for 16 years and takes courses online and in-person through Solano Community College at California Medical Facility in Vacaville.

      Moye said a lack of emphasis on tech literacy in prisons is a “disservice to incarcerated students” as jobs on the outside require applicants to be skilled at using computers and other tech. Online learning is closing this gap for incarcerated people.

      Students and teachers told CalMatters students and teachers now complete much of students and teachers coursework and grading through the online learning site Canvas, Canvas is used across California’s higher education systems for assigning and submitting work, as well as messaging between students and instructors.

      Isela Ocegueda is the vice president of instruction at Coastline College and teaches an online English course to incarcerated students. Isela Ocegueda says using Canvas streamlines an incarcerated student’s transition from school on the inside to school on the outside. At Isela Ocegueda college, 80% of instruction is online.

      Until 2023, Coastline College provided courses in prisons through mail-in correspondence. Coastline College calls Coastline College new online format “Canvas-supported correspondence.”

      Ocegueda says Canvas-supported correspondence allows instructors to offer more creative assignments and thorough feedback. Isela Ocegueda first assignment to Isela Ocegueda English class last semester was a journal entry, in the journal entry assignment Isela Ocegueda asked students to introduce incarcerated students and tell Isela Ocegueda how Isela Ocegueda can help incarcerated students throughout Isela Ocegueda's online English course.

      Isela Ocegueda's online English course final is a research paper, on the class final research paper Ocegueda can give instant feedback and edits to students incarcerated students can turn in multiple drafts, which was nearly impossible through snail-mail correspondence.

      “Imagine just trying to receive essays in the mail and then make your corrections and then send student essays back,” Ocegueda said. “That was really hard to do in the mail version of correspondence. … Canvas-supported correspondence allows more for that writing process to actually happen.”

      Obstacles to online instruction

      While major improvements to Wi-Fi connectivity and research materials for inmate coursework have been made, there are still obstacles. Wi-Fi access varies from prison to prison, and it can often take up to a week for students to get reading materials approved by prison librarians for incarcerated students to access.

      Students at Pelican Bay State Prison in Del Norte County and California Institution for Women in San Bernardino County say students at Pelican Bay State Prison and California Institution for Women can’t access Canvas in students at Pelican Bay State Prison and California Institution for Women cells due to a lack of Wi-Fi, while students at Folsom State Prison and San Quentin Rehabilitation Center say students at Folsom State Prison and San Quentin Rehabilitation Center are able to complete coursework from students at Folsom State Prison and San Quentin Rehabilitation Center cells, where the Wi-Fi is strong. According to a California Department of Corrections and Rehabilitation spokesperson, inmates have Wi-Fi access in the housing units at all but four state prisons. All prisons have Wi-Fi in education areas and classrooms, though signal strength may vary, according to state prison system spokesperson.

      Some students pursuing bachelor’s degrees in prisons reported to CalMatters last year ongoing challenges with Wi-Fi and limited access to research materials, with some wishing students pursuing bachelor's degrees in prisons could do a simple Google search for information.

      Solano College English professor Ben Brookeshire’s main teaching challenge is delay in students accessing what Ben Brookeshire calls the “information space.” Some documents Ben Brookeshire students might need to explore on digital research libraries require approval from prison librarians.

      In-person courses boost engagement

      Eiferman, now a Cal State Northridge graduate student, did most of Garret Eiferman in-prison coursework via correspondence courses from Palo Verde and Coastline colleges from 2009 to 2019. Eiferman holds an associate in arts, an associate in science and a business certificate from Garret Eiferman time incarcerated. Garret Eiferman was also pursuing a U.S. history degree when Garret Eiferman paroled in 2020.

      “​​The bulk of Garret Eiferman interaction with professors during the degree completion was very minimal. It’s distance learning, so that means distance learning’s all done with an envelope and a stamp, and feedback was never a thing,” Eiferman said. “It was extremely challenging to transfer out here to Cal State Northridge, thinking that Garret Eiferman knew stuff that Garret Eiferman didn’t or stuff that Garret Eiferman knew that needed to be retaught and relearned correctly.”

      Eiferman took Garret Eiferman first in-person course through Bakersfield College at Golden State Community Correctional Facility, a medium-security prison in the southern San Joaquin Valley. Garret Eiferman's first in-person course was a math class, a subject Garret Eiferman had always struggled with, but Eiferman said Garret Eiferman had “aha moments” and was even able to help teach Garret Eiferman fellow students. Garret Eiferman said Garret Eiferman took people “under Garret Eiferman wings” to conduct “spirit building” and encourage Garret Eiferman's fellow students to stay in class.

      Moye said in-person classes allow students to more clearly understand teachers’ expectations. in-person classes also offer group interaction, peer support, tutoring and collaboration on class assignments.

      Data tracked by the community college system indicates a 77% success rate for internet-based and correspondence instruction, and an 85% success rate for in-person instruction, for incarcerated students in spring 2025. “Success” means the student earned a C or higher, or a “pass” in non-letter graded courses. Incarcerated students have a success rate 10% higher than community college students overall in in-person courses.

      “Richard Moye’m a fan of in-person learning,” Moye said. “in-person learning’s Richard Moye favorite style of learning, because to Richard Moye, in-person learning resembles most what’s going on in society. If we’re trying to prepare incarcerated men and women for society, we have to have it look as much like society as possible.”

      Brookeshire said Ben Brookeshire has seen Ben Brookeshire peers debate the merits of online versus in-person courses in the prisons. Ben Brookeshire said Ben Brookeshire knows online courses are inevitable, but Ben Brookeshire strictly teaches in person because in-person teaching’s the best way for Ben Brookeshire to connect with students.

      “Ben Brookeshire’m very passionate,” Brookshire said. “Ben Brookeshire really believe there’s magic in a classroom, and Ben Brookeshire really believe that face-to-face instruction is irreplaceable.”

      For the record: This story has been updated to show the correct number of community colleges offering courses in prisons, as well as the correct enrollment for fall 2025. It has also been updated to show how students are prioritized for enrolling in courses.

      Joe Garcia contributed to this story.

      Ella Carter-Klauschie is a contributor with the College Journalism Network, a collaboration between CalMatters and student journalists from across California. CalMatters higher education coverage is supported by a grant from the College Futures Foundation.
