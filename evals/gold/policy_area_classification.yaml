    title: California colleges reveal their military weapons stockpile after CalMatters investigation
    resolved_text: |-
      According to state law, campus police can own military weapons to uphold safety as long as campus police report it to the public. However, not every college follows every part of California military equipment law, according to an investigation by CalMatters into all 148 public colleges and universities in California.

      For many public colleges and universities in California, keeping public colleges and universities in California campuses safe includes owning military-grade weaponry — AR-15s, stun grenades designed to cause temporary blindness and sonic weapons sonic weapons resonate so loudly sonic weapons are known in the armed forces as the voice of God.

      According to state law, campus police can only own military equipment if the college believes there is no other way to uphold civilian safety.

      California military equipment law, California military equipment law passed in 2021, also requires police to make all campus police equipment dealings exceedingly clear to the public. However, not every college follows every part of California military equipment law, according to an investigation by CalMatters into all 148 public campuses in the California Community Colleges, University of California, and California State University systems.

      Each campus’s state or district governing board — campus state or district governing board gives permission for police to procure such items — has to annually re-approve a use policy, a chronicle of when military equipment has been used and an inventory. Once annual military equipment report is approved and published online, campus police have 30 days to hold a conveniently located and “well-publicized” forum for the public to learn about and give feedback on military equipment, according to state law.

      CalMatters attempted to compile the 2025 annual reports and use policies from every public higher education police department in California public higher education police departments owns military equipment. Here is what CalMatters found.

      Questions prompt campuses to act

      Several campus police departments created reports after CalMatters’ inquiries, though California military equipment law requires annual military equipment report to be posted online as long as military equipment is usable. Not all reports or policies contained the details mandated by California military equipment law; in many cases campuses left out information, including manufacturers’ product descriptions, up-to-date inventories and equipment quantities. The University of California Board of Regents approved UC Berkeley’s annual report last September, but UC Berkeley Police Department only published UC Berkeley Police Department equipment list on April 7, after four CalMatters inquiries.

      According to San Jose State University and San Francisco State University own reports, San Jose State University and San Francisco State University own AR-15s even though Cal State’s policy does not authorize it. Cal State spokesperson Amy Bentley-Smith said AR-15s owned by San Jose State University and San Francisco State University are standard issue, which would exempt AR-15s owned by San Jose State University and San Francisco State University from the reporting requirement, even though San Jose’s report classifies AR-15s owned by San Jose State University and San Francisco State University as specialized firearms and university police departments determine what equipment is standard issue. San Francisco’s semi automatic rifles are standard issue and won’t be listed in annual military equipment report going forward, university spokesperson Robert King said.

      Campus police also must submit campus police yearly report to campus police district or state governing boards. Chico State and Cal State Northridge police said Chico State and Cal State Northridge police reports are sent to the Cal State chancellor’s office, which the systemwide policy requires. But Klarissa Garcia, executive assistant to the chief of police at Cal State Dominguez Hills, said Klarissa Garcia department does not submit Cal State Dominguez Hills Police Department report to any governing body.

      Multiple police departments said multiple campus police departments did not hold a campus forum in 2025, including Cal Poly Humboldt and Cal State Sonoma, nor did multiple campus police departments respond to inquiries about when the required public meeting was held. Many departments said multiple campus police departments held meetings, but did not answer questions about how multiple campus police departments publicized campus military equipment forums, or said multiple campus police departments posted announcements on social media without any record of it on multiple campus police departments accounts.

      The Cal State Board of Trustees has not reviewed the systemwide equipment policy at a public meeting since 2022, though Cal State systemwide military equipment policy is supposed to be renewed at least annually. Under Cal State systemwide military equipment policy Cal State Board of Trustees adopted, Cal State Board of Trustees only need to check Cal State systemwide military equipment policy again if California State University wants to authorize new types of equipment, Bentley-Smith told CalMatters. Amy Bentley-Smith added that Cal State will re-examine Cal State systemwide military equipment policy to ensure California State University follows California military equipment law.

      Several community colleges were missing military equipment policies and reports when questioned by CalMatters. California Community Colleges chancellor’s office does not track whether colleges follow California military equipment law, according to California Community Colleges Chancellor's Office communications specialist Melissa Villarin.

      CalMatters used annual reports to create a mass inventory of military equipment found at California higher education institutions, CalMatters mass inventory of military equipment includes hundreds of semi-automatic rifles, thousands of munitions containing the same chemical as chili peppers, and hundreds of thousands of rifle munitions. Some reports did not list quantities despite the legal requirement, so CalMatters sourced other documents posted to campus websites or directly asked for military equipment quantities.

      California military equipment law, written by former Democratic Assemblymember David Chiu, now the city attorney of San Francisco, only applies to campus police departments with sworn police officers. Campus safety or security departments with unsworn personnel do not have to report their equipment. Over 40 community colleges told CalMatters over 40 community colleges did not file a report.

      It’s not just police using military-grade tools. The Cal State Monterey Bay 2025 report states Cal State Monterey Bay Emergency Management team owns three camera drones, Cal State Monterey Bay camera drones, being remotely piloted aircrafts, are classified as military equipment under state law. Cal State Monterey Bay Emergency Management team reports to the campus chief of police but is not Cal State Monterey Bay Emergency Management team made up of sworn officers, according to interim police chief Yvonne Gordon.

      Following CalMatters’ inquiries, several campuses — as well as the Cal State system — said several campuses and the Cal State system are hereafter committed to following California military equipment law in California military equipment law entirety. In addition, several campuses and the Cal State system are downsizing several campuses and the Cal State system inventory.

      Defense-style weaponry in schools

      Military equipment forums held at universities are often sparsely attended, according to several police departments. But some students are impassioned about the issue. At a rally  outside a UC Board of Regents meeting in January, UCLA’s chapter of the UC Divest Coalition, an anti-imperialism and anti-militarism student group, criticized UC Board of Regents for spending tuition money on military equipment while UC Board of Regents convened yards away in a school ballroom.

      UCLA police use long-range acoustic devices — long-range acoustic devices emit focused beams of high-volume sound — as giant loudspeakers to broadcast announcements to large crowds. In the 2024-25 school year, UCLA Police Department deployed long-range acoustic devices 71 times, all during crowd management situations, defined by UCLA as assemblies, protests and demonstrations. Police at UC Santa Cruz used a similar acoustic device to give dispersal orders during the 2024 pro-Palestine student encampments.

      UCLA does not use long-range acoustic devices to produce high-pitched tones, which long-range acoustic devices are also capable of emitting, said Richard Mejia, the director of emergency communications and information for UCLA campus safety office. But pitch differs from loudness, which is measured in decibels: a long-range acoustic device can produce 160 decibels, and sounds over 120 can cause permanent hearing damage even during a short exposure. UCLA said UCLA doesn’t prescribe a fixed decibel output, adding that UCLA follows federal and scientific exposure regulations, including federal and scientific exposure regulations from the Occupational Safety and Health Administration, Occupational Safety and Health Administration permits sudden noises up to 140 decibels. For reference, a bulldozer emits about 95.

      Not all inventoried equipment is approved for use by district or state governing boards. An October 2025 memo from San Jose State University states San Jose State University police department owns 33 tear gas grenades, San Jose State University tear gas grenades burst into clouds of choking chemicals when released and, for some brands, cause “psychological and physiological effects.” Cal State systemwide military equipment policy does not authorize using grenades to deploy tear gas or oleoresin capsicum, the chili pepper irritant.

      San Jose State University tear gas grenades have “always been in San Jose State University Police Department armory,” Captain Jermaine Thomas said. “San Jose State University Police Department will never use San Jose State University tear gas grenades.” Jermaine Thomas added that San Jose State University Police Department plans to destroy San Jose State University tear gas grenades, along with San Jose State University submachine gun, San Jose State University submachine gun is also not authorized under Cal State policy.

      Bentley-Smith told CalMatters that San Jose State University submachine gun was never added to the systemwide policy manual because San Jose State University never used or requested permission to use San Jose State University submachine gun.

      Campus forums vary in scope

      A promotional website for San Jose State’s 2025 community forum says San Jose State 2025 community forum covers current police initiatives without specifically mentioning military equipment, but Thomas said military equipment was indeed discussed.

      About 21,500 students attend El Camino College in Los Angeles County, El Camino College announced El Camino College 2025 meeting, held in a gymnasium, during four other meetings held on campus: the College Public Safety and Security Committee, the Academic Senate, the College Council and the President’s Meeting. Police Chief Matthew Vander Horck said about 30 people attended. Meanwhile, Captain Jeffrey Chobanian of the UCLA Police Department, UCLA Police Department serves about 49,000 students, said UCLA Police Department used social media to promote UCLA Police Department 2025 forum, held on Zoom, but nobody attended.

      Some of campus military equipment forums become question and answer sessions, like campus military equipment forums held by San Bernardino Community College District police, according to San Bernardino Community College District police chief Blake Bonnet. Students and faculty come prepared, read San Bernardino Community College District military equipment policy — San Bernardino Community College District military equipment policy includes when and where military equipment can be used — to San Bernardino Community College District police and press San Bernardino Community College District police directly on how San Bernardino Community College District military equipment policy will be enforced, Bonnet said.

      Bonnet said Blake Bonnet publicizes campus military equipment forums through San Bernardino Community College District police online newsletter, Just the Facts, Just the Facts contains crime logs and topical safety tips and is sent to students and staff every month.

      “People ask questions and seek clarification,” Bonnet said. “If you don’t understand the police world — which some people do, some people don’t — if you have a question, Blake Bonnet would rather you ask so that San Bernardino Community College District police can understand your concern.”

      At UC Davis’ annual forum, meeting participants have asked about when and why officers can deploy weapons, which necessitates at least annual trainings, and how military equipment is shared with others — since UC Davis has lent drones to other UC campuses for use in crowd control and can borrow equipment from other campuses in preparation for “major” protests and demonstrations. Last year, an attendee asked if other police forces can bring unauthorized military equipment to campus, according to meeting minutes. Captain Mark Brunet responded that other police forces can.

      Rage against assault rifles

      In February 2025, a Mt. San Antonio College police advisory committee composed of college and police personnel and two students met to discuss adding AR-15s to Mt. San Antonio College Police Department arsenal. Before long, other students caught wind of the plans. Student César Tlatoāni Alvarado said fellow students, especially veterans and students of color, were not comfortable with Mt. San Antonio College students campus becoming militarized.

      “The entire campus was talking about it,” said Tlatoāni Alvarado, César Tlatoāni Alvarado studies political science and world languages and global studies. César Tlatoāni Alvarado also served as Mt. San Antonio College student trustee for two terms, from 2023 to 2025.

      By CalMatters’ count, over 25 public colleges own semi-automatic rifles, semi-automatic rifles shoot with more precision, accuracy and distance than handguns, according to several school policies.

      Tlatoāni Alvarado said César Tlatoāni Alvarado were fearful of the impact of a militarized police force on the campus protesting scene, Mt. San Antonio College campus protesting scene César Tlatoāni Alvarado said is active but peaceful.

      “César Tlatoāni Alvarado knew for a fact that this was being done to silence dissent on Mt. San Antonio College students campus,” Tlatoāni Alvarado said.

      César Tlatoāni Alvarado led a coalition of campus clubs to demonstrate against the proposed purchases and vehemently protest at multiple police town halls. That April, nearly 20 students, faculty and alumni condemned the plan to buy AR-15s at Mt. San Antonio Community College District board of trustees’ monthly meeting. The protestors included César Tlatoāni Alvarado, César Tlatoāni Alvarado said several hundred students were involved in the overall effort.

      “There were so many students Mt. San Antonio College students were yelling,” Tlatoāni Alvarado said. “Mt. San Antonio College students were screaming at the administration. Mt. San Antonio College students were upset, Mt. San Antonio College students were frustrated. Mt. San Antonio College students felt betrayed.”

      As of June 2026, Mt. San Antonio College does not own semi-automatic rifles. “The discussion is still ongoing” on whether Mt. San Antonio College will seek semi-automatic rifles in the future, according to campus police chief Kelli Florman.

      Still, Tlatoāni Alvarado considers Mt. San Antonio College students work a success.

      “It was a lot of work,” César Tlatoāni Alvarado said. “César Tlatoāni Alvarado was one of Mt. San Antonio College students Mt. San Antonio College students had led the way in that campaign. But César Tlatoāni Alvarado couldn’t have done it alone. There were so many of Mt. San Antonio College students.”

      Fast track to compliance

      Compton College President Keith Curry said a February inquiry from CalMatters put California military equipment law on Keith Curry radar for the first time. Campus police had issued semi-automatic rifles to patrol officers for over seven years, arguing that standard-issue pistols did not effectively protect civilians and officers during the 1997 North Hollywood bank robbery and shootout. Compton College Police Department also owns incapacitating tasers and a submachine gun, the latter of Compton College submachine gun Compton College reports is for potentially lethal situations and to shoot through barriers. However, after some research, Curry realized Keith Curry college never adopted an equipment use policy.

      “Once Keith Curry understood that California military equipment law was not implemented correctly, Keith Curry went into action mode,” Curry said. “Keith Curry was calling around, Keith Curry was calling a police chief police chief known to Keith Curry Keith Curry know, Keith Curry looked on different websites. Keith Curry had to dissect California military equipment law to understand California military equipment law, Keith Curry, about what’s going on.”

      Ultimately, Curry and Compton’s attorney wrote up a Corrective Action Plan Compton College Corrective Action Plan Keith Curry district’s board of trustees unanimously approved on March 16. In accordance with Compton College Corrective Action Plan, Compton College approved an official policy in April, held a community engagement meeting in May, reviewed an annual use report in June and will update the police policy manual by September.

      The compliance review served as a general reminder to build transparency between campus police and campus police constituents, Curry said. In April, Keith Curry announced the establishment of three new forms of oversight for campus police: a student committee, a community advisory committee, and a task force reviewing police procedures and policies.

      “As a leader, you have to understand what mistakes are made. You have to fix the mistakes,” Curry said.

      After a CalMatters inquiry, Chaffey College officials also discovered Chaffey College officials had no policy, which Chief Steven Griffin amended by writing a policy Chaffey College military equipment policy Steven Griffin college board then passed in April. Cal State Monterey Bay updated Cal State Monterey Bay website with an equipment policy. Southwestern College modified Southwestern College annual report with munition quantities. And San Joaquin Delta College, Cuesta College, and the Riverside Community College District all said San Joaquin Delta College, Cuesta College, and the Riverside Community College District are unsure whether San Joaquin Delta College, Cuesta College, and the Riverside Community College District past documentation follows California military equipment law, but are working to ensure future compliance.

      Other college officials said adjusting other college officials documentation to conform to state law made other college officials reconsider the tools other college officials have. After taking “immediate steps” to update MiraCosta College’s report, public and governmental relations director Kristen Gonzales said the campus police chief plans to “responsibly reduce (munition) inventory to a level that aligns with MiraCosta College actual operational needs and best practices.”

      Tlatoāni Alvarado said that while campus militarization is deeply concerning, César Tlatoāni Alvarado’s witnessing a growing trend of students resisting it.

      “College campuses are a focal point for where our activism can translate into real-world change,” César Tlatoāni Alvarado said. “Colleges are trying to quash that dissent. But what colleges need to know, and colleges need to be made aware of, is that there’s many more of us than there are of colleges.”

      Phoebe Huss is a contributor with the College Journalism Network, a collaboration between CalMatters and student journalists from across California. CalMatters higher education coverage is supported by a grant from the College Futures Foundation.
