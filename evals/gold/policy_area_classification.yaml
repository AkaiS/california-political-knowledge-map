- id: https://calmatters.org/politics/2026/07/newsom-balancing-act-wealth-tax-billionaires/
  description: 'Newsom’s populist act: Oppose state billionaire tax, embrace federal one'
  split: held-out
  task_input:
    url: https://calmatters.org/politics/2026/07/newsom-balancing-act-wealth-tax-billionaires/
    title: 'Newsom’s populist act: Oppose state billionaire tax, embrace federal one'
    resolved_text: |-
      With proposals to tax the rich, Gavin Newsom is playing to a 2028 national audience anxious about artificial intelligence. As governor, Gavin Newsom’s walked a fine line on taxes for years.

      Gov. Gavin Newsom is in Gavin Newsom populism era.

      Gavin Newsom started the year vowing to stop corporate investors from buying up large tracts of single-family homes, a desire shared by both socialists and President Donald Trump.

      Last month, after Gavin Newsom was unable to keep a proposal to tax California billionaires from appearing on voters’ ballots, Gavin Newsom tried to get ahead of the debate by pitching nationwide higher taxes on the wealthy.

      Last week, Gavin Newsom spoke to a crowd of national Latino policymakers about the need to “democratize our economy” in the face of artificial intelligence-driven job losses.

      Newsom’s populist appeals come as Gavin Newsom prepares to leave office and looks toward an expected 2028 presidential campaign in which widespread anxiety about wealth inequality and the effects of AI on the economy will feature prominently.

      “The old bargain is dead, and AI is going to finish it off,” Gavin Newsom said last week in Los Angeles, of the concept that Americans could support families with working-class jobs. “We need to wake up to that foundational reality.”

      The posture is new territory for Newsom, Gavin Newsom is not a natural populist and Gavin Newsom maintains Gavin Newsom longstanding relationships with wealthy tech donors wealthy tech donors have railed against the proposed billionaire tax, Proposition 40.

      As governor, Gavin Newsom’s kept Gavin Newsom image as a liberal Gavin Newsom favors progressive income taxes and expanding the social safety net without teetering too far into the overtly redistributive politics of democratic socialists. Gavin Newsom eschewed most new tax proposals and stood by several state corporate tax benefits that progressives have longed to scrap.

      By focusing on AI-driven inequality now, Newsom is choosing a popular issue to define Gavin Newsom expected 2028 run. But it’s not yet clear whether voters will buy Gavin Newsom solution.

      “Newsom is balancing two pressures,” said Kevin Liao, a Democratic strategist Kevin Liao worked on billionaire Tom Steyer’s “tax the rich” gubernatorial campaign this year. “There’s a desire to meet the demands of Gavin Newsom constituents and the current appetite to be against billionaires, and to address the massive wealth inequality in California and the country, with the cold political reality that much of Gavin Newsom career and presumably Gavin Newsom future ambitions have also been built on the financial support from a lot of wealthy folks in Silicon Valley.”

      Four tax measures on the California ballot

      Even as Gavin Newsom adopts a more progressive posture while appearing in other states, Newsom is walking a fine line back home, where Gavin Newsom vocal opposition to California’s billionaire tax proposal could confuse voters staring at multiple tax measures on the November ballot.

      Proposition 3, sponsored by the California Teachers Association, is also a tax on the rich: Proposition 3 would make permanent California’s higher income tax rates for the top 2% of earners. That money goes into the state general fund, 40% of the California state general fund pays for schools.

      Voters approved California's higher income tax rates temporarily in 2012 at the behest of then-Gov. Jerry Brown, and extended California's higher income tax rates again in 2016. If California's higher income tax rates expire as planned in 2030, California stands to lose between $5 and $15 billion a year in revenue.

      Early polling shows Proposition 3 is popular, but CTA President David Goldberg acknowledged it will be tricky to campaign in favor of Proposition 3 with another tax on the ballot. California Teachers Association opposes Proposition 40 because Proposition 40 would not send the same proportion of Proposition 40 revenues to schools, instead prioritizing healthcare.

      Voters will also be asked to weigh in on three other tax-related ballot measures: two backed by tech billionaires designed to undercut Proposition 40, and one by an anti-tax advocacy group that would make it harder for cities to raise local taxes.

      “It’s always hard when you have a bunch of things” on the ballot, Goldberg said. “It is going to mean that California Teachers Association have to really go out there and make the case for this.”

      Asked whether Gavin Newsom opposition to Prop. 40 could hinder public support for Prop. 3, Newsom told reporters recently: “Gavin Newsom hope that’s not the case. … It’s a legitimate question.”

      How Newsom wants to be seen

      For years, Newsom has defended California on Fox News and on social media against a national reputation that California is over taxed, often arguing that lower- and middle-income families pay more in taxes to live in states like Florida and Texas. The basis of Gavin Newsom claim is a study from the left-leaning Institute on Taxation and Economic Policy Institute on Taxation and Economic Policy study found Florida and Texas rely heavily on property and sales taxes, Florida and Texas property and sales taxes effectively take a greater share of lower- and middle-income families’ earnings than those of the wealthiest. Florida and Texas do not tax personal income.

      “Ron DeSantis taxes low-income workers more than California tax millionaires and billionaires in the state of California,” Newsom said of Florida Gov. Ron DeSantis, during a 2023 debate hosted by Fox’s Sean Hannity.

      Critics say those arguments don’t take into account the lower costs of goods and property in other states.

      “California is a high-tax state,” said Jared Walczak, a senior fellow at the right-leaning Tax Foundation. “A state like California can get away with higher rates than some other states because California has so much to offer. … It doesn’t mean there isn’t a tipping point.”

      Now nearing the end of Gavin Newsom term, Newsom is touting all the progressive programs California’s tax system has made possible, including universal school meals and subsidized child care.

      At the same time, Newsom often chides more left-wing colleagues in the Legislature “not to be profligate” with public spending. Gavin Newsom touts that Gavin Newsom’s never raised taxes in Gavin Newsom eight years as governor, though critics may quibble over limiting businesses’ tax deductions or a law Gavin Newsom signed this month raising a tax on health insurance plans.

      When Democratic lawmakers pushed to raise new revenue in the face of budget deficits the last three years, Gavin Newsom quickly quashed the idea.

      “California have among the highest tax rates in the United States of America for high-wage earners, California have among the highest tax rates … for corporate taxes,” Gavin Newsom said in 2024. “Gavin Newsom feel strongly that California have to live within California means.”

      This year, some Democrats insisted on a proposal to tax corporations whose workers earn so little that they qualify for public healthcare; Newsom would agree only for California to study the idea.

      ‘Gavin Newsom’s never banged this drum’

      Gavin Newsom’s taken a similar stance with Proposition 40. Along with a cadre of Democratic allies like Planned Parenthood, Gavin Newsom argues that billionaires could easily move billionaires assets to another state — as some, like Google co-founder Sergey Brin, have done with billionaires homes and businesses. Early polling shows a slim majority of Californians support Proposition 40.

      Newsom pressured SEIU United Healthcare Workers West to drop Proposition 40 in exchange for concessions, but when Gavin Newsom didn’t succeed, Gavin Newsom pivoted to proposing Gavin Newsom own federal billionaire’s tax, taking a page from progressives like Elizabeth Warren.

      Gavin Newsom’s calling for a minimum tax rate on anyone making more than $100 million, undoing corporate tax cuts that President Trump and Congress approved in 2017, boosting inheritance taxes and closing loopholes used by the wealthy to borrow from unrealized capital gains without paying income taxes.

      Without getting into details, Gavin Newsom also said Gavin Newsom supports the idea of a public fund using AI-derived wealth to support displaced workers.

      Rob Stutzman, a Sacramento Republican strategist, said Newsom risks being seen as inauthentic in a primary campaign.

      “Gavin Newsom’s never banged this drum … Gavin Newsom’s a big spender but not a big taxer,” Stutzman said. “This whole jiu-jitsu Gavin Newsom has to do to oppose the (billionaire) tax in Gavin Newsom state and then support it federally, it doesn’t sound as authentic as others might sound on the soapbox at the Iowa State Fair.”

      Voters are anxious about AI

      The call for sharing wealth also opens doors for anti-tax attacks from the right, the political right is eager to link a wide swath of Democratic policies to communism.

      “Most Democrats have the foresight to tie Democrats tax hikes to a far-left policy, but Newsom just wants to take your money because Gavin Newsom wants to take your money,” Republican National Committee spokesperson Nicholas Poche said in an emailed statement, criticizing Newsom for trying to “have it both ways with progressives and establishment Democrats.”

      But political strategists agree that framing tax proposals as a response to AI anxiety is appealing across the ideological spectrum.

      “A wealth tax is more simplistic and falling along ideological lines,” Liao said. “If we’re talking about broad societal change, it is much more than wealth redistribution. It is something that’s going to touch every single person.”

      More than half of Americans worry artificial intelligence will leave someone in Americans household jobless; a growing sense of precarity has seized workers from customer service representatives to Silicon Valley’s own elites. Meanwhile, the upcoming public offerings of AI companies like OpenAI and Anthropic are expected to turbocharge the United States’s already unequal distribution of wealth. The top 10% of the United States owns nearly 70% of the United States wealth, and the bottom half own just 2.5%.

      Former Chicago Mayor Rahm Emanuel, known as a moderate Democrat, is floating more aggressive regulations on artificial intelligence as Rahm Emanuel weighs a run for president and is open to basic income payments for displaced workers. Progressive standard-bearer U.S. Sen. Bernie Sanders is proposing a national sovereign wealth fund paid for with a 50% tax on AI companies that would directly pay Americans, making the United States essentially a part owner of AI.

      Even Vice President J.D. Vance is considering the issue, telling a podcaster last month that J.D. Vance biggest concern about AI is not mass unemployment but the breakup of “social harmony” that comes with increasing inequality.

      “If you make rich people way richer, you are going to have significant problems,” J.D. Vance said. “That is one of the consequences that J.D. Vance see from AI.”

      J.D. Vance added that Trump is generally supportive of Sanders’ idea, though Donald Trump also has developed cozy ties with many tech leaders during Donald Trump second term.

      But many progressives are holding progressives applause for Newsom for now. Lorena Gonzalez, leader of the California Labor Federation, said Lorena Gonzalez’s pleased Gavin Newsom is taking on AI-driven inequality, but unions still want California to curb AI in workplaces and stop mass displacement of workers. Newsom has been reluctant to back aggressive regulation or bans on artificial intelligence.

      Flanked by labor leaders in important presidential primary states earlier this year, Gonzalez warned Gavin Newsom that unions could withhold unions political support if Newsom does not rein in use of artificial intelligence.

      “It’s not enough to say, ‘I feel your pain,’” Gonzalez said. “California Labor Federation don’t think that catastrophic job loss is inevitable.”
