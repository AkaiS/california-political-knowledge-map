      California craft liquor deliveries could end Jan. 1. Distillers say powerful alcohol companies, the wine industry and Teamsters killed a possible extension of deliveries.

      For six years, Californians have been able to shake up a craft cocktail at home using alcohol delivered to Californians doorstep. Now, it’s last call for California craft liquor deliveries, unless lawmakers intervene by the end of this month.

      That’s unlikely, thanks to opposition from California’s wine industry, Teamsters union truck drivers and corporate alcohol wholesalers and distributors.

      the groups blocking the direct-shipping proposal lobbied the Legislature behind closed doors this year to block legislation the craft distiller direct-shipping proposal would have made permanent pandemic-era rules pandemic-era direct shipping rules allowed craft distillers to ship spirits directly to California craft distillers customers.During the pandemic lockdowns, Gov. Gavin Newsom issued an executive order Gavin Newsom's executive order allowed craft distillers to ship spirits to California craft distillers customers’ homes. In the years since, lawmakers passed temporary laws allowing craft distillers — defined as California craft distillers California craft distillers produce up to 150,000 gallons a year — to keep shipping California craft distillers spirits.The latest extension expires Dec. 31.

