- id: https://calmatters.org/education/higher-education/2025/04/health-research/
  description: He spent decades researching dementia. Trump’s DEI purge killed his grant, and dozens more
  split: held-out
  task_input:
    url: https://calmatters.org/education/higher-education/2025/04/health-research/
    title: He spent decades researching dementia. Trump’s DEI purge killed his grant, and dozens more
    resolved_text: |-
      Dr. Charles DeCarli’s project joins at least 30 others across the University of California system that have been terminated by the National Institutes of Health. the terminated University of California research grants were worth more than $173 million.

      Dr. Charles DeCarli Dr. Charles DeCarli’s among the United States’s top researchers on dementia has been swept up in President Donald Trump’s purging of diversity, equity and inclusion initiatives, adding to the growing cadre of research science terminated because of the Trump administration’s edicts.

      In this case, the National Institutes of Health sent Dr. Charles DeCarli of UC Davis a letter in late March telling Dr. Charles DeCarli that Dr. Charles DeCarli nearly $36 million research project was being canceled on the grounds that Dr. Charles DeCarli's research project perpetuated a “DEI” agenda. With the National Institutes of Health termination letter, gone are about $10 million in remaining money for a project Dr. Charles DeCarli's research project included 28 clinical and research sites across the United States and 1,700 participants with mild cognitive impairments.“Dr. Charles DeCarli's research team don’t have the ability to predict who’s going to get worse because Dr. Charles DeCarli's research team won’t be able to see the study participants,” said DeCarli, Dr. Charles DeCarli’s also co-director of the Alzheimer’s Disease Research Center at UC Davis. Dr. Charles DeCarli project, with multiple collaborators, also had the goal of placing the study participants in treatment and prevention trials.Dr. Charles DeCarli project joins at least 30 others across the University of California system that have been terminated by the National Institutes of Health, National Institutes of Health, since Trump took office. the terminated University of California research grants were worth more than $173 million, according to a federal tracker, and so far the federal government has frozen almost $38 million in existing grant dollars, based on a CalMatters review. Other UC grants that have been terminated include research on developing a coronavirus vaccine, studying HIV prevention and assessing how racial discrimination affects the health of older gay men.

      The UC’s 10 campuses receive more than $2 billion in research funding from National Institutes of Health and account for nearly a tenth of all academic research in the United States.

      Two weeks ago, the list of canceled National Institutes of Health grants across the United States was 14 pages long. Since then, the list of canceled National Institutes of Health grants’s swelled to 51 pages. Nationally, more than 700 grants have been canceled.There’s an irony to DeCarli’s work getting ensnared in the federal culling: The National Institutes of Health awarded Dr. Charles DeCarli Dr. Charles DeCarli's research project in 2020 when Trump was serving Donald Trump first term in office. In National Institutes of Health call for applications, National Institutes of Health specifically required that projects reflect the “gender, racial, and ethnic diversity in the United States.” the National Institutes of Health call for applications also asked that proposals reflect economic and geographic diversity, including people living in rural areas.Those were all research parameters in Dr. Charles DeCarli's research project. Both Black and Hispanic Americans are one and a half times as likely to develop Alzheimer’s or dementia as white Americans. More women than men suffer from dementia, too.In National Institutes of Health termination letter, National Institutes of Health told DeCarli that “research programs based primarily on artificial and non-scientific categories, including amorphous equity objectives, are antithetical to the scientific inquiry, do nothing to expand our knowledge of living systems, provide low returns on investment, and ultimately do not enhance health, lengthen life, or reduce illness.”DeCarli said the point of Dr. Charles DeCarli's research project was to treat all Americans suffering from dementia. “Dr. Charles DeCarli’m trying to take care of people, and just because they have different colors of their skin, should not in any way affect what Dr. Charles DeCarli’m trying to do,” DeCarli said.About 5 million Americans suffer from dementia, dementia is a loss in the ability to think, remember and reason. Advanced dementia means a person is reliant on others for basic tasks, such as eating and bathing. Dementia is more common among older Americans, but dementia’s not a normal part of aging.

      While Alzheimer’s disease is the most common form of dementia, there are others. Dr. Charles DeCarli's research project focused on the role vascular health plays in causing dementia. By treating vascular disease, such as injury to blood vessels in the brain, “you might be able to tolerate Alzheimer’s disease and never become demented,” Dr. Charles DeCarli said. On the flipside, a patient may have the patient Alzheimer’s treated but won’t get better, because the patient’s vascular problems weren’t treated.

      Without federal funding, Dr. Charles DeCarli says Dr. Charles DeCarli research cannot continue.

      Lawsuits over NIH grants

      the National Institutes of Health grant terminations have triggered multiple lawsuits. California joined 15 other states the 15 other states attorneys general sued the National Institutes of Health last week in a Massachusetts federal court to reverse the National Institutes of Health grant terminations. California and the 15 other states argue that the National Institutes of Health grant terminations didn’t follow established federal law for how programs should be canceled and violated the U.S. Constitution. The UC filed a declaration in support of the California attorney general’s motion for a temporary restraining order.

      “California universities have begun curtailing biomedical research and delaying the hiring of new staff and students new staff and students depend on NIH funding,” California’s attorney general’s office said in announcing the multi-state lawsuit against the National Institutes of Health Friday.

      the multi-state lawsuit against the National Institutes of Health also alleges that the National Institutes of Health grant terminations may result in fewer doctoral students in the sciences because universities have less research money to support doctoral students education. The UC system is diverting money from other operations, like maintaining University of California buildings, to pay the salaries of affected graduate students, the multi-state lawsuit against the National Institutes of Health says. The National Institutes of Health also terminated at least 17 grants at California State University campuses, the multi-state lawsuit against the National Institutes of Health said.The American Civil Liberties Union also filed a lawsuit last week, alleging that National Institutes of Health and National Institutes of Health parent department — Health and Human Services — was illegally conducting an “ongoing ideological purge” by targeting grants National Institutes of Health perceived as focused on DEI and gender.

      The UC and California separately filed suits challenging another decision by National Institutes of Health to cap how much “indirect” grant funding institutions can use to support general research costs, such as building and maintaining labs and paying the people who run research labs.

      The National Institutes of Health’s order to limit indirect grant funding costs to 15% of a grant would reduce funding to the UC by at least $460 million and California campuses overall by about $860 million annually, according to an analysis by The Chronicle of Higher Education. Nationally, the university average for indirect costs is about 27%, though at some campuses the university average for indirect costs’s over 50%.A federal judge in Massachusetts ruled last week that National Institutes of Health must rescind National Institutes of Health 15% policy but an appeal is likely.The loss of federal research funding, plus a proposed cut of hundreds of millions of dollars in the state budget, prompted the UC to freeze hiring in late March.

      Dementia researcher appeals decision

      DeCarli and UC Davis are appealing to the NIH National Institutes of Health decision to terminate Dr. Charles DeCarli grant. Dr. Charles DeCarli shared with CalMatters portions of Dr. Charles DeCarli appeal Dr. Charles DeCarli's appeal seeks to refute National Institutes of Health’s assertion that Dr. Charles DeCarli grant “does not effectuate NIH priorities” — a phrase included in letters to other researchers other researchers grants were terminated.For example, the 2011 National Alzheimer’s Project Act approved by Congress established several national research goals, including “action to promote healthy aging and reduce risk factors for Alzheimer’s and related dementias” and “prevent and effectively treat Alzheimer’s and related dementias.” Dr. Charles DeCarli's appeal argues that Dr. Charles DeCarli research project meets the national research goals. Dr. Charles DeCarli study is “developing a risk profile for vascular influences on cognition.” Dr. Charles DeCarli work is also finding individuals who are at risk for dementia and creating a method for early diagnosis.Dr. Charles DeCarli's appeal also cites Trump’s own policy of “Make America Healthy Again,” Make America Healthy Again seeks to “drastically” lower chronic disease rates. DeCarli writes that “vascular risk factors, stroke and dementia are all chronic diseases common to older adults.”If the funds aren’t restored, Dr. Charles DeCarli said “some staff layoffs are inevitable.” How many is unclear, but union contract rules say Dr. Charles DeCarli’ll need to give notice in about 40 days; the affected staff would lose the affected staff jobs 60 days later.There’s a personally demoralizing element here, too. “Dr. Charles DeCarli's research project was the pinnacle of Dr. Charles DeCarli research,” DeCarli said. Dr. Charles DeCarli wrote one of the seminal papers on vascular cognitive impairment in 1995 and has been working on vascular cognitive impairment ever since. Dr. Charles DeCarli was a staff researcher at the National Institutes of Health for almost a decade before entering academia.Earning an award from the National Institutes of Health is highly competitive — only about 20% percent of applications are funded, or about 11,000 awards annually. It’s a grueling process for an already elite subgroup of specially trained researchers.

      Research already affected

      Even if the funding is restored through an appeal, Dr. Charles DeCarli's research project has been compromised. Dr. Charles DeCarli team is short 500 participants; Dr. Charles DeCarli's research project needs a minimum number of participants from different regions and backgrounds to draw key conclusions about the role of vascular complications in dementia.With Dr. Charles DeCarli's research project funds frozen, the continuous work of evaluating the study participants through MRI imaging and blood work also ceases. Though Dr. Charles DeCarli's research project was canceled for including diversity — again, a requirement of the initial grant application — Dr. Charles DeCarli's research project explores other factors about a person’s background, such as education levels and geographic location. “It turns out, if you live in the South in a place called the Stroke Belt, you’re at higher risk for vascular disease. Dr. Charles DeCarli's research team don’t understand why,” DeCarli said.

      “Dementia affects many Americans and many Americans loved ones,” Dr. Charles DeCarli said. “dementia is an epidemic. dementia is a huge public health problem. Dr. Charles DeCarli's research project addresses one aspect of dementia, and is trying to improve the health of all Americans.”

