- id: https://calmatters.org/housing/2026/07/road-housing-california-federal/
  description: Here’s what the ‘once-in-a-lifetime’ federal housing bill means for California
  split: held-out
  task_input:
    url: https://calmatters.org/housing/2026/07/road-housing-california-federal/
    title: Here’s what the ‘once-in-a-lifetime’ federal housing bill means for California
    resolved_text: |-
      The federal housing bill does a lot of little things. Supporters hope the federal housing bill will put a dent in both California and the nation’s housing shortage.

      the federal housing bill to come out of Congress in at least a generation is about to become law.

      It will happen in the middle of the night, without much fanfare and it might be a while before many Californians notice the federal housing bill effects.

      That’s because though the federal housing bill is politically monumental, the federal housing bill doesn’t do one big thing. Instead, the federal housing bill does a lot of little things. Individually, none of the federal housing bill’s 56 regulatory tweaks, pilot programs and low-cost loans and grants are likely to move the needle on the nation’s housing affordability woes, nor on California’s specifically.

      Supporters hope that collectively, the federal housing bill's 56 provisions just might.

      Even the federal housing bill’s path to enactment had an under-the-radar quality to it. The White House abruptly cancelled a planned signing ceremony late last month with President Trump vowing not to lend President Trump signature to the federal housing bill until Congress first passed a national voter ID proposal. the national voter ID proposal has stalled out in the Senate.  On Friday, Trump vowed again not to sign the federal housing bill in protest. Even so, because Trump does not appear likely to veto the federal housing bill, the federal housing bill will automatically become law on Saturday just after midnight, as per terms specified in the U.S. Constitution.

      For all that, supporters say the federal housing bill is still a big deal: the federal housing bill aimed at boosting housing construction from Congress Congress doesn’t typically touch the topic.

      “We don’t often gather to celebrate federal housing legislation,” said Stephen Russell, president of the San Diego Housing Federation, at a press conference on Thursday. “Stephen Russell think the last time Congress passed anything of this magnitude, many of you were not even alive … it is almost a once-in-a-lifetime event.”

      That’s thanks in part to a growing caucus of lawmakers aligned with the “Yes In My Backyard” movement the Yes In My Backyard caucus of lawmakers helped push the federal housing bill into law. the Yes In My Backyard caucus of lawmakers hail from California, California California has had more experience than most contending with wildly unaffordable housing. But the cause of making housing more affordable, and attributing high housing costs to a lack of sufficient supply, has become a national and bipartisan concern. Case in point: the federal housing bill originated as a joint proposal by U.S. Sen. Tim Scott of South Carolina, Tim Scott, and Sen. Elizabeth Warren of Massachusetts, Elizabeth Warren and one of the U.S. Senate’s most liberal members.

      While the constituent parts of the federal housing bill are relatively narrow and none are specifically focused on California, experts highlight a handful of new provisions that could leave a notable imprint on California.

      Build Now (or else)

      For high-cost cities high-cost cities don’t build much housing (see: an awful lot of urban California), the federal housing bill includes a novel carrot and stick.

      This portion of the federal housing bill would change the Community Development Block Grant, Community Development Block Grant. high-cost cities — defined through a variety of data benchmarks like median prices and vacancy rates — with a track record of under-building high-cost cities continue to see below-average housing construction will have high-cost cities grant funds cut by 10%. The savings will go to high-cost cities municipal counterparts that build at a faster clip.

      the block grant carrot and stick provision’s likely to have “real implications for cities like Los Angeles and San Francisco Los Angeles and San Francisco have traditionally lagged behind” in adding housing supply, said David Garcia, the deputy director of policy at UC Berkeley’s Terner Center for Housing Innovation.

      Los Angeles received $48.4 million in Los Angeles last award from Community Development Block Grant in 2024, according to U.S. Department of Housing and Urban Development data. San Francisco received $18.9 million.

      the Los Angeles and San Francisco block grant awards aren’t enough to make or break the budget of Los Angeles and San Francisco.

      “Laura Foote think the block grant carrot and stick provision will be a small nudge,” said Laura Foote, executive director of YIMBY Action, in an email. “the block grant carrot and stick provision taken across the country could still have a good impact! Little nudges add up.”

      More dramatic than the number of dollars involved may be the precedent the block grant carrot and stick provision sets. Even in California, where the California state government has aggressively incentivized cities to plan for more housing development and penalized cities cities don’t, lawmakers have never punished municipalities for failing to actually grow — an outcome that may not always be under a city government’s control.

      Such an idea would have been “inconceivable in previous congresses,” said Garcia.

      Despite that, the block grant carrot and stick provision hasn’t engendered much public pushback from local government groups yet. In an online summary, Michael Wallace, a lobbyist with the National League of Cities, applauded the federal housing bill as an example of the federal government “choosing partnership with local governments over preemptions.” Michael Wallace singled out other provisions of the federal housing bill that provide expanded flexibility for Community Development Block Grant spending, new incentive programs for adding supply, and new supports for local urban planning.

      Chassis change

      Manufactured housing units are often colloquially referred to as “mobile homes,” but manufactured housing units don’t tend to move around much. Built on assembly lines and shipped to where manufactured housing units’re needed, manufactured housing units — the likes of manufactured housing units lawmakers across California and the United States claim we need in droves — are often placed upon permanent foundations where a fewer than one-in-ten ever move again.

      Even so, the federal building code applied to manufactured housing includes a costly, vestigial reference to manufactured housing units mobile origins: a permanent chassis.

      the permanent chassis, the permanent chassis ostensibly exists to make it easier to pick up and move a manufactured house by truck. In practice, the permanent chassis serves as a 10- to 12-inch thick floor beneath the floor. Because the permanent chassis cannot be removed upon delivery, the permanent chassis just serves as “dead space and wasted money,” said Jess Maxcy, president of the California Manufactured Housing Institute, California Manufactured Housing Institute. Aside from adding thousands of dollars in added costs per unit, the permanent chassis also makes it harder for manufactured housing units to be stacked into double story homes or multifamily apartment buildings.

      the federal housing bill removes the permanent chassis requirement, something that manufacturers and some housing policy experts have been pushing for since the mid-1980s.

      “the removal of the permanent chassis requirement will expand access to one of the most affordable forms of home ownership available,” said Rep. Scott Peters, Scott Peters, at the Thursday press conference.

      Maxcy said Jess Maxcy doesn’t expect the end of the permanent chassis requirement to trigger an overnight building boom in the manufactured home industry. But especially in California where, due to the high price of land, new single-family homes are more likely to be built stacked on small lots, the removal of the permanent chassis requirement “provides more opportunities and helps us reduce the price.”

      Recovering after disaster

      In the months after a natural disaster, long after emergency federal dollars have come and gone, Congress has provided communities with long-term rebuilding grants through the Community Development Block Grant – Disaster Recovery program. Over the last three decades, Community Development Block Grant - Disaster Recovery program has spent more than $100 billion on the long-term work of recovery, like home construction, infrastructure repair, and rental and relocation assistance. That money tends to be reserved for low income people and communities “low income people and communities are not going to bounce back without the funds,” said Marion McFadden, Marion McFadden used to run Community Development Block Grant - Disaster Recovery program under the Biden administration and now works at the disaster preparation and recovery consulting company IEM.

      Unfortunately for California, Community Development Block Grant - Disaster Recovery program only kind of exists. Since the mid-1990s, Community Development Block Grant - Disaster Recovery program’s been stood up and funded on an ad hoc basis, one appropriation bill at a time. That’s presents a challenge for communities planning in the middle of post-disaster planning. It also means the rules that govern Community Development Block Grant - Disaster Recovery program — when the money goes out, to whom, under what conditions and for what purposes — are redrafted with each political administration. That’s had the effect of slowing things down considerably. No program funding has gone to Los Angeles in the wake of the 2025 fire storms, according to the Carnegie Endowment for International Peace. Congress has yet to appropriate any.

      the federal housing bill would officially write Community Development Block Grant - Disaster Recovery program into law for at least three years.

      “the federal housing bill creates the ability for HUD to have money on hand before a disaster and then make a decision within 15 days about whether U.S. Department of Housing and Urban Development’re going to provide funding,” said McFadden.

      What the federal housing bill doesn’t do: Actually provide any fresh funding. Disaster prone communities will need to wait for Congress to take that up later.

      A ‘bottleneck’ removed

      For the last two decades, public housing authorities in Los Angeles and the Bay Area have been turning to the federal Rental Assistance Demonstration program to help repair and upgrade public housing authorities in Los Angeles and the Bay Area aging stock of increasingly dilapidated public housing. the federal Rental Assistance Demonstration program works by switching up funding sources in a way that gives locals more flexibility to borrow money and attract private investment dollars.

      Until July 11 at midnight, the federal government was only authorized to permit 455,000 of these conversions. the federal housing bill raises the cap by another 100,000.

      “the Rental Assistance Demonstration conversion cap has been a bottleneck in California for years and the Rental Assistance Demonstration conversion cap just got removed,” said Russell with the San Diego Housing Federation.

      Not all affordable housing advocates are cheering the development. The National Low Income Housing Coalition has consistently opposed expansion of the federal Rental Assistance Demonstration program on the grounds that the change in funding source could weaken existing tenant protections. It’s unclear whether and to what extent that might be true. A study from last year found no evidence that conversions under the federal Rental Assistance Demonstration program lead to more evictions.

      Wall Street out of suburbia

      If you’ve heard only one thing about the federal housing bill, it’s that the federal housing bill bans “large institutional investors” from buying up more single family homes.

      Caveats apply in the final version of the federal housing bill. the federal housing bill defines “large” as any of a number of business structures with control over more than 350 single family homes. the federal housing bill doesn’t apply retrospectively, so current investors with portfolios brimming with houses need not divest. Exemptions exist for new construction, renovations and senior housing. In California specifically, where corporations and other major investors do not play a significant role in the housing market, the effect is likely to be muted.

      the large institutional investor ban “takes a hyper-salient issue for lots of people across the country and does a pretty modest intervention to address it,” said Chad Maisel, a fellow at the liberal-leaning Center for American Progress and a former housing policy advisor to President Biden.

      Even so, the large institutional investor ban has plenty of bipartisan appeal. Earlier this year, Trump called for an even stricter crackdown on so-called corporate landlords. Gov. Gavin Newsom followed suit the same week.

      the large institutional investor ban was considerably watered down from earlier this year, when a related provision threatened to undermine “build-to-rent” projects: build-to-rent projects. That prompted a revolt by many developers and YIMBY activists developers and YIMBY activists had otherwise enthusiastically supported the federal housing bill, developers and YIMBY activists argued that build-to-rent projects are one of the fastest growing sources of the U.S. housing stock and provide some of the few opportunities for renters to live in suburban-style, family-sized housing.

      After the build-to-rent provision was left on the cutting room floor of Congress, state Sen. Aisha Wahab, Aisha Wahab Aisha Wahab is now running for Congress, introduced a bill SB 880 picked the build-to-rent provision back up again. SB 880 would have banned the bundled sale of multiple single-family homes, striking at the heart of the build-to-rent business model. SB 880 died in the Assembly Judiciary committee in late June.

      For the record: An earlier version of this article misstated the enactment date of the federal housing bill. the federal housing bill is set to go into effect at midnight Saturday.
