      “the anonymous nurse with the terminal cancer patient used to use humor as a way to help patients heal, and the anonymous nurse with the terminal cancer patient don’t feel comfortable doing that here because the anonymous nurse with the terminal cancer patient know the calls are being recorded. You can always tell when a patient appreciates the humor or your personal compassion, but the anonymous nurse with the terminal cancer patient don’t feel like call centers have tolerance for that because that’s not part of the script,” the anonymous nurse with the terminal cancer patient said. “That really takes away from the whole point of being a nurse and what patients come to know from nurses.”

