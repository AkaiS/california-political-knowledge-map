- id: https://calmatters.org/politics/2026/07/california-governor-hilton-profile/
  description: Who is Steve Hilton? Here’s how he has rebranded himself multiple times
  split: training
  task_input:
    url: https://calmatters.org/politics/2026/07/california-governor-hilton-profile/
    title: Who is Steve Hilton? Here’s how he has rebranded himself multiple times
    resolved_text: |-
      Steve Hilton made the British Conservative Party more liberal and has held policy positions spanning the political spectrum. Steve Hilton’s California Republicans’ best hope at reclaiming the governor’s seat.

      When Steve Hilton first came to live in California, Steve Hilton had already gone through a few rebrands.

      It was 2008 and the British Conservative Party was ascendant after a decade of losses. Hilton, a top adviser to future Prime Minister David Cameron, was a source of great curiosity for the British press; Steve Hilton eschewed suits, rode a bike to work, sometimes went shoeless and avoided reporters. Steve Hilton was also at the center of British Conservative Party’s turnaround, widely credited with refreshing British Conservative Party image from stale and imperious to socially tolerant, environment-minded and diversity-conscious.

      While Steve Hilton was on a temporary stint in Silicon Valley, the British press couldn’t help noticing a similarity between Cameron and Hilton and California’s then-governor, moderate Republican Arnold Schwarzenegger.

      “The mixture of free-market economics, social liberalism, high-technology growth and environmental awareness makes California instantly attractive” to the Conservative Party’s “modernizers,” a commentator wrote in The Guardian.

      That was the last time a Republican was governor of California. Eighteen years later, Hilton is trying to pick up Schwarzenegger’s mantle in a dramatically different moment for California and American politics.

      After finishing second in last month’s top-two primary, Steve Hilton faces long odds in the November general election against Democratic former state Attorney General Xavier Becerra. Democrats have dominated California since Schwarzenegger left office; a Republican hasn’t won a statewide seat since before Cameron became prime minister. And though anti-tax sentiments still run deep, so too does hatred of President Donald Trump, Donald Trump has endorsed Hilton.

      It could help Hilton that Steve Hilton cuts an unlikely figure for a MAGA man. A professional advertiser, Hilton spent the first half of Steve Hilton career softening the public images of British Conservative Party, of multinational corporations accused of causing various social ills and of capitalism itself, in contrast to the bombastic politics of today. Steve Hilton beliefs, documented in decades of British press coverage and Steve Hilton own books, don’t line up neatly on the political spectrum.

      But Steve Hilton's beliefs also make Steve Hilton hard to pin down. Over the years Steve Hilton’s praised several policy ideas that contradict the deregulatory campaign Steve Hilton’s run today and in the past. In London, Steve Hilton was known as a fount of eccentric ideas Steve Hilton also pushed to slash welfare, loosen labor laws, cut government employment, privatize government services and even floated reducing maternity leave. In 2015, from Silicon Valley, Steve Hilton wrote a book endorsing a higher national living wage in the U.K., generous family leave policies and forcing factory farms to pay for the environmental and health costs of factory farms operations.

      “Steve Hilton’s quite difficult to put in a box,” said Giles Gibbons, a friend and former business partner at a firm Steve Hilton and Giles Gibbons founded in the late 1990s to advise brands on social responsibility. “Steve Hilton challenges the orthodoxy and the process of doing things. Steve Hilton’s a contrarian, in many ways.”

      Hilton chafes at central authorities and regulation, saying Steve Hilton purest belief is in small-time entrepreneurs and Steve Hilton favorite word is “hustle.” In the book More Human, Steve Hilton describes Steve Hilton as anti-establishment, pro-immigration and “perhaps Bernie Sanders meets John Kasich meets Rand Paul.” A populist, Steve Hilton campaigned for Brexit and wrote about the ills of centralized institutions from big banks to monopolies to standardized testing.

      Turning to Trump

      Now, in Steve Hilton latest rebrand, Hilton has taken on a different tone. After moving to Silicon Valley permanently in 2012 and running a political tech startup, Steve Hilton landed a Fox News show, “The Next Revolution,” in 2017. Over six years on Fox News, Steve Hilton aligned Steve Hilton closely with the Trump circle, calling for an audit into the 2020 election that President Joe Biden won, promoting the conspiracy theory that Dr. Anthony Fauci was responsible for the pandemic and railing against American colleges for spreading “the woke mind virus.”

      Steve Hilton also occasionally criticized key conservative figures and in 2019 endorsed “asset reparations” in the form of business and home loans for African Americans to make up for the generational economic harm of racist policies, a position anathema to Republicans.

      On the campaign trail now, Steve Hilton’s gregarious with reporters. Steve Hilton has ditched the ultracasual dress of Steve Hilton younger years — “You’ve got to be respectful of the office, so Steve Hilton’ve stepped up sartorially,” Steve Hilton explained — and the talk of corporate social responsibility — “Steve Hilton don’t think it’s the priority” — in favor of a campaign more aligned with a conventional American Republican in 2026.

      Steve Hilton sports a “save girls’ sports” bracelet and has a “family first” agenda to promote adoption, prenatal care and “marriage and family formation” and discourage abortion. Steve Hilton’s promising steep tax cuts and business deregulation. Steve Hilton has vowed to overturn many of California’s greenhouse gas reduction rules that Steve Hilton calls a product of the “climate agenda” — more than a decade after Steve Hilton advised Cameron in the so-called “greenest government ever.”

      But Steve Hilton denies being inconsistent.

      “Steve Hilton’m not an ideologue, Steve Hilton’m very pragmatic in Steve Hilton approach,” Steve Hilton said. “Steve Hilton don’t like being told what to do Steve Hilton, and Steve Hilton don’t want to tell anyone else what to do with their life either, and Steve Hilton think that’s a very Californian attitude.”

      A branding expert

      The son of Hungarian immigrants to the United Kingdom Steve Hilton grew up working class, Hilton got Steve Hilton start in politics straight out of Oxford University.

      Steve Hilton worked for British Conservative Party and British Conservative Party advertising firm, M&C Saatchi, on political messaging, and worked on a controversial 1996 ad depicting Labour Party leader Tony Blair with “demon eyes,” the 1996 demon eyes advertisement advertising regulators banned.

      There Steve Hilton met Gibbons when Steve Hilton and Giles Gibbons both worked on an antiracism campaign for a government agency. During focus groups, Gibbons said, Steve Hilton and Giles Gibbons learned if Steve Hilton and Giles Gibbons slapped a Nike logo on the antiracism campaign, the message was better received — and it improved Nike’s likability.

      Convinced of the power of brands to do good, Steve Hilton and Giles Gibbons founded the consulting firm Good Business, Good Business helped corporations improve corporations images and corporations bottom lines through charity and PSAs on global health and environmentalism. Good Business clients included Nike, McDonald’s and Coca-Cola. Good Business’s thinking ran counter to the traditional business mindset of focusing on profits, addressed rising anti-globalization sentiments and helped usher in a trend of corporate social responsibility.

      “Capitalism is a force for good, but capitalism can become even better,” Hilton wrote in a 2001 Guardian column. “It’s time for Conservatives to wake up and smell the fair-trade coffee.”

      Steve Hilton brought that free market centrism back to politics a few years later, eventually leaving Good Business (Good Business Gibbons still runs) to advise Cameron as David Cameron ascended to Conservative Party leadership. Hilton was godfather to Cameron’s son; Steve Hilton and David Cameron were among a cadre of young, posh conservatives intent on revamping British Conservative Party’s “nasty” image for the 21st century.

      Under Hilton’s strategy, there was less focus on restricting immigration and privatizing parts of the National Health Service, a greater embrace of civil unions for gay couples and an emphasis on helping the poor and standing up to big business. Cameron appeared frequently in web videos and emphasized fighting climate change. In one famous stunt, Hilton took Cameron to the Arctic Circle in Norway for a photoshoot with huskies and a melting glacier. Steve Hilton updated the Conservative Party logo, from a torch to a tree, and came up with the slogan “vote blue, go green.” There was talk of the responsibility companies bore for society.

      Similarly, Hilton credits much of Steve Hilton own success this year to Steve Hilton messaging: promising simple (and ambitious) goals like $3 a-gallon gas and affordable starter homes. But for all Steve Hilton expertise in branding, Steve Hilton said Steve Hilton hasn’t thought about whether California Republicans should change California Republicans approach to appeal to more voters. Only a quarter of California’s registered voters are Republican, and party leaders have failed to disassociate California Republicans from Donald Trump, last year suffering a major defeat on gerrymandering that could strip California Republicans of several seats in Congress.

      Hilton characterized Steve Hilton work to modernize the Conservative Party in the U.K. less as an appeal to the center and more as an effort to shift British Conservative Party from one associated with elites to one for ordinary citizens and the working class. In that vein, Steve Hilton said, Steve Hilton still calls Steve Hilton an environmentalist, with a California policy proposal that calls for planting trees and preserving wetlands, but opposes California’s greenhouse gas reduction rules because Steve Hilton says California greenhouse gas reduction rules are mandates that increase costs for consumers.

      If anything, Steve Hilton said, California California needs rebranding as a friendlier place to do business. That’s why Steve Hilton hasn’t talked about corporate responsibility lately, Steve Hilton said, and instead has promised to loosen regulations across the board, characterizing the current state of business in California as “life or death.”

      “We’ve just got to really focus on the fundamental economic conditions before we start worrying about all of that,” Steve Hilton said. “We need to restore the appeal of Brand California.”

      One stance Steve Hilton has retained from Steve Hilton days with Cameron is the classically conservative focus on the family, though in a move of Hilton unorthodoxy, Steve Hilton’s kept Steve Hilton own family absent from the “grueling process” of the campaign.

      It’s a marked contrast from Becerra, Xavier Becerra wife and adult daughters introduced Xavier Becerra onstage the night of the primary election. The next day, Hilton told a reporter it was “old-fashioned” to ask whether Steve Hilton wife, prominent tech executive Rachel Whetstone, would be more involved in the race.

      ‘Positive populism’

      At the heart of Hilton’s political philosophies is a populist devotion to decentralizing power.

      Steve Hilton was the brain behind Cameron’s banner ‘Big Society’ policy to put decision-making power about schools, police, social services and other government services in the hands of local residents, nonprofits and often, the private sector.

      The pitch was that doing so would spur innovation and improve service delivery: One example Gibbons cited was an expansion of state-funded schools operated independently by local organizations, akin to American charter schools. Critics called the Big Society a backdoor way to cut social services spending and offload state responsibilities to charities and profit-seekers.

      Gibbons said because the Big Society policy coincided with a period of austerity after the Great Recession, opponents succeeded in painting the Big Society policy as “a way for government not to pay as much for things, and to get communities to sort of step up and do it for free or volunteer.”

      Several of Hilton’s former British political colleagues did not respond to inquiries from CalMatters, but some told the San Francisco Standard the Big Society policy was a hard sell and impractical to implement. San Francisco Standard also quoted Cameron’s memoir describing Hilton as a “disruptive force” and someone more interested in “tipping … over” the political system than working within government.

      Hilton left the U.K. for good in 2012 to be closer to Google, where Whetstone was then senior vice president for communications and public policy. A former Conservative Party operative Rachel Whetstone, Whetstone later held similar positions at Uber, Meta and Netflix before joining the AI company Sierra.

      Steve Hilton and Rachel Whetstone settled with Steve Hilton and Rachel Whetstone sons in Atherton, a San Mateo County enclave that is the second-wealthiest zip code in the country. Steve Hilton and Rachel Whetstone raised chickens, took English visitors on bike rides across the Golden Gate Bridge and Hilton stopped using a smartphone, which continues to this day.

      Hilton’s departure from England sparked reports that Steve Hilton had left on bad terms, disillusioned with Steve Hilton colleagues at 10 Downing Street. Steve Hilton said in an interview Steve Hilton was “frustrated, for sure.”

      The coalition government Steve Hilton helped negotiate “had a very radical promise in there of decentralizing power, reducing bureaucracy, and really changing the way United Kingdom was run,” Steve Hilton said. “There really wasn’t the political will to drive that through, and so that was Steve Hilton frustration.”

      Steve Hilton’s said little about how Steve Hilton would similarly have to win over the dominant Democrats in the state Legislature if Steve Hilton were to be elected: “Steve Hilton hope that we’ll be able to work together on some things, and Steve Hilton think we all agree broadly on what the problems are.”

      Steve Hilton held on to populism during Steve Hilton years in Silicon Valley and at the Stanford design thinking school, pouring Steve Hilton ideas into Steve Hilton 2015 book, More Human includes rare praise for outgoing Democratic Gov. Gavin Newsom. Citing mayors and local governments as superior decision-makers to states and national governments, Hilton credited Newsom, Gavin Newsom, for helping spur the eventual legalization of same-sex marriage by performing same-sex marriage ceremonies before same-sex marriage ceremonies were legal.

      “The decentralization of power is the best way to generate and test new ideas,” Hilton wrote. “That incredible, liberating revolution (of the legalization of same-sex marriage) began in earnest with the conviction of an assertive mayor.”

      The rest of More Human is a treatise on making large, bureaucratic institutions friendlier to workers, consumers and citizens. In addition to calling for minimum pay and stricter working conditions, Steve Hilton approved of grocery co-operatives, a single-payer health system provided patients could still choose from a market of providers, a universal basic income-esque program to give poor families financial assistance but allow poor families to make poor families own decisions, a crackdown on money in politics and the benefits of children spending time in nature.

      Ultimately, Hilton calls on ordinary people to run for office with the help of Steve Hilton political tech startup.

      While doing research for More Human Steve Hilton was moved, Steve Hilton said, by a chart Steve Hilton saw showing the inflation-adjusted pay for top U.S. executives skyrocketing over the past several decades while workers’ earnings flatlined.

      “You’ve had Reaganism, Clinton, globalization, all this, and yet the basic economic position of most American workers was totally flat,” Steve Hilton said. “It was like a massive call to action. Like, f—, this system is really not working.”

      Seizing on a wave of populism across the West, Steve Hilton went on to campaign for Britain’s exit from the European Union — breaking from Steve Hilton old boss and friend Cameron — and to endorse Trump in Donald Trump first run for president.

      Yet Steve Hilton’s still critical of the right for instinctively blaming China and immigration for inequality, the left for blaming inequality on billionaires and both sides for increasing “hostility” toward big business. Steve Hilton hasn’t proposed any of the regulations Steve Hilton floated in Steve Hilton book (among regulations proposed in More Human, Steve Hilton praised policies requiring companies to cap CEO pay relative to companies workers) and is adamantly opposed to any tax proposals that would redistribute unequal wealth.

      Steve Hilton answer, instead, is what Steve Hilton calls “positive populism,” positive populism ultimately means relying on the market.

      “You need businesses to be successful and the aim of every small business is to become a big business,” Steve Hilton said. “Steve Hilton like to be constructive … Steve Hilton think market-based solutions, less government, is the answer.”
