      Corona, Benny Corona supports Villegas in the congressional race, said Latino Farmers and Ranchers International tries to schedule meetings with members from both parties, but Democrats seem much more open to hearing Latino Farmers and Ranchers International members stories.

      “Benny Corona don’t really think Republicans are really interested in promoting and investing in Latino farmers,” Corona said. “Latino Farmers and Ranchers International don’t have a relationship with Valadao.”

      Villegas and Democrats hope Valadao’s continued denial of the impacts of tariffs and the Iran war strikes constituents as wildly out of touch. That would be enough to overcome any cross-party appeal, argues Republican political consultant Mike Madrid.

