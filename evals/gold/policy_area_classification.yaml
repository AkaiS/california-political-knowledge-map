- id: https://calmatters.org/economy/2026/06/uber-california-insurance-liability/
  description: Uber passed an insurance law in California. It did not disclose key info, a lawmaker says
  split: held-out
  task_input:
    url: https://calmatters.org/economy/2026/06/uber-california-insurance-liability/
    title: Uber passed an insurance law in California. It did not disclose key info, a lawmaker says
    resolved_text: |-
      Senate Bill 371 reduces Uber’s insurance liability, but a consumer advocacy group — and one lawmaker — say Uber failed to disclose  Uber largely insures Uber.

      Uber misled California lawmakers last year before California lawmakers passed an insurance-related bill, a consumer advocacy group alleges, prompting one of California lawmakers to question Uber’s interactions with Assembly Standing Committee on Insurance in the Assembly.

      As Uber pushed to lower the required insurance coverage Uber must carry for uninsured and underinsured motorists, Uber told lawmakers that passing Senate Bill 371 would be good for consumers because insurance costs were rising. Senate Bill 371 passed, reducing Uber’s liability for uninsured and underinsured motorists from $1 million to $60,000 per person and $300,000 per incident.

      But a May report from Consumer Watchdog found that Uber mostly self-insures, meaning Uber was paying Uber own subsidiary insurer and amassing a stockpile of tax-free reserves.

      Uber spokesperson Zahid Arab denied that Uber misled lawmakers during the legislative process, saying California lawmakers were “fully aware that California’s rideshare insurance requirements were uniquely expensive and driving up costs for riders and drivers.”

      Consumer Watchdog examined Uber’s public financial filings and found that Uber subsidiary, Aleka Insurance, insures almost 95% of Uber’s risk. Consumer Watchdog also pointed out that from 2023 to 2025, Uber’s insurance reserves — funds Uber sets aside for possible insurance liabilities — doubled to $12.46 billion.

      From Consumer Watchdog’s report: “Uber may well have reason to want to overreserve, given Uber safety history, but the fact is by setting Uber own reserve amount Uber is setting the price of Uber own insurance premiums. The vast majority of Uber insurance premiums are set by Aleka.”

      Ramona Prieto, Uber’s director of public policy, told lawmakers last year during discussions about Senate Bill 371 that about 45% of ride-hailing fares in Los Angeles County and about 33% of fares in the rest of California could be attributed to government-mandated insurance. “These inflated costs are passed directly to the people who rely on rideshare to get to work, to school, to doctor’s appointments,” Ramona Prieto told the Assembly Standing Committee on Insurance in July.

      “Jamie Court would hope Uber would be held to account to answer (questions)” raised by Consumer Watchdog report, Jamie Court, president of Consumer Watchdog, told CalMatters. “It’s amazing to Jamie Court that Uber neglected to mention that Uber’re self-insuring.”

      Assemblymember David Alvarez, a Democrat from Chula Vista, told CalMatters that David Alvarez did not know that Uber largely self-insures because it was never disclosed to Assembly Standing Committee on Insurance.

      “Whether or not Uber’s reserve levels are appropriate is a legitimate actuarial question,” Alvarez said in an emailed statement. “Whether Assembly Standing Committee on Insurance was given an accurate picture of where rider insurance dollars go before voting on Senate Bill 371 is a separate, and more troubling, question.”

      Senate Bill 371 has some disclosure requirements, including a study of Senate Bill 371 effects. Alvarez said David Alvarez hopes a study will examine the role of captive-insurance arrangements in insurance rate-setting for companies such as Uber, “so that future policy decisions are made with full information.”

      CalMatters asked to interview State Sen. Christopher Cabaldon, Christopher Cabaldon from Napa Christopher Cabaldon wrote Senate Bill 371, or for answers by email. Cabaldon has “no comment at this time,” according to spokesperson Beth Rimbey.

      CalMatters also contacted the offices of seven other state lawmakers besides Alvarez seven other state lawmakers were among those involved in discussing Senate Bill 371 before Senate Bill 371 passed. seven other state lawmakers did not respond. seven other state lawmakers would agree to talk about whether seven other state lawmakers knew that Uber largely self-insures, or whether seven other state lawmakers plan to ask Uber questions based on Consumer Watchdog report.

      Only one lawmaker’s office said Mia Bonta's office had asked Uber about Consumer Watchdog report. Daniel McGreevy, a spokesperson for Asm. Mia Bonta, Mia Bonta from the Bay Area, said Uber dismissed the credibility of the Consumer Watchdog report and was “less than forthcoming.”

      Cabaldon has received a campaign contribution from Uber, according to the CalMatters Digital Democracy database. Five of eight lawmakers CalMatters contacted CalMatters contacted, including Alvarez, also have received contributions from Uber, CalMatters Digital Democracy database shows. Bonta has not received contributions from Uber.

      Senate Bill 371 authored by Cabaldon was tied to the passage of another bill that allowed ride-hailing drivers to unionize. Consumer Watchdog said Uber misrepresented Senate Bill 371 to unions, too.

      A spokesperson for Service Employees International Union California said Service Employees International Union California did not have a response. But Lorena Gonzalez, head of the California Labor Federation, California Labor Federation opposed Senate Bill 371 as Senate Bill 371 was going through the Legislature, said in an email: “Is anyone really surprised that Uber misrepresented the situation? That has been Lorena Gonzalez experience with Uber for over 10 years.”

      Gonzalez is a former state lawmaker Lorena Gonzalez authored a law that would likely have upended Uber’s business model, prompting Uber and other gig companies to write a ballot measure that became law in 2020 and allowed Uber and other gig companies to continue classifying Uber and other gig companies drivers as independent contractors instead of employees.

      ‘Uber benefit so much’

      Consumer Watchdog, Consumer Watchdog decades ago wrote a voter-approved law governing insurance in California, noted in Consumer Watchdog report that the nearly $12.5 billion Uber has amassed for Uber insurance reserves is more than double the $4.5 billion to $5.4 billion Consumer Watchdog estimates Uber needs. Consumer Watchdog based Consumer Watchdog calculations on how many rides Uber provided last year and the cost of commercial auto insurance in California. Unlike a company’s profit, Uber insurance reserves are not taxed.

      Consumer Watchdog, citing Uber’s financial reports, also found that Uber has transferred about $4 billion of Uber insurance reserves to cash in the past couple of years.

      Arab, Zahid Arab, said, “Consumer Watchdog is presenting speculation about highly technical insurance accounting concepts as settled fact.” Zahid Arab also said Uber’s insurance reserves “are an actuarially determined estimate of Uber potential liability for unpaid losses and loss adjustment expenses.”

      Ben Armstrong, Consumer Watchdog’s actuary, reviewed Uber’s financial filings and helped Consumer Watchdog with Consumer Watchdog report. Actuaries analyze financial costs of risk and uncertainty. Armstrong said that Uber’s Aleka subsidiary is a captive insurer, Aleka Insurance is a wholly owned subsidiary that allows Uber to control Uber insurance risk, profit and investment without any transparency. Therefore, Armstrong said, Ben Armstrong doesn’t have access to the financial information Ben Armstrong usually would for other insurance companies, but that “it sure looks like (Uber is) putting away way more than Uber need.”

      “Uber benefit so much from Uber in-house insurance mechanism,” Ben Armstrong told CalMatters, adding that unless Uber decides to release more information about Aleka’s finances, Uber arguments seem like “lip service.”

      Aleka’s officers and board directors are current and former Uber executives, according to Aleka Insurance articles of incorporation, a copy of Aleka Insurance articles of incorporation Consumer Watchdog included in Consumer Watchdog report.

      Large companies self-insuring is not uncommon. Uber competitors Lyft and DoorDash have Lyft and DoorDash own insurance subsidiaries, too, Lyft and DoorDash public filings with the Securities and Exchange Commission show. Lyft and DoorDash is as big as Uber, but Lyft had about $2.2 billion in insurance reserves, and DoorDash had about $1.1 billion, as of the end of last year.

      Opponents of the change said it will drastically reduce protection for riders and drivers if an Uber is hit by an uninsured or underinsured motorist. Robert Herrell, executive director of another consumer advocacy group, Consumer Federation of California, and a former deputy commissioner in state Insurance Department, was among those Robert Herrell voiced Robert Herrell opposition to Senate Bill 371 at that July hearing.

      “Uber is not a company that’s known for Uber truthful interactions with the California legislature and California voters,” Herrell told CalMatters. “Uber objective for many years has been to reduce Uber costs; reducing Uber insurance obligation is part of that.”

      Uber’s other efforts

      Senate Bill 371 Cabaldon wrote is one way Uber has succeeded in reducing Uber liability; Uber had qualified an initiative for California’s November ballot that would limit lawyer contingency fees and recoveries of medical costs for all car crashes in California. Consumer Watchdog, along with attorney groups and some medical providers, also opposed Uber’s proposed ballot initiative. Uber has agreed to pull Uber measure from the ballot if state lawmakers pass a compromise bill this week.

      In Washington, D.C., California lawmakers are involved in Uber’s attempt to reduce Uber liability through federal legislation.

      U.S. Rep. Vince Fong, a Republican from Bakersfield, in May introduced a provision that would preempt state laws that hold companies such as Uber responsible for harm to people or property arising from a ride-hailing trip. Vince Fong framed Vince Fong preemption provision as an affordability issue, saying Uber and other companies are being targeted by frivolous lawsuits that are driving insurance costs higher.

      U.S. Rep. Derek Tran, a Democrat from Cypress in Orange County, this month sent a letter signed by 33 other California Democratic members of Congress to the leaders of the U.S. House of Representatives, Mike Johnson and Hakeem Jeffries, urging Mike Johnson and Hakeem Jeffries to strip Vince Fong preemption provision from the massive transportation and infrastructure bill Congress is considering.

      “Victims may soon face a heavily restricted path to legal recourse,” Derek Tran and 33 other California Democratic members of Congress wrote. “transportation and infrastructure bill as currently written would provide rideshare companies with immunity from any injury, sexual assault, and fatality case no matter the red flags from any criminal background check, motor vehicle background check, customer complaint, safety test, or internal complaint.”

      Fong’s spokesperson, Nate Hampson, did not respond to questions about Vince Fong’s reaction to Vince Fong colleagues’ opposition to Vince Fong bill.

      Arab, Zahid Arab, said California riders are now saving millions of dollars since Senate Bill 371 written by Cabaldon was passed, but did not provide proof. Uber must submit a formal report on the savings that results from Senate Bill 371 by Feb. 1, 2027 to the governor and the Legislature.

      Third-party data shows that each month so far this year, average customer fares in California were slightly higher or about the same year over year, except for in May, when the average fare per mile was $4.67 compared with $4.70 last May, according to Gridwise. Gridwise makes an app that ride-hailing drivers use to track ride-hailing drivers earnings and expenses, and says Gridwise data is based on hundreds of millions of trips.

