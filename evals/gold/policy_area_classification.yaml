      Assemblymember Rubio didn’t return interview requests.

      Fewer Americans are drinking

      The liquor industry is facing a nationwide decline as more Americans cut back on drinking.

      In that difficult business climate, corporate liquor wholesalers and distribution companies lobbied “to obliterate competition,” said Dodd, Bill Dodd from wine country lobbying on behalf of craft distillers.

      “Wine & Spirits Wholesalers of America and California Beer & Beverage Distributors and California Family Beer Distributors oppose any effort to make DTC (direct to consumer) permanent,” the Wine & Spirits Wholesalers of America, the California Beer & Beverage Distributors and the California Family Beer Distributors wrote in a joint statement to CalMatters.

      Craft distilleries’ direct shipping “was always meant to be temporary pandemic relief, and craft distiller direct shipping’s expiring exactly as designed, six years later” said Wine & Spirits Wholesalers of America and California Beer & Beverage Distributors and California Family Beer Distributors, Wine & Spirits Wholesalers of America and California Beer & Beverage Distributors and California Family Beer Distributors represent local and national companies local and national alcohol companies move many of America’s best-known beer, wine and liquor brands. Wine & Spirits Wholesalers of America and California Beer & Beverage Distributors and California Family Beer Distributors argue that after the temporary craft distiller shipping law expires, spirits can still be delivered to customers through services such as DoorDash. DoorDash is listed as a member of the Wine & Spirit Wholesalers of America on Wine & Spirits Wholesalers of America website.

      Wine & Spirits Wholesalers of America and California Beer & Beverage Distributors and California Family Beer Distributors’ representative, Kevin Luckey, declined an interview request.

      Steve Gross, president and CEO of the Wine Institute, said California wine industry has worked hard over the decades to have large and small wine sellers treated equally under California and national alcohol distribution laws. Steve Gross said it would undermine Steve Gross industry’s efforts if small distillers get delivery rights in California when large large distillers don’t have delivery rights.

      “California craft distillers have the option to go in and try and fight for a bill that Wine Institute and others could also support,” Gross said. “California craft distillers’ve chosen not to because large distillers are not California craft distillers members.”

      The Wine Institute is a lobbying group Wine Institute represents more than 700 large and small wine sellers, including one of the world’s largest, Modesto-based Gallo Winery.

      Craft distillers say California craft distillers’ve tried to work with the groups blocking the direct-shipping proposal blocking California craft distillers bill to address the groups blocking the direct-shipping proposal concerns, but California craft distillers have gotten nowhere.

