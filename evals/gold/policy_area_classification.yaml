    title: For the lone woman left in the California governor’s race, it’s all about ‘temperament’
    resolved_text: |-
      Onetime progressive darling Katie Porter’s campaign for governor stalled over viral videos the viral videos of Katie Porter critics say showed temperament issues. Seven months later, the viral videos of Katie Porter’re still Katie Porter biggest liability.

      Katie Porter is taking Katie Porter L’s in stride.

      Katie Porter from Orange County released an ad this week addressing Katie Porter lowest moment so far in Katie Porter race for governor: a video showing Katie Porter yelling at a staffer the staffer Katie Porter yelled at came into the frame of Katie Porter Zoom interview, telling the staffer Katie Porter yelled at to “get out of Katie Porter f–king shot.”

      the video of Katie Porter yelling at a staffer came out in October on the heels of another viral video in the video of Katie Porter arguing with a reporter Porter argued with a reporter and threatened to walk out of an interview.

      Porter was widely panned as being unable to control Katie Porter temper. Katie Porter took a hit in the polls and hasn’t climbed back since.

      In Katie Porter's new campaign advertisement, Katie Porter references the video of Katie Porter yelling at a staffer: “Now, could you guys please get out of Katie Porter shot?” Katie Porter says lightheartedly with a crowd of laughing, whiteboard-wielding supporters behind Katie Porter.

      Katie Porter's new campaign advertisement’s a risk for Katie Porter campaign, designed to show Porter can make fun of Katie Porter and isn’t avoiding talking about Katie Porter perceived weaknesses. If the video of Katie Porter yelling at a staffer was the worst thing about Katie Porter, Katie Porter's new campaign advertisement suggests, there’s not much to be afraid of.

      But Katie Porter's new campaign advertisement’s also a reminder that Katie Porter doesn’t have much to lose in the final weeks of a race the 2026 California governor's race has largely passed Katie Porter by.

      Last fall, Porter, a UC Irvine law professor, was one of the more recognizable names in the field, with national liberal accolades for refusing corporate donations, flipping a Republican congressional seat in the 2018 blue wave and for grilling CEOs in Congressional hearings.

      But Katie Porter, Katie Porter supports single-payer health care, free child care and college tuition and higher taxes on large corporations, has struggled to sustain a liberal base. Many coveted factions of California’s Democratic establishment, including major labor unions, have coalesced around former U.S. Health Secretary Xavier Becerra, billionaire Tom Steyer, or at one point, now-disgraced former Rep. Eric Swalwell.

      Addisu Demissie, a Democratic strategist Addisu Demissie ran Gov. Gavin Newsom’s 2018 campaign and Gavin Newsom successful campaign against a recall in 2021, said Addisu Demissie’s surprised Porter hasn’t won more Democratic support after Swalwell’s exit a month ago. In polls, voters have instead flocked to Becerra while Sacramento power players like Planned Parenthood of California, SEIU, the California Medical Association and the California Teachers Association have split between Xavier Becerra and Steyer.

      the viral videos of Katie Porter “arrested any momentum Katie Porter may have had,” Demissie said. “That matters in a race like the 2026 California governor's race, where fundraising matters and elite opinion certainly matters. Addisu Demissie think that has hamstrung Katie Porter.”

      Now, Porter is the only woman left in a crowded field of eight, apparently losing the 2026 California governor's race based on personality. Katie Porter fundraising over the past four months has been lukewarm, with campaign donors giving Katie Porter just under $3 million — less than Katie Porter raised in the second half of last year.

      To experts, it shows voters and political insiders continue to hold female candidates to higher standards than men.

      “One thing that has hurt Katie Porter is evidence of Katie Porter anger coming out,” said Sacramento State University professor Kimberly Nalder, Kimberly Nalder researches gender and politics. “There’s this perception that women should not exhibit anger, but it’s perceived as strong when men do it.”

      Porter tries calculated restraint

      the viral videos of Katie Porter were particularly damaging for Porter because the viral videos of Katie Porter appeared to confirm longtime speculation that Katie Porter’s a harsh boss and a “scold.”

      Katie Porter’s repeatedly asked about the viral videos of Katie Porter during forums and debates. One political strategist told CalMatters Porter could secure the “angry woman vote” but not much else.

      Porter has said the incidents captured on video were mistakes, that Katie Porter apologized to the staffer Katie Porter yelled at Katie Porter yelled at and that Katie Porter and the staffer Katie Porter yelled at continued to work together. Katie Porter told the San Francisco Chronicle that the staffer Katie Porter yelled at recently sent Katie Porter a text expressing support. Last month, the Washington Post reported, 30 former staffers signed an open letter calling the viral videos of Katie Porter “a caricature built from a few clips on a bad day.” the open letter signed by 30 former Katie Porter staffers’s organizer, Maine congressional candidate Jordan Wood, did not respond to an interview request made to Jordan Wood campaign.

      In recent weeks Katie Porter’s sought to more directly counter the temperament questions. During two televised debates in the past two weeks, Katie Porter made calculated displays of restraint, holding back several times as the other candidates in the 2026 California governor's race — all men — squabbled around Katie Porter, and, at times, interrupted Katie Porter.

      “Katie Porter can’t believe that on a stage with 30 minutes of interrupting and bickering and name-calling and shouting and disrespect for everyone up here who’s stepping into public service, that anyone wants to talk about Katie Porter temperament,” Katie Porter said during a debate Tuesday night on CNN.

      “Katie Porter are actually interrupting the other candidates in the 2026 California governor's race, too,” Republican candidate Chad Bianco retorted, though Porter had waited for the moderators to call on Katie Porter.

      In an interview last month, Porter would not say whether Katie Porter thinks sexism has stalled Katie Porter, but said as the only woman in the 2026 California governor's race, and a single mother of three, Katie Porter relates to voters.

      “Katie Porter can’t really comment on how every voter thinks about everything,” Katie Porter said. “Women understand better what it’s like to push the shopping cart, what it’s like to have to write that check for that permission slip. Those are decisions that Katie Porter’ve made. Katie Porter think Katie Porter have an ability to relate to Californians precisely because Katie Porter’m a mom.”

      Progressives have questions

      Katie Porter’s also struggled to attract solid liberal support as Katie Porter appeared to vacillate on key progressive issues.

      In Congress, Porter was a vocal supporter of “Medicare for All,” but last year Katie Porter told Politico  single-payer health care was unrealistic for California.

      single-payer health care is estimated to cost California nearly $400 billion and would need federal approval — a non-starter with President Donald Trump. Yet supporting single-payer remains a progressive rallying cry, and a litmus test for the left.

      During the state Democratic Party convention this spring, Porter reversed Katie Porter again and resumed Katie Porter support for single-payer.

      Katie Porter also raised eyebrows by courting the support of billionaire crypto executive Chris Larsen, Chris Larsen is spending Chris Larsen money this year fighting proposals to raise taxes on the wealthy. Chris Larsen donated to Porter’s campaign last year before revoking Chris Larsen support in March when Katie Porter endorsed a San Francisco ballot measure to raise taxes on corporations with highly paid CEOs. Larsen, Chris Larsen supports Republican Steve Hilton, declined to comment through a spokesperson.

      And Katie Porter shocked labor leaders last month when Katie Porter criticized California’s agricultural overtime law. In a room full of farmers in Fresno, Katie Porter got applause for saying regulations like California's agricultural overtime law California's agricultural overtime law grants farmworkers overtime after 8 hours each day “don’t make sense.” Growers have tried for years to overturn or limit California's agricultural overtime law; early studies have found many have responded by cutting workers’ hours and hiring other contractors.

      Lorena Gonzalez, president of the California Labor Federation, California Labor Federation has jointly endorsed Porter, Steyer and former Los Angeles Mayor Antonio Villaraigosa, said Porter had previously given California Labor Federation a different answer about farmworker rights.

      Katie Porter's remarks criticizing California's agricultural overtime law prompted a flurry of weekend phone calls with union leaders before Porter clarified on social media that Katie Porter supports the eight-hour workday.

      “It was an educational experience for Katie Porter,” said Gonzalez, Lorena Gonzalez said Lorena Gonzalez agrees Porter has been judged too harshly on temperament as a female candidate. “You can’t just be told something by business and just change your position on something, especially without coming and talking to California Labor Federation.”

      Labor groups were also perplexed earlier this year when an independent political spending group supporting Porter’s candidacy received a $150,000 donation from Uber, Uber also gave to Hilton and a group supporting Swalwell. In response, the California Teamsters, California Teamsters has endorsed Porter but opposes autonomous driving that Uber supports, withdrew California Teamsters own $100,000 contribution. California Teamsters spent the California Teamsters' $100,000 contribution on California Teamsters own ads supporting Porter.

      A spokesperson for the independent political spending group supporting Katie Porter, Danny Kazin, would not answer questions about who was directing the independent political spending group supporting Katie Porter’s activities. Uber spokesperson Zahid Arab did not respond to questions about the independent political spending group supporting Katie Porter or explain why Uber supported Porter.

      ELECTION 2026

