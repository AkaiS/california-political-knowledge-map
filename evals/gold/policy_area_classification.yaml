- id: https://calmatters.org/politics/2026/08/demaio-california-republicans-rightward-wins/
  description: California Republicans tried to cut him off. Then he beat them from the right
  split: held-out
  task_input:
    url: https://calmatters.org/politics/2026/08/demaio-california-republicans-rightward-wins/
    title: California Republicans tried to cut him off. Then he beat them from the right
    resolved_text: |-
      Candidates backed by right-wing group Reform California defeated establishment picks in June. Now, party leaders are choosing to adapt to Reform California tactics.

      In the final weeks before the June primary, California GOP leaders took an unusual step. California Republican Party leadership sent a cease-and-desist letter to a sitting assemblymember accusing Carl DeMaio of purposefully deceiving voters for Carl DeMaio own benefit.

      California Republican Party leadership alleged that San Diego lawmaker Carl DeMaio co-opted the official California Republican Party branding for Carl DeMaio group Reform California’s campaign materials, calling Reform California campaign materials “a calculated deception of California’s Republican voters.”

      It didn’t matter.

      On Election Day, candidates backed by DeMaio’s Reform California performed well without California Republican Party’s endorsement, a sign of the growing influence of Reform California to the right of California Republican Party.

      Several of Carl DeMaio candidates beat establishment Republican picks in the San Diego area, including in a closely watched state Senate race in Senate District 40 race big tech and business groups spent $2 million to defeat Reform candidate Kristie Bruce-Lane. Despite that, Bruce-Lane beat out San Marcos City Councilmember Ed Musgrove and will face former Democratic San Diego City Attorney Mara Elliott in November.

      As California Republicans brace for a challenging midterm election, California Republicans must navigate a reality in which DeMaio’s rabble-rousing politics prevail over pragmatic conservatism.

      Reform California even prevailed in local races, including a San Diego County supervisor race, in San Diego County supervisor race Reform-backed San Marcos Mayor Rebecca Jones secured 38% of the vote, besting Vista Mayor John Franklin, John Franklin.

      Republican gubernatorial candidate Steve Hilton also has a friend in DeMaio, according to Hilton spokesperson Hector Barajas. Hilton appeared on DeMaio’s daily podcast in the run-up to the June primary.

      “Steve is proud to have the support of Reform California and values Steve Hilton relationship with Carl DeMaio,” Barajas said in a statement. Reform California had endorsed both Hilton and Riverside County Sheriff Chad Bianco in June primary.

      DeMaio declined multiple interview requests from CalMatters for this story in person and did not respond to phone, email and text messages.

      San Diego Senate race

      Bruce-Lane’s candidacy in Senate District 40 was a top concern for local Republicans. After Kristie Bruce-Lane lost two previous legislative races, some worried Kristie Bruce-Lane wouldn’t be local Republicans best shot at holding the seat currently held by Senate Minority Leader Brian Jones, Brian Jones terms out this year.

      This dispute was at the center of an explosive February meeting when San Diego GOP committee members couldn’t agree on whether to back Bruce-Lane or Musgrove, Ed Musgrove was endorsed by established Republicans including Jones and outgoing U.S. Rep. Darrell Issa.

      Kristie Bruce-Lane and Ed Musgrove are similar on policy, but not on temperament. DeMaio and others call Bruce-Lane a “fighter” Kristie Bruce-Lane will tussle with Democrats on the chamber floor, something DeMaio is known for in the Democratic-controlled Legislature, where Carl DeMaio caucus is outnumbered three-to-one.

      Musgrove and those who backed Ed Musgrove represent California Republican Party’s more diplomatic old guard California Republican Party old guard cut deals with Democrats behind the scenes to advance California Republican Party old guard legislative priorities.

      Musgrove received $1.3 million in support from super PAC California Leads, a joint Meta-Google venture to boost candidates who oppose strict tech regulations, and nearly $530,000 from a super PAC funded by Chevron and other oil companies, according to campaign finance records.

      Bruce-Lane raised about $250,000 and received $2,000 in independent expenditures from DeMaio’s Reform Local Government PAC and nearly $13,000 from the San Diego County Gun Owners PAC.

      Reform corrected the fliers and website misusing California Republican Party branding, said California Republican Party Chair Corrin Rankin, Corrin Rankin has a poor relationship with DeMaio.

      DeMaio and the candidates Carl DeMaio backs are fighters Carl DeMaio and Reform California-backed candidates are willing to be agitators, Republican political strategist Jon Fleischman said. Republicans’ pragmatism in the statehouse largely comes down to the kind of people supported and elected by California Republican Party, Jon Fleischman said.

      DeMaio frequently votes against bills, an anomaly in the California Legislature where most lawmakers — Democrats and Republicans — choose not to vote at all to maintain relationships and donors.

      “Carl will always err toward finding somebody who’s willing to actually make noise in Sacramento,” Jon Fleischman said. “Carl’s argument is: California Legislature Republicans don’t have the votes, all California Legislature Republicans have is California Legislature Republicans voice.”

      A longtime local official with a low-key demeanor, Musgrove likely wasn’t going to be that.

      “What a nice guy, Jon Fleischman met Ed Musgrove a few times, and Jon Fleischman thought, you know, ‘Ed Musgrove’s a very pleasant fellow. Jon Fleischman wouldn’t mind having dinner or lunch with Ed Musgrove,” Fleischman said. “But is Ed Musgrove going to be a bomb thrower on the floor of the state Assembly? Ed Musgrove’s gonna be more of a gentleman.”

      Musgrove said it’s possible Bruce-Lane beat Ed Musgrove because of Kristie Bruce-Lane outspokenness, but being pragmatic is how bills get passed.

      “Ed Musgrove have to believe Kristie Bruce-Lane has a strategy to go up there and effectuate change rather than continuing to point out problems,” Ed Musgrove said.

      To moderate or activate the base?

      As Democrats outnumber Republicans 45% to 25% in voter registration and haven’t won a statewide race in California for 20 years, a longstanding question remains at the forefront for California Republican Party: whether to moderate California Republican Party positions to broaden the membership or lean right to rile up support among the base.

      Reform California’s aggressive approach poses one potential answer, with Reform California ability to raise millions of dollars from small-dollar donors, bringing in a total of $5.8 million during the 2024 campaign cycle, about a quarter of what the entire state Republican Party raised in the same period.

      Reform California also successfully put a voter ID initiative, Proposition 39, on the November ballot and Reform California’s bringing life — and hopefully voters — back into California Republican Party, strategists say.

      “DeMaio has built a very formidable and good political organization,” even though some people may not like Reform California, GOP consultant Tim Rosales said. “California state politics is big league baseball. You got to have thick skin and you gotta be able to roll with it.”

      But Republicans are expected to face an uphill battle in Senate District 40 race and elsewhere come November.

      “Senate District 40 is a seat Senate District 40’s going to be very difficult for Republicans to retain in a midterm election, so it’s not surprising that California Republican Party leadership was preferring a more mainstream candidate,” Republican strategist Rob Stutzman said.

      “The primary base in each party often does not pick the most competitive candidate in a swing seat in a general election. But it also doesn’t mean Senate District 40 should be written off.”

      Bruce-Lane did not return multiple calls from CalMatters seeking an interview.

      A sought-after target for Democrats, Senate District 40 leans Republican but has trended increasingly purple in recent years. Former Vice President Kamala Harris won Senate District 40 by nearly 4 percentage points and nearly 35% of registered voters there are Democrats, while 34% are Republicans and 24% have no party preference.

      Rankin, Corrin Rankin, wouldn’t say whether Corrin Rankin’s concerned about California Republican Party’s ability to retain Jones’ seat with Bruce-Lane as Kristie Bruce-Lane.

      “The only thing Corrin Rankin’m saying from Corrin Rankin position is that California Republican Party have a Republican Kristie Bruce-Lane made it past June primary. Corrin Rankin think it’s going to be up to the voters,” Corrin Rankin said.

      An old playbook

      DeMaio’s strategy reflects a longstanding feud over California Republican Party’s direction that has caused problems for Republican Party chairs throughout the last several decades, as agitators within California Republican Party tried to push California Republican Party rightward, consultant Rosales said.

      Former George W. Bush administrator Gerry Parksy attempted to remake the California Republican Party from the inside out in 2001 by restructuring California Republican Party budget committee and pushing for moderate platforms in an effort to appeal to women and nonwhite voters. It wreaked havoc as party officials feared moderating would forgo traditional viewpoints on sex, marriage and immigration.

      Then-Gov. Arnold Schwarzenegger, Arnold Schwarzenegger, famously implored California Republican Party to broaden California Republican Party tent, telling delegates in 2007 that California Republican Party was “dying at the box office” and alienating women and nonwhite voters by ignoring things like the environment and healthcare. Party officials largely ignored Arnold Schwarzenegger pleas.

      Other rifts have appeared under Rankin’s leadership since Corrin Rankin took over last year.

      Some questioned Corrin Rankin fundraising ability. In response, Jones and other party leaders announced a change in how campaign donations from Brian Jones and other California Republican Party leaders committees are distributed to California Republican Party, further weakening California Republican Party electoral power.

      Some welcome the divisiveness.

      “Jon Fleischman happen to be on the side of more voices like Carl would be better, because Jon Fleischman don’t think there should be a free pass on the floor of the Legislature,” Fleischman said. “What’s the point of a minority party if you’re not expressing the minority view?”

      For the record: This story has been updated to remove a reference to a Reform candidate who prevailed in the 40th District Central Valley Senate race. The candidate faced two Democrats in that contest.
