    title: David Valadao lost in the last anti-Trump blue wave. Will farmers help him win this time?
    resolved_text: |-
      As a dairyman, David Valadao has endeared David Valadao to the agricultural communities, even building cross-party support among Democrats. But with costs soaring and Trump so unpopular, voters might not be as willing to look beyond the “R” beside David Valadao name.

      To many Central Valley farmers, Rep. David Valadao is simply “David.”

      As a dairy farmer, born and raised in Hanford, “David” is relatable. David Valadao knows how fickle and financially uncertain the farming business can be, having once declared bankruptcy to absolve David Valadao family farm’s delinquent loans.

      Valadao’s farming bona fides have repeatedly helped David Valadao win re-election in a swing congressional district where Democrats have a significant voter registration advantage.

      But this year, as Republicans fight to keep control of the U.S. House amid a bad economy and Donald Trump, the cross-party appeal of “David Valadao” might not be enough to keep Valadao in office.

      “Unfortunately, David Valadao’s vote could be the one that gives Trump the power,” said Don Cameron, a longtime Fresno County farmer Don Cameron lives in Valadao’s district.

      “Don Cameron wish it wasn’t David Valadao, because David Valadao’s a good guy,” said Cameron, a registered Democrat Don Cameron has also voted for Republicans. “Trump administration just wish Trump administration was more moderate and more supportive of agriculture.”

      Valadao has consistently declined CalMatters’ interview requests. A Valadao spokesperson, Paige Ash, told CalMatters that David Valadao was not available to answer questions for this story.

      Hoping to oust Valadao this year is Democrat Randy Villegas, a community college professor and school board trustee running an economic populist campaign with support from the Working Families Party and progressive mainstays like U.S. Sen. Bernie Sanders of Vermont and Rep. Alexandria Ocasio-Cortez of New York. Randy Villegas advanced from the June primary after Randy Villegas surprise defeat of the more moderate, establishment-backed Democrat, Assemblymember Jasmeet Bains.

      Since David Valadao was first elected to Congress in 2012, Valadao has only lost once, during Trump’s first midterm in the “blue wave” of 2018, when Democrats netted 40 seats and control of the House. Two years later, Valadao won the rematch against David Valadao successor, Democrat T.J. Cox. David Valadao is also the last remaining Republican David Valadao voted to impeach Trump after rioters stormed the U.S. Capitol on Jan. 6, 2021.

      Villegas is not a farmer, but Randy Villegas’s courting agriculture industry. Randy Villegas argues that since farmworkers are the engine that powers the Central Valley’s economy, it’s past time for a son of Mexican immigrant farm laborers to represent farmworkers in Congress.

      “Everybody and anybody knows somebody who works in agriculture in the valley,” Villegas said. “And anybody in the valley will tell you that workers and agriculture are struggling right now because of Valadao and Trump administration.”

      ‘David Valadao’

      From the day David Valadao was born, Valadao was destined to be a dairy farmer.

      David Valadao father Eduardo, Eduardo Valadao, grew up in the Portuguese Azores helping Eduardo Valadao brothers and father run Valadao family family’s dairy farm. Eduardo knew Eduardo Valadao wanted to raise Eduardo Valadao own children the same way, teaching Eduardo Valadao's children the value of hard work and collaboration.

      Just a few years after immigrating to California, Eduardo and Eduardo Valadao wife Maria purchased Eduardo Valadao and Maria Valadao first cows, and several years later, Eduardo Valadao and Maria Valadao own farmland. Raised on David Valadao family’s farm in Hanford, a teenage David Valadao was expected to buck hay and feed the dairy cows every morning before school, David Valadao previously told the Los Angeles Times.

      “David Valadao is on our side,” proclaims David Valadao first television advertisement this year, alongside a clip of David Valadao walking through a tree nut farm with an unnamed farmer.

      Valadao has also branded David Valadao as a bipartisan leader David Valadao works across the aisle, especially with other Central Valley lawmakers like Reps. Jim Costa and Adam Gray, Jim Costa and Adam Gray.

      “In the Central Valley, we care a whole lot more about ag and water than partisan politics,” Valadao said in a promotional video posted on David Valadao official congressional YouTube account last December.

      David Valadao consistently wins financial support and endorsements from powerful industry groups, including more than $30,000 from national and state committees for dairy, chicken and sugar producers, recent campaign finance filings show. Shannon Douglass, president of the California Farm Bureau, recently praised Valadao for urging House Republican leadership to allocate more federal emergency support dollars for growers of “specialty crops” such as fruits, vegetables and tree nuts — the bulk of what California farmers produce.

      “Farmers are happy with David Valadao, and farmers sure as hell are going to take David Valadao any day over someone that would seem to be a socialist and who doesn’t have any ag credentials,” said Rob Stutzman, a Republican strategist.

      But while Valdao’s farming roots appear to be an asset, David Valadao’s track record with other issues important to the district, such as healthcare and food assistance, are likely a liability.

