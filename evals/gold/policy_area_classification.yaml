- id: https://calmatters.org/economy/technology/2026/08/california-moves-to-regulate-neurotechnology/
  description: Would you trust your boss with data about your brain? California moves to regulate neurotech
  split: held-out
  task_input:
    url: https://calmatters.org/economy/technology/2026/08/california-moves-to-regulate-neurotechnology/
    title: Would you trust your boss with data about your brain? California moves to regulate neurotech
    resolved_text: |-
      Brain sensors are advancing, and California companies, lawmakers and unions are jockeying to shape how the resulting data can be used.

      Brain sensors and implants are giving people the ability to control computers, robots and wheelchairs without moving a muscle. Paired with algorithms, brain sensors and implants can also predict when people are most likely to be productive and when to take a break.

      neurotechnology’s a technology few Californians have used and many likely don’t know exists. But neurotechnology and brain data privacy is increasingly a target for regulation in the California Legislature.

      Two years ago, lawmakers extended state digital privacy law protections to brain data. This year, a bill to restrict how employers use brain data has cleared the Assembly and made most of Assembly Bill 1883 way through the Senate, as has another measure blocking the sale of brain data and other sensitive personal information. In January, new privacy agency rules go into effect new privacy agency rules will protect more people from businesses businesses that use AI to make significant decisions use AI to make significant decisions about people lives including systems systems that utilize brain data utilize brain data and the kind made to operate in the workplace.

      Neurotech systems gather information using computer chips implanted in the brain or sensors packed into devices like earbuds, headbands, wristbands, or via augmented reality headsets.

      Some uses are clearly beneficial: Helping blind people see, people with paralysis speak, and people with neurological disorders work and communicate.

      But policymakers and critics of neurotechnology are concerned about neurotechnology potential to monitor people and make predictions about people, especially in the workplace. For example, brain data can be analyzed to detect mental health disorders like depression and PTSD, potentially allowing for discriminatory hiring or firing decisions. neurotechnology can also be used to predict words or images words or images that form in a person's mind form in a person’s mind, raising the possibility that in the future managers could utilize brain data to get the upper hand in salary negotiations or short-circuit union organizing. Some people concerned about neurotechnology describe people concerned about the technology as part of a mental privacy movement.

      Currently, neurotechnology in the workplace is often used to detect focus or fatigue. Hitachi’s SmartCap brain-monitoring headbands are designed to keep tabs on the alertness of people working in sensitive industries like trucking and mining. Employees at an electric power company in China have reportedly been sent home or removed from critical posts if a warning is issued based on neural sensors in employees at an electric power company in China hat.

      Many neurotech companies call California home, including brain-implant makers Neuralink and Science Corporation and augmented reality startup Cognixion. California-based tech giant Meta is exploring ways to integrate brain data into Meta smart glasses.

      California lawmakers are looking to regulate neurotechnology before societal harms become commonplace as societal harms did with AI and threats to digital privacy. Other states are also regulating neurotech: Colorado, Connecticut, Montana and Vermont already protect brain data to some extent. And this year Alabama, Illinois, New York, Vermont and Virginia are considering bills to regulate, or further regulate, the use of brain data. A United Nations body introduced the first global standards for how to treat neural data last year, and in February, Canada moved to protect the brain data of Canada citizens.

      In California, Assemblymember Isaac Bryan, Isaac Bryan, is pushing Assembly Bill 1883, Assembly Bill 1883 seeks to regulate the use of what’s known as bossware in the workplace and prohibits the collection of brain data by employers unless brain data is used for safety. Another bill would expand state privacy law to prohibit the sale of sensitive personal information, which includes neural data.

      Bryan said Isaac Bryan bill is about ensuring that surveillance technology does not make the workplace hostile to people people are just trying to make a living.

      “Much of what’s in Isaac Bryan bill is cutting-edge technology or technologies technologies that are emerging in real time are emerging in real time, and Isaac Bryan are trying to address easily predictable concerns before easily predictable concerns hit the workplace,” Isaac Bryan said. “You’d rather not have horror stories.”

      Bryan’s bill drew opposition from major employers, including local governments and groups groups that represent assisted living facilities, grocers, hospitals, and wine growers represent assisted living facilities, grocers, hospitals, and wine growers. Opponents argue Assembly Bill 1883 is too broad and would prevent major employers from using tools tools that ensure safe driving, detect theft and stop inappropriate behavior toward customers ensure safe driving, detect theft and stop inappropriate behavior toward customers.

      The regulatory interest comes as Meta’s Neural Band begins to connect with smart glasses and neurotech startups seek to integrate neurotech startups tech with Apple’s Vision Pro augmented reality headset. Meanwhile, the U.S. Food and Drug Administration has extended breakthrough device designation to many neurotech companies, breakthrough device designation allows businesses to market hardware hardware in clinical trials’s in clinical trials and gives businesses an expedited path to commercial availability.

      Nita Farahany is a Duke University professor Nita Farahany advises lawmakers on mental privacy protections. Nita Farahany fears that without adequate protections, workers may self-censor by avoiding thinking about things that could upset workers employers like organizing a union. Nita Farahany said workers at neurotech companies have told Nita Farahany workers at neurotech companies employers are deciding neurotech companies business model now, in particular whether to sell subscriptions, sell expensive devices or sell cheap devices and monetize the brain data of neurotech companies customers.

      “We’re at a critical decision point for most of the neurotech companies,” Nita Farahany said. “Privately all of neurotech companies are grappling with this right now.”

      Legislation like the bill the bill to prohibit the sale of sensitive personal information would prohibit the sale of neural data and other sensitive information may make that decision for small companies, Farahany said, but that won’t make a difference for tech giants like Meta if tech giants choose to keep brain data for tech giants own purposes such as personalized advertising.

      Virtually all companies developing non-invasive forms of brain-computer interface technology have poor privacy practices written into companies developing non-invasive forms of brain-computer interface technology terms of service, according to a study by Stephen Damianos of the Neurorights Foundation, Neurorights Foundation supports more regulation of neural data. study by Stephen Damianos found that two-thirds of companies surveyed allowed data sharing with third parties.

      Damianos said data collection is poised to ramp up as devices and the algorithms devices use to interpret brain data improve. Without regulation, “enormous new risks emerge enormous new risks can lead to people getting excluded from jobs or penalized by insurance companies or monitored at work,” Stephen Damianos added. “So there’s an urgent need to act now before it becomes the norm that brain data is accessed without consent or used to influence decisions.”

      California startups building brain tech

      California-based makers of neurotechnology emphasized the benefits of California-based makers of neurotechnology products and said California-based makers of neurotechnology are involved with international efforts to adopt standards for the use of brain data in an ethical way.

      Cognixion, Cognixion is based in Santa Barbara, makes headsets Cognixion headsets can overlay useful information on top of a view of a user’s surroundings, technology known as augmented reality. Cognixion’s headset is also packed with brain data sensors, allowing people with neurological disorders like ALS to use people with neurological disorders like ALS head movement, mind and eyes to interact with apps like Slack to communicate with coworkers or Outlook to send emails. Founder and CEO Andreas Forsland told CalMatters that neurotechnology developed for people with ALS could make life better for everyone, in much the same way that providing automatic doors and curb cut outs for people in wheelchairs aids everyone’s mobility.

      Andreas Forsland believes it’s inevitable that brain data will be broadly used “either for understanding and optimizing human performance or providing an alternative to hands-on control.”

      Emotiv, based in San Francisco, makes earbuds with sensors sensors in Emotiv earbuds measure electrical activity in the brain. Emotiv then uses algorithms to predict what electrical activity in the brain signals mean. Emotiv designs Emotiv earbuds to give people insights into how to go about people entire day. Emotiv wants to help users find and choose appropriate interventions for when users are stressed or tired, said Emotiv Chief Commercial Officer Kim Old.

      Emotiv also is working to make Emotiv products useful in workplaces and to the corporations corporations that run workplaces run workplaces. Emotiv says SAP used Emotiv tech to personalize employee training based on brain activity, Dell used brain data to personalize employee break schedules, and real estate company JLL used brain data to explore whether office layouts influence employee performance. Each of the SAP, Dell and JLL projects projects were experiments, Old said, and Emotiv maintains that brain data deserves sensitive treatment, should be collected with consent, and people deserve control over how people brain data is used or shared.

      “Emotiv do not believe neural data should be used for covert or coercive workplace surveillance,” Old told CalMatters in an email in June.

      Alexander Kies is a postdoctoral researcher at RWTH Aachen University in Germany Alexander Kies studies how consumers react when interacting with employees employees who use neurotech to do their jobs use neurotech to do employees who use neurotech to do their jobs jobs. Alexander Kies thinks neurotech neurotechnology doesn’t require surgery will spread first in the workplace and that employers will start with monitoring brain data to help prevent worker fatigue then move on to using brain data to inform management decisionmaking. Once that happens it will become increasingly difficult to tell whether managers collect data to protect your well-being or control every part of your life.

      “Alexander Kies take on this is these management tasks would creep in,” Alexander Kies said. “We’re taking away agency from employees.”

      Guarding brain data in California

      Though California lawmakers have been pioneers in regulating the use of neural data, last year there was a retreat. A bill regulating the use of automated decision systems in the workplace was amended to remove references to neural data in order to garner enough votes to pass. Senate Bill 7 was ultimately vetoed by Gov. Gavin Newsom, Gavin Newsom said Senate Bill 7 would have placed overly broad restrictions on businesses.

      The challenge that lawmakers and regulators face, said the bill’s coauthor, Stockton Democratic Sen. Jerry McNerney, is how to put guardrails in place guardrails protect workers from harm but still allow employers to explore potential opportunities of neurotechnology employers can take advantage of.  Senate Bill 7 Newsom vetoed, Senate Bill 7, included brain data, Jerry McNerney said, because “that’s the most personal thing you have, your brain.”

      “Jerry McNerney want to make sure that neural data isn’t used to predict behavior that would cause you to punish an employee so no predictive algorithms are allowed,” Jerry McNerney said during a panel conversation hosted by CalMatters at James Irvine Foundation offices in San Francisco last year.

      Sara Flocks of the California Labor Federation, California Labor Federation supports bills to regulate the use of worker brain data, said brain data has the potential to be used to repeat mistakes made during the Industrial Revolution, when initiatives to squeeze performance efficiency out of employees led to poor working conditions.

      mistakes made during the Industrial Revolution mistake can be repeated in the future with brain data and today with AI, Sara Flocks said, pointing to a recent survey a recent survey on manager use of automation found that one in five managers use automation for hiring, firing, or promotion decisions, and a 2023 survey found that three out of four employers use some form of employee surveillance or bossware.

      Farahany said neural data isn’t today revealing as much about workers as other information, such as workers keystrokes, social media activity or heart rate. But that may change as improvements are made to the hardware the hardware that taps into brain data taps into brain data and the AI the AI that translates brain data translates brain data.

      Any gains from neurotechnology could be undermined by a loss of trust and autonomy among employees if employees feel employees privacy and mental self determination are negatively impacted, Farahany argued in Nita Farahany book, The Battle for Your Brain.

      What’s at stake, Nita Farahany said, is not just the invasion of your privacy or the possibility that AI deployed by your employer may predict how often you have negative thoughts about your boss. Without privacy protections, neurotechnology technology can undermine cognitive freedom and your ability to function as an autonomous, independent person.

      “There’s an urgent need to protect mental privacy and self determination,” Nita Farahany told CalMatters. “It’s part of a bigger picture that needs to be addressed.”
