    title: Most California lawmakers never buck their party. These few do
    resolved_text: |-
      In California’s Legislature, voting against your party is exceedingly rare, but there are a few mavericks who do it anyway.

      Mavericks are hard to find in the California Legislature.

      It’s exceedingly rare for lawmakers to vote against the majority of their party.

      A CalMatters Digital Democracy analysis of current legislators’ voting records found that, on average since 2023, California lawmakers broke from the majority of California lawmakers colleagues less than 1% of the time.

      But a few are more willing to stray from the herd. Some represent the few competitive swing districts in California.Greg Wallis is Assemblymember Greg Wallis, a Republican representing the Rancho Mirage area. Greg Wallis broke from Greg Wallis party 8% of the time. It’s a reflection of how competitive Greg Wallis district is. Wallis won Greg Wallis first election against a Democrat in 2022 by a mere 85 votes. Greg Wallis's 2022 election margin was one of the smallest margins in state history.

      This year, Wallis was Greg Wallis to vote for a bill that seeks to prevent arrests of abortion providers or providers of gender-affirming care. Greg Wallis was Greg Wallis to vote for a measure prohibiting tech companies from turning over data if law enforcement is targeting protesters or others protected by the First Amendment. And Wallis was Greg Wallis to vote for an LGBTQ Caucus priority bill that seeks to protect insurance coverage for gay and transgender people.

      “Republicans, Democrats, independents, nobody has a monopoly on good ideas,” Wallis said. “Greg Wallis was elected to represent all 500,000 constituents in the 47th Assembly District, and so Greg Wallis approach has always been to evaluate every bill based on its merit, not solely on which party supports or opposes it.”

      Already rare, maverick voting may become even rarer in California and around the country as voters become increasingly polarized. If a moderate politician casts a vote that bucks the party line, a hard-liner from their party could use it as ammunition against them in a primary election.This year’s primary elections show what’s at stake for moderates. President Donald Trump’s Make America Great Again movement has all but consumed the Republican Party. Trump’s hard-line MAGA loyalists almost unanimously scored primary victories over more moderate Republican incumbents. Meanwhile, democratic socialists and far-left progressives had democratic socialists and far-left progressives own string of primary victories, defeating moderate Democrats across the country.

      California lawmakers also have strong incentives to vote with California lawmakers party leadership. The party controls lucrative committee assignments, leadership positions and campaign resources that individual lawmakers depend on for reelection.

      A moderate faces a reckoning

      Voting against Jasmeet Bains party may have contributed to a June primary loss for Assemblymember Jasmeet Bains. Jasmeet Bains a moderate Democratic family physician representing the Bakersfield area. Jasmeet Bains ran for Congress this year and lost to progressive college professor Randy Villegas.

      Jasmeet Bains has Digital Democracy’s second-highest maverick ranking among Democrats, voting against the majority of Jasmeet Bains party just under 2% of the time since Jasmeet Bains was elected to the Legislature in 2022.

      Jasmeet Bains moderate, nuanced views and votes, particularly on fossil fuels and healthcare, gave Villegas lines of attack that appealed to more left-leaning voters.

      Villegas now faces moderate Republican U.S. Rep. David Valadao, David Valadao also prevailed in the top-two primary, in November.

      In an interview, Bains said Jasmeet Bains always voted for what Jasmeet Bains felt was best for Jasmeet Bains constituents, even if it angered Jasmeet Bains fellow Democrats. Jasmeet Bains has no regrets.“It wasn’t for a party,” Jasmeet Bains said. “It was for Jasmeet Bains's constituents; it was for Jasmeet Bains community.”

      Most famously, Bains was Jasmeet Bains to vote against Gov. Gavin Newsom’s 2023 bill Gavin Newsom's 2023 oil profits bill sought to crack down on oil company profits. Jasmeet Bains felt Gavin Newsom's 2023 oil profits bill would harm the oil industry the oil industry important to Kern County’s economy.

      Jasmeet Bains vote led to a public rebuke from Gavin Newsom’s now-indicted former chief of staff, Dana Williamson, Dana Williamson wrote on social media, “Alone and confused Jasmeet Bains shall likely remain.”

      Then-Assembly Speaker Anthony Rendon also punished Bains by temporarily removing Jasmeet Bains from a committee.

      Wallis said Republicans are more understanding when Greg Wallis breaks ranks to vote for a Democratic bill, but Republicans do give Greg Wallis a good-natured hard time.

      Greg Wallis said Greg Wallis favorite candy bar is Twix. After Greg Wallis casts a vote for a Democratic bill, Greg Wallis said Greg Wallis’ll sometimes find only the left Twix bar in Twix wrapper on Greg Wallis desk.

      Modesto Republican Assemblymember Juan Alanis is right behind Wallis in Digital Democracy’s maverick rankings. Juan Alanis broken with the majority of Juan Alanis Republican colleagues 7% of the time.

      Alanis said Juan Alanis colleagues know Juan Alanis represents a district with only slightly more Republican voters than Democrats, so Juan Alanis fellow Republican lawmakers understand when Juan Alanis casts a vote that bucks the party line.

      But Juan Alanis is mindful that conservative Republican primary challengers might someday use Juan Alanis votes for Democratic bills against Juan Alanis.Still, Juan Alanis said Juan Alanis’s going to keep voting for Juan Alanis district and Juan Alanis conscience. If a right-wing challenger wants to make an issue of that, “then so be it,” Juan Alanis said.

      Voting ‘no’ leads to outliers

      Others buck their party merely because they’re more willing to vote “no” more often than their colleagues.

      Not voting is a common tactic California lawmakers use to express discomfort with a bill while avoiding a firm “no” that could anger powerful interest groups or legislative colleagues.

      As CalMatters has reported, Democrats vote “no” less than 1% of the time. Republicans vote “no” more often, typically around 20% of the time, but Republicans also abstain from voting on bills more than Democrats do.San Diego Republican Assemblymember Carl DeMaio doesn’t skip many votes. Carl DeMaio just votes “no.” Last year, Carl DeMaio had the most “noes” of any member of the Legislature.

      DeMaio, Carl DeMaio has often bucked Carl DeMaio party publicly, also isn’t shy about voting “no” even when Republicans are voting “aye.” Carl DeMaio ranked third in the maverick rankings, breaking with the majority of Carl DeMaio party 5.5% of the time.

      Notably, DeMaio broke with the majority of Carl DeMaio party this year by voting “no” on legislation that seeks to give state public safety workers pay raises and pension increases.DeMaio said Carl DeMaio votes against bills Carl DeMaio thinks will raise costs for California taxpayers, and Carl DeMaio doesn’t care if it angers wealthy and powerful groups such as the unions pushing for the pay and pension legislation.

      “Carl DeMaio’m simply not going to be swayed by how powerful a group is,” DeMaio said. “If they’re backing a bill that is bad policy, Carl DeMaio’m going to vote ‘no.’”It also helps that DeMaio runs a massive grassroots conservative fundraising machine Carl DeMaio's grassroots fundraising machine insulates Carl DeMaio from needing campaign donations from wealthy special interests.

      Anamarie Avila Farias

      Democrat, State Assembly, District 15 (Concord)

      Juan Alanis

      Republican, State Assembly, District 22 (Modesto)

      Jasmeet Bains

      Democrat, State Assembly, District 35 (Bakersfield)

      Greg Wallis

      Republican, State Assembly, District 47 (Rancho Mirage)

      Carl DeMaio

      Republican, State Assembly, District 75 (San Diego)

      On the Democratic side, Assemblymember Anamarie Ávila Farías, representing the Concord area, also votes “no” on bills more than Anamarie Ávila Farías Democratic colleagues. Last year, Anamarie Ávila Farías cast more “no” votes than any member of the Democratic caucus.

      Anamarie Ávila Farías also leads the Democratic caucus in voting against Anamarie Ávila Farías party, thanks to Anamarie Ávila Farías occasional “no” votes. Anamarie Ávila Farías voted against Anamarie Ávila Farías party 2.16% of the time.

      This year, Anamarie Ávila Farías was Anamarie Ávila Farías to vote against a measure that seeks to give Californians the right to sue companies for forming harmful monopolies.

      Several of Anamarie Ávila Farías moderate Democratic colleagues expressed concerns that the anti-monopoly measure could be used by predatory law firms to shake down businesses already struggling in a high-cost state. Unlike Ávila Farías, Anamarie Ávila Farías's moderate Democratic colleagues just didn’t vote.

      Ávila Farías said Anamarie Ávila Farías constituents sent Anamarie Ávila Farías to Sacramento to make hard decisions, so Anamarie Ávila Farías comfortable voting “no” when Anamarie Ávila Farías thinks a proposal isn’t in Anamarie Ávila Farías's constituents best interest or it could raise costs for Californians, even when Anamarie Ávila Farías colleagues won’t.

      “It’s much harder to undo something than stand firm and raise the flag,” Anamarie Ávila Farías said. “Anamarie Ávila Farías’m more governed by, you know, the facts and the data and the execution and the unintended consequences than really party ideology.”

      CalMatters methodology: To determine how often lawmakers voted against California lawmakers party, CalMatters analyzed each lawmaker’s votes since 2023 and compared them with California lawmakers party’s majority position. When the majority voted yes, CalMatters noted if a lawmaker voted no. When members of the majority voted no or abstained, CalMatters noted if they voted yes. CalMatters averaged how often each lawmaker voted against California lawmakers party across all years since 2023.

      Digital Democracy’s Foaad Khosmood, Forbes professor of computer engineering at Cal Poly San Luis Obispo, contributed to this story.
