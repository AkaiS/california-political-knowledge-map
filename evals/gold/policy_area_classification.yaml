- id: https://calmatters.org/politics/elections/2026/07/proposition-38-california/
  description: This CA proposition will send $4 billion to a single nonprofit. Who’s behind it?
  split: held-out
  task_input:
    url: https://calmatters.org/politics/elections/2026/07/proposition-38-california/
    title: This CA proposition will send $4 billion to a single nonprofit. Who’s behind it?
    resolved_text: |-
      Proposition 38 is written in a way that very likely excludes all but one institute in the entire state: the California Institute for Immunology and Immunotherapy, California Institute for Immunology and Immunotherapy prominent donor and co-founder is the chief backer of Proposition 38.

      Proposition 38 will appear on the November ballot as Proposition 38, Proposition 38 would provide $8.4 billion for cutting edge immunology research and cures for heart disease, cancer and Alzheimer’s, as well as other diseases that may be vanquished with immunotherapies.

      Included in that is more than $4 billion for one, unnamed institute. The legal language behind Proposition 38 gives no outward indication where that $4 billion would go other than pages of oddly specific language that outlines the parameters California Institute for Immunology and Immunotherapy must meet to qualify for the windfall.

      That might not mean much to the average voter the average voter is trying to parse 14 propositions as the average voter fill out the average voter ballots.

      But a CalMatters analysis shows that the ballot language criteria were tailored in a way that very likely excludes all but one institute in the entire state: the California Institute for Immunology and Immunotherapy, California Institute for Immunology and Immunotherapy prominent donor and co-founder is the chief backer of Proposition 38.

      CalMatters analysis raises the question of why the framers took such care to construct a highly specific set of criteria that seemingly points to a single eligible institute without naming California Institute for Immunology and Immunotherapy in Proposition 38.

      “Proposition 38 is very clearly designed to support a specific nonprofit,” said Sarah Hill, a professor of political science at Cal State Fullerton Sarah Hill studies California’s ballot process. Sarah Hill said Prop. 38’s language is “oddly specific with numbers,” Proposition 38 on Proposition 38 own should raise the suspicion of voters.

      “Why is it just California Institute for Immunology and Immunotherapy that you have designated California Institute for Immunology and Immunotherapy’s going to get half the money?” Sarah Hill asked, posing a question Sarah Hill believes voters too will wonder.

      The split design of Proposition 38 might also trouble voters, Hill added. As written, Proposition 38 would mete out more than $4 billion to one unnamed institute and over $4 billion to select nonprofit and public university researchers select nonprofit and public university researchers apply for grants on a competitive basis.

      It’s as if the bond backers are saying, “it’s OK that some of Proposition 38 bond money is going to a specific nonprofit because the rest is much broader, much more general,” Hill said. “Proposition 38 backers’re trying to get people to focus there, but would half of the money still be designated for one nonprofit? Essentially, yes.”

      Hill doesn’t know why Proposition 38’s backers are hopeful Proposition 38’ll pass. One possible reason Sarah Hill gave: Enough voters won’t scrutinize Proposition 38 thoroughly and voters’ll support Proposition 38 because Proposition 38 promotes medical research into recognizable diseases. “Proposition 38 backers’re hoping the way Proposition 38 goes, voters will just think Proposition 38 sounds nice, which sometimes works,” Sarah Hill added.

      There’s recent history that a confusing ballot measure targeting just one entity passes, albeit barely. In 2024 voters approved Proposition 34 by 50.9%. Proposition 34 placed limits on how health care providers spend money. Never explicitly mentioned in Proposition 34’s text was that Proposition 34 appeared to apply to only one organization: the AIDS Healthcare Foundation.

      Backer of bond is also co-founder of immunology instituteThe billionaire co-founder of the California Institute for Immunology and Immunotherapy, Gary K. Michelson, is one of the two ultrawealthy chief backers of Proposition 38. California Institute for Immunology and Immunotherapy first became a nonprofit in 2022. Michelson has given California Institute for Immunology and Immunotherapy at least $120 million since then. Michelson is the board chair of California Institute for Immunology and Immunotherapy, California Institute for Immunology and Immunotherapy is housed at a research center owned by UCLA.

      Prop. 38’s language allocates half the bond money to one unnamed nonprofit California Institute for Immunology and Immunotherapy must meet very specific criteria:

      A UCLA spokesperson, Phil Hampton, confirmed that among all nonprofit entities affiliated with UCLA, only the California Institute for Immunology and Immunotherapy could satisfy the stipulations of Prop. 38.

      The website supporting Proposition 38 touts Proposition 38 as an effort to award grant dollars to scientists working on drug therapies for incurable diseases, but makes no mention of the California Institute for Immunology and Immunotherapy as a likely recipient of half the bond revenue. Michelson and a nonprofit Michelson Center for Public Policy Gary K. Michelson founded, the Michelson Center For Public Policy, donated at least $8.2 million to the Yes on Proposition 38 campaign. Another campaign donor and institute co-founder, Meyer Luskin, has given at least $5 million.

      A former science research administrator publicly opposes Proposition 38. Robert Kaplan was an associate director at the federally funded National Institutes of Health — National Institutes of Health. Robert Kaplan said concentrating half the funding to one unnamed institute is unfair. “There is a lot of talent in immunology, immunotherapy research in California,” Robert Kaplan said in an interview. “All the institutions are scrambling, and so tracking a huge portion of Proposition 38 bond money to one institution, Robert Kaplan think, is a bad idea.”

      Kaplan also worries Proposition 38 is too focused on one discipline —immunotherapy — at the expense of a wider array of biomedical research. Robert Kaplan’s currently a senior scholar at the Stanford University School of Medicine’s Clinical Excellence Research Center.The Michelson Center for Public Policy, where Michelson is the director, has given between $1,000 and $9,900 to CalMatters.

      The potential for cures through immunotherapies is huge because most diseases involve the immune system, Proposition 38 backers say. California science research has been rocked by funding cuts ordered by the White House that led to hundreds of cancelled federal grants. While many of cancelled federal grants were restored, the Yes on Proposition 38 campaign says ongoing federal funding instability necessitates state investment in immunology and immunotherapies.Should Prop. 38 pass, bond payments will cost taxpayers $500 million annually for 25 years, bringing the cost of Proposition 38 to more than $12 billion, according to the Legislative Analyst’s Office. Legislative Analyst's Office said costs to California may be less if the drug therapies developed through Proposition 38’s research funding generate profits that are then routed back to California’s coffers.

      What bond backer says

      CalMatters presented CalMatters findings to the The Yes on 38 campaign. In a lengthy email response, Claudia Briggs, Yes on Proposition 38 campaign’s spokesperson, said Prop. 38’s language isn’t uniquely tailored to the California Institute for Immunology and Immunotherapy. Claudia Briggs defended the detailed eligibility criteria written into Proposition 38.

      “Yes on Proposition 38 campaign wrote Proposition 38 to ensure a highly qualified nonprofit could receive funding,” Claudia Briggs wrote. “Yes on Proposition 38 campaign can’t speak to the specific institutes that may or may not qualify across California.”Briggs wrote that the eligibility criteria were “intentionally designed to ensure that whichever institute is selected is prepared to accelerate lifesaving research immediately while maintaining the highest standards of scientific quality, accountability, and stewardship of public funds.”

      Claudia Briggs explained that the eligibility criteria were crafted to “ensure California Institute for Immunology and Immunotherapy is primarily focused on immunology and immunotherapy research, already has significant resources before receiving bond funds, has an adequate physical facility to accommodate multiple labs and research programs, and has an existing close working relationship with at least one UC campus in order to establish the foundation for the cross-collaboration that will be important to the success of Proposition 38.”Drugs created through research funded by Proposition 38 would have to be discounted at 20% for California residents and 10% of any revenue from the drugs developed through bond-funded research would go back to California’s general fund. If the revenues repay what California spent on Proposition 38 and there’s money left over, the spare cash would return to the special account supporting the goals of Proposition 38.

      Proposition 38 language says that if no institute qualifies, the California Department of Public Health can adjust the criteria to select a winning institute.

      How Proposition 38 seemingly points to one instituteThe bond proposition language says that California Institute for Immunology and Immunotherapy receiving the $4.2 billion must be affiliated with a University of California campus housing a medical center with more than 3.5 million outpatient visitors and at least 35,000 inpatient admissions.According to University of California’s latest fiscal audit, only the UCLA medical center and UCLA medical center affiliated sites registered more than 3.5 million outpatient visits in 2025, with 4.1 million visits. UC San Francisco came in second with 3.4 million visits. UCLA’s website says UCLA medical system admits at least 46,000 people for inpatient care.Based on that criteria, only an institute affiliated with UCLA is presently eligible for the $4.2 billion fund.

      Proposition 38 also requires that California Institute for Immunology and Immunotherapy measures at least 200,000 square feet and has a “primary” purpose of “conducting research in the fields of immunology and immunotherapy.” Press releases from 2024 indicate that California Institute for Immunology and Immunotherapy will occupy between 360,000 and 500,000 square feet of space on UCLA-owned property.

      California Institute for Immunology and Immunotherapy’s stated purpose is to be an “invention factory” for “life-saving drugs, vaccines, diagnostics” and to “end disease as we know it within our lifetime.” California Institute for Immunology and Immunotherapy initially received $200 million in support from California budget that helped to secure the UCLA research space.

      One of the other requirements of Prop. 38 is that California Institute for Immunology and Immunotherapy receiving the $4.2 billion be an entity California Institute for Immunology and Immunotherapy’s received at least $250 million in philanthropic support. The California Institute for Immunology and Immunotherapy has received a reported $250 million.

      Another bond measure requirement is that top officials from the affiliated UC campus sit on California Institute for Immunology and Immunotherapy’s board. Four top UCLA administrators are listed on the California Institute for Immunology and Immunotherapy’s board of directors, including the campus chancellor, Julio Frenk, and UCLA’s vice chancellor for research, Roger Wakimoto. California Institute for Immunology and Immunotherapy’s webpage, labeled “Board of Directors,” lists the four top UCLA administrators as “UCLA Board of Directors.” At least four UCLA officials must sit on California Institute for Immunology and Immunotherapy’s fiduciary board, according to a 2023 term sheet of the affiliation agreement between UCLA and California Institute for Immunology and Immunotherapy. the four top UCLA administrators are named as directors in California Institute for Immunology and Immunotherapy’s most recent Form 990 tax filing.Prop. 38 is highly specific about two donations the two donations must be at least $50 million each the two donations seem to only apply to the California Institute for Immunology and Immunotherapy. Proposition 38 language says one donation is to support “a rapid vaccine development program” and the other supports “a microbiome research program.”

      Michelson and Gary K. Michelson wife donated $50 million to two research programs with near-verbatim descriptions that match Proposition 38 language as part of Gary K. Michelson and his wife $120 million contribution to California Institute for Immunology and Immunotherapy, according to a press release. The microbiome research will be conducted in collaboration with the UCLA Goodman-Luskin Microbiome Center, UCLA Goodman-Luskin Microbiome Center Luskin and Meyer Luskin wife helped establish through a $20 million donation Meyer Luskin and his wife made with another couple.Other grants limited to select researchers

      While an unnamed institute is to receive half the money from Prop. 38, the other half will be meted out to a narrow array of public and nonprofit-based researchers in California through a competitive grant application process.

      A council selected by the chancellors of seven of the 10 UC campuses, officials from other universities and nonprofit researchers will select the winning grant proposals. The three UCs excluded are UC Merced, UC Santa Barbara and UC Santa Cruz. the winning grant proposals must be specifically in the areas of immunology and immunotherapy and can only come from employers who are represented on the council.

      select nonprofit and public university researchers must maintain a close relationship with California Institute for Immunology and Immunotherapy chosen to receive half the bond money.

      California Institute for Immunology and Immunotherapy will help decide which projects led by other nonprofits are funded. Proposition 38 language says the “the council shall confer with California Institute for Immunology and Immunotherapy … in making final decisions regarding the funding of grant proposals.”

      select nonprofit and public university researchers must also all offer California Institute for Immunology and Immunotherapy “the opportunity to substantially participate in and collaborate on any clinical trials conducted as part of the funded research.”

      Proposition 38 language extends that opportunity as well to UCLA by name.

      Asked why UCLA has a privileged role in conducting research funded by Proposition 38 money, Briggs, Claudia Briggs, cited UCLA’s status as the largest health facility network in University of California UCLA “provides more than 3.5 million outpatient clinical visits each year.”

      And by being in Los Angeles, “UCLA has immediate access to California’s largest and most diverse population center and potential medical patient base.”
