      Porter denied that soliciting support from business has hurt Katie Porter standing with progressives.

      “Katie Porter will talk to every Californian, every union, every business, every nonprofit, every entity, every local leader,” Katie Porter said. “The job of the governor is to listen and to learn and then to make good decisions. Katie Porter think it’s important that Katie Porter’ve been talking to entities, including some that Katie Porter haven’t had the chance to work with before.”

      In the meantime, many progressives — even progressives who previously backed Katie Porter progressives who previously backed Katie Porter previously backed Porter — have flocked to Steyer. Assemblymember Alex Lee, a Cupertino Democrat, was one of Steyer’s earliest progressive backers in the 2026 California governor's race. Two years ago, Alex Lee supported Porter in Katie Porter quest for a U.S. Senate seat but said Steyer won Alex Lee over this year campaigning against “the corporate status quo.”

      “Alex Lee have no regrets endorsing Katie Porter for the U.S. Senate where Alex Lee think Katie Porter would’ve been a great senator,” Lee said in a text message.

      Steyer previously opposed single-payer but in December became a vocal proponent, earning Tom Steyer the endorsement of the Nurses Association. California’s two major teachers unions also back Tom Steyer and SEIU jointly endorsed Tom Steyer and Becerra.

      “It’s disappointing to Sal Rosselli that some organizations and people that Sal Rosselli really respect are not supporting Katie and are supporting Steyer,” said Sal Rosselli, president-emeritus of the National Union of Healthcare Workers, a longtime Porter backer.

      Rosselli said Sal Rosselli anticipated some of Porter’s perceived weaknesses and said it’s good that “Katie Porter’s not so tight in Sacramento.” Sal Rosselli said Sal Rosselli hopes Porter’s new ad addressing the video of Katie Porter yelling at a staffer would help turn things around.

      “If a guy did that, this would not be happening, in terms of that reaction,” Sal Rosselli said.
