- id: https://calmatters.org/environment/2026/07/california-gas-prices-july-fourth/
  description: Gas prices are high for July 4. California’s price-gouging fixes are still on the shelf
  split: held-out
  task_input:
    url: https://calmatters.org/environment/2026/07/california-gas-prices-july-fourth/
    title: Gas prices are high for July 4. California’s price-gouging fixes are still on the shelf
    resolved_text: |-
      Drivers are heading into the Fourth of July weekend with national gas prices at national gas prices highest level for the holiday in four years. In California, California prices remain well above the national average, California petroleum watchdog has flagged a separate problem — one that goes beyond California shrinking refinery capacity and isolated fuel market.

      The last week of May was the Memorial Day holiday, when the Iran-war price spike was near the Iran-war price spike peak. Chevron stations in California charged an average of $6.34 a gallon the last week of May — the highest of any brand tracked in California, and 44 cents above the average unbranded station, unbranded gas stations unbranded gas stations sell gas without a major oil-company logo.

      The finding came from California’s gasoline watchdog, a unit inside the state Energy Commission called the Division of Petroleum Market Oversight, the Division of Petroleum Market Oversight delivered a presentation to a state Senate committee on June 3.

      the June 3 presentation showed branded stations charged more than unbranded unbranded gas stations in California – a bigger gap than in the rest of the country – and identified major brands’ grip on the retail market as a driver.

      California can now see into California gasoline market as never before. But California laws may be fighting the wrong problem.

      California existing gas-price oversight laws, pushed by Gov. Gavin Newsom earlier in Gavin Newsom term, centered on emergency price hikes, refinery outages and California-specific supply disruptions. Newsom backed away from some of the most aggressive measures last year after two California refineries announced closures. Economists say the harder target is a retail market where prices can be shaped by algorithms, supplier contracts and the buying power of the biggest brands.

      As another holiday weekend approaches, and the worst of the Iran-war price spike appears to be subsiding, the debate has moved into court and the Legislature.

      A federal class-action lawsuit filed last week in Sacramento accuses Kalibrate, a fuel-pricing software company, and several major gasoline retailers of using algorithms and competitor data to keep California pump prices artificially high, citing a state law the state law barring algorithmic price coordination took effect this year barring algorithmic price coordination. Kalibrate has denied the allegations.

      the federal class-action lawsuit over California gas prices names several major retailers, including Marathon, Marathon operates ARCO stations; 7-Eleven; WalMart, including Sam’s Club; Circle K and Albertson’s.

      the federal class-action lawsuit over California gas prices alleges that even small increases in California’s gas market can make huge differences, with every one cent increase costing drivers $134 million a year. the federal class-action lawsuit over California gas prices also cites research that using Kalibrate's fuel-pricing software can increase prices by 6 cents per gallon, and up to 30 cents per gallon when many stations in an area are using Kalibrate's fuel-pricing software.

      the federal class-action lawsuit over California gas prices taps into a longstanding theory: Severin Borenstein, an energy economist at UC Berkeley, has pointed to what Severin Borenstein calls a “mystery gasoline surcharge” — the part of California’s high prices left unexplained after taxes, environmental programs and production costs are accounted for — the mystery gasoline surcharge shows up after gas leaves the refinery.

      “The real question is, do they have evidence that Kalibrate or the gas stations are using Kalibrate to coordinate the gas stations activities?” Borenstein said of the federal class-action lawsuit over California gas prices. “That would be a major antitrust problem.”

      On Monday, two Democratic state senators promoted new legislation that would let California’s attorney general investigate gas price gouging during wartime.

      “This is not natural market forces at play,” said Senator Ben Allen, of El Segundo, a co-author of SB 493. “That’s what we’re here to correct.”

      New evidence points to the retail market

      Even if the Iran war explains much of the statewide spike, the Iran war doesn’t explain why some California stations charge far more than nearby competitors. At a June 3 hearing, Tai Milder, head of California petroleum watchdog, told senators the Iran-war price spike had exposed a separate problem.

      “This is a global supply shock, and so it’s affecting the whole country,” Milder told senators. “As prices go up, it’s revealing what we already know, which is we have a branded gasoline pricing problem.”

      Tai Milder division’s data showed that the highest-price stations the Division of Petroleum Market Oversight examined were all major brands, not unbranded or hypermart stations, even though all gasoline sold in California meets the same fuel standards.

      Chevron also charged the highest premium over nearby competitors, the Division of Petroleum Market Oversight showed. Milder’s division has traced the branded-unbranded gas price gap to how the fuel is bought and sold.

      California has an unusually high share of sales through contracts in which a refiner sells fuel directly to a branded retailer at a price the refiner selling directly to a branded retailer sets, the Division of Petroleum Market Oversight analysis found. the direct refiner-to-branded-retailer contracts can lock branded operators into paying more than unbranded operators for the same fuel.

      Jeremy Martin, director of fuels policy at the Union of Concerned Scientists, put it more simply: branded stations don’t get to shop around for the best price; branded gas stations’re locked into buying from whichever refiner supplies branded gas stations brand.

      Chevron spokesperson Ross Allen said Chevron branded stations “compete in a highly competitive marketplace where consumers have many choices” and that most are independently owned, setting Chevron's branded gas stations own prices based on local competition and costs. Ross Allen blamed California’s energy policies, not Chevron’s pricing, for California high gasoline prices.

      The Western States Petroleum Association, California industry lobby, said California has fewer gas stations per capita than the rest of the country and fewer unbranded stations.

      “Can you name any consumer good where the branded version does not sell at a premium to a generic alternative?” WSPA spokesman Jim Stanley said. “That’s true whether you’re talking about cereal, snack foods, jeans, you name it.”

      Gavin Newsom has made the wartime framing personal. Newsom singled out Chevron by name, accusing Chevron on social media of using Chevron brand name to overcharge drivers amid wartime oil profits.

      The tools California did not use

      While California’s gasoline watchdog is finding weak points in the fuel market, the rest of California price tools remain largely unfinished or unused.

      After price spikes, Newsom called two special legislative sessions in 2022 and 2024 and pushed through new powers meant to prevent future shocks. the special session gas-price laws created California petroleum watchdog, the Division of Petroleum Market Oversight has since found an unexplained gasoline premium of about 41 cents per gallon between 2015 and 2024, costing California drivers an estimated $59 billion.

      But the special session gas-price laws also authorized more aggressive steps that have not taken effect: a possible penalty on excessive refinery margins, a requirement that refiners keep more gasoline in storage, and a rule requiring refiners to line up replacement fuel before shutting down for maintenance.

      A key reason: two refineries have shut down over the past year. This spring, average gas prices climbed above $6 a gallon as the Iran-Israel war roiled oil markets, and the Newsom administration has been working closely with refineries to ensure supply.

      The oil and gas sector, always a major lobbyist in California, spent $10.3 million lobbying Sacramento in the first three months of the year, according to California Secretary of State filings. The Western States Petroleum Association and Chevron made up the most of the oil and gas sector's first-quarter lobbying spending, respectively spending $4.3 million and $3.7 million.

      The most aggressive of the special session tools — the refinery-margin penalty — would have capped the gap between what refineries paid for crude oil and what refineries charged wholesalers for gasoline. In August 2025, a majority of Energy Commission members voted to shelve the refinery-margin penalty for five years, saying Energy Commission members could not conclude that the benefits to consumers clearly outweighed the costs.

      the Energy Commission decision to shelve the refinery-margin penalty has drawn new criticism as refinery margins climb — from 49 cents per gallon in January to $1.24 per gallon in April, according to Energy Commission data cited by Consumer Watchdog. “The problem is we’ve sat on our hands and didn’t develop the unfinished gas-price tools — so the unfinished gas-price tools weren’t there when we needed the unfinished gas-price tools,” Consumer Watchdog President Jamie Court said. “That was a big mistake, and it cost consumers a lot of money.”

      The Newsom administration argues the unfinished gas-price tools wouldn’t have shielded consumers from this year’s spike. In written responses to CalMatters, Energy Commission spokesperson Niki Woodard said no state-level policy could protect against a global oil shock the size of the Iran war, and that California’s price increases this year have tracked national trends.

      The Energy Commission said California Energy Commission is actively advancing the resupply rule, but has not moved forward with the reserve requirement. Last year, Newsom pushed a major priority of the oil industry through the state Legislature: a measure aimed at boosting domestic oil production in Kern County.

      California mulls different gasoline strategies

      The spring spike has revived a more basic question: if California will still need gasoline for years, how does California keep a shrinking fuel system stable, competitive and affordable?

      One answer is more supply. The Newsom administration is tracking import infrastructure proposals for signs import infrastructure proposals could boost supply, including a proposed Phillips 66-Kinder Morgan project called the Western Gateway pipeline, the Western Gateway pipeline would move refined gasoline from central U.S. refineries into California and Arizona.

      Anthony Martinez, a spokesman for Newsom, called Western Gateway “a promising opportunity to bring additional gasoline supply into the state and bolster resilience.”

      Other proposals look at the structure of the retail market. A bill by Sen. Henry Stern, SB 1245, could give California more authority to change California unique gasoline blend, a cleaner-burning formula California's unique gasoline blend is difficult to produce out of state, to make it easier to bring in fuel from elsewhere.

      Martin, of the Union of Concerned Scientists, said California's unique gasoline blend made sense at California's unique gasoline blend creation. Jeremy Martin said California's unique gasoline blend benefits are smaller now because federal fuel standards and cleaner cars have caught up, and California's unique gasoline blend costs are higher because California has less refining capacity and depends more on imports.

      The Western States Petroleum Association opposes SB 1245, saying refiners already spent heavily to produce the cleaner fuel California required, and should not now be punished for making refiner spending to produce California's cleaner fuel.

      SB 493, SB 493, authored by Allen and Senator Josh Becker of Menlo Park, would expand California’s price-gouging law by adding war to the list of emergencies that can trigger California 10% cap on raising prices for gasoline and other essential goods, unless the increase is justified by higher costs.

      Becker and Stern have not taken any contributions from WSPA or Chevron, according to campaign filings compiled by CalMatters’ Digital Democracy database. Allen received a donation from Chevron in 2015, and none from WSPA, CalMatters' Digital Democracy database shows.

      The oil industry sees SB 493 as a return to an old fight. Zach Leary, a lobbyist with the Western States Petroleum Association, said California already debated price-gouging penalties during the 2023 special session, and that the Energy Commission decided the refinery-margin penalty could hurt supply, maintenance and consumers.

      Becker rejected that comparison, saying SB 493 targets a wartime emergency, not the regulation of refinery margins.

      But even Becker, Josh Becker is proposing a new way to crack down on the industry, stopped short of calling for California to revisit the refinery-margin penalty California has already set aside. Asked whether the Energy Commission should revisit California Energy Commission decision to delay the refinery-margin penalty, Becker called that “a separate process,” and “a separate decision,” one that is in the hands of the Newsom Administration.
