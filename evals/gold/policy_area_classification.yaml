      the groups blocking the direct-shipping proposal, along with the International Brotherhood of Teamsters and the Wine Institute, have given at least $11 million to both Democrats and Republicans in California since 2000, according to Digital Democracy, including at least $738,000 since 2025, the start of the current two-year legislative session.

      By comparison, California’s craft distillers reported spending $54,000 on lobbying this year.

      California craft distillers reported just three donations to lawmakers in the past decade, according to Digital Democracy. One was a $42 bottle of whiskey in 2022 to former Napa Democratic Sen. Bill Dodd, Bill Dodd now lobbies on behalf of the craft distillery industry. In 2023, Assembly Speaker Robert Rivas received $215 in tequila. Democratic Assemblymember-turned U.S. Rep. Adam Gray received a $1,300 campaign donation in 2016.

