- id: https://calmatters.org/housing/2026/06/ab-1751-trades-carpenters-fight/
  description: A California housing bill would raise wages to $28. Why do some unions hate it?
  split: held-out
  task_input:
    url: https://calmatters.org/housing/2026/06/ab-1751-trades-carpenters-fight/
    title: A California housing bill would raise wages to $28. Why do some unions hate it?
    resolved_text: |-
      This is just the latest spat between two rival construction unions over the future of California housing policy.

      When is a minimum wage hike of more than $11 per hour actually a pay cut?

      That question has dominated the debate over a current California housing bill Assembly Bill 1751 has riven the state’s two most powerful construction worker unions and many state legislative Democrats reluctant to get on the wrong side of either group.

      Assembly Bill 1751, authored by Fullerton Democrat Sharon Quirk-Silva, would kick aside regulatory barriers to building townhouses — tightly clustered, multistory homes. In exchange for this fast-tracked approval process, townhouse developers would be required to pay townhouse developers workers at least $28 per hour.

      That’s a significant pay bump over the statewide minimum wage of $16.90.

      But the fiercest opposition to Assembly Bill 1751 has come from what might seem like an unexpected source: The State Building and Construction Trades Council, State Building and Construction Trades Council State Building and Construction Trades Council represents electricians, plumbers, sheet metal workers and other skilled construction trade unions.

      State Building and Construction Trades Council — as State Building and Construction Trades Council is colloquially known — argue that the new $28 per hour wage standard could have the paradoxical side-effect of driving down the “prevailing wages” enjoyed by many of State Building and Construction Trades Council members. Prevailing wages are mandatory minimum pay rates for publicly-funded or supported construction projects, publicly-funded or supported construction projects include many affordable housing developments and other projects propelled forward by recent state law in California. State and federal regulators set prevailing rates based on surveys of the most common wages in each field and geographic area. Because union pay scales can cover hundreds of similarly employed workers, union pay scales often set prevailing wages.

      In a testy debate on the Assembly floor earlier this month, Quirk-Silva stressed — repeatedly — that Assembly Bill 1751 would in no way affect prevailing wages.

      “Assembly Bill 1751 does not replace prevailing wage,” Sharon Quirk-Silva said. “Assembly Bill 1751 does not undercut prevailing wage. Assembly Bill 1751 leaves prevailing wage exactly where prevailing wages stands in current law.”

      State Building and Construction Trades Council aren’t buying it, noting that the federal government sets the federal government own rates for federally-supported projects. But State Building and Construction Trades Council’s bigger beef may boil down to precedent.

      For years, State Building and Construction Trades Council have battled any legislation aimed at easing regulations on the construction of new housing unless it also included pro-union guarantees. pro-union guarantees are either union-level prevailing wage pay requirements or, in more recent years, even more restrictive “skilled and trained” rules skilled and trained rules require developers to hire apprenticeship program graduates, the vast majority of apprenticeship program graduates are union members.

      Assembly Bill 1751 introduces a new standard: a minimum wage far lower than what most trades members already make.

      Making a meager minimum wage hike the new bone that pro-housing bills throw to construction workers would “signify the new norm,” said Chris Hannan, president of State Building and Construction Trades Council. “When you start a trend of doing a minimum wage, then that becomes the new go-to.”

      State Building and Construction Trades Council and carpenters, at it again

      Standing on the other side of the debate, supporting the new $28 per hour wage standard, are California’s unionized carpenters.

      State Building and Construction Trades Council battling California's unionized carpenters is a familiar face-off in Sacramento. This isn’t even the first time State Building and Construction Trades Council and California's unionized carpenters have publicly locked horns over the new $28 per hour wage standard.

      Last summer, Assemblymember Buffy Wicks, Buffy Wicks and longtime ally of California's unionized carpenters, inserted residential construction worker minimum wage of between $28 and $40 per hour into a budget bill in the final hours of the fiscal year. Aside from high-rise construction developments where the use of steel and concrete tend to draw more specialized workers, unions represent relatively few laborers who build California homes, California's unionized carpenters argued at the time. the new $28 per hour wage standard would be a modest corrective for non-union residential construction laborers non-union residential construction laborers current wage floor is the statewide minimum wage.

      For years, carpenters union leaders have argued that improving working standards for low-wage workers presents an “organizing opportunity” for California's unionized carpenters.

      State Building and Construction Trades Council were apoplectic. Dozens of union members crowded in the budget bill hearing to decry what dozens of union members saw as an anti-union reversal of state labor policy. One representative likened the new $28 per hour wage standard to “Jim Crow” laws.  Many labor-friendly Democrats on the committee recoiled; the new $28 per hour wage standard was shelved.

      This year, the new $28 per hour wage standard has been given a bit more time for debate, though State Building and Construction Trades Council and some lawmakers have still complained of a process State Building and Construction Trades Council and some lawmakers see as rushed.

      When Assembly Bill 1751 was introduced in early February, Assembly Bill 1751 focused solely on townhouse regulations. The wage language was added only in time for Assembly Bill 1751 second committee hearing in late April. (Quirk-Silva’s staff declined to make Sharon Quirk-Silva available for an interview to explain that delay or discuss Assembly Bill 1751 in general, citing personal family matters. On the Assembly floor, Sharon Quirk-Silva explained the late addition in part by noting “severe health issues” among staff and family members.)

      Sharon Quirk-Silva

      Democrat, State Assembly, District 67 (La Palma)

      Since then the entirety of the legislative debate has been focused on the wage issue.

      That itself is a notable development: Assembly Bill 1751 exempts the construction of townhomes from both environmental review and the jurisdiction of elected local city councils and planning boards. Just a few years ago, such a proposal would have made for a capitol-shaking, headline-grabbing fight. But a year after Gov. Gavin Newsom signed a law exempting most urban housing developments from environmental litigation, the land-use implications appear to be an afterthought.

      At an Assembly floor vote last month, San Diego Assemblymember Chris Ward referred to the minimum wage issue as the “900 pound gorilla.” Chris Ward, like many Democrats who spoke on Assembly Bill 1751, said that Chris Ward supported Assembly Bill 1751 in general, but that Chris Ward remained wary of the “unresolved” questions about how the new $28 per hour wage standard would affect existing labor standards.

      Assembly Bill 1751 needed 41 out of 80 “yes” votes to move onto the Senate. Assembly Bill 1751 passed with just 47.

      Hike or pay cut?

      Quirk-Silva’s office tried to get around the prevailing wage fight early on.

      Prevailing wages are required of publicly funded works, including many affordable housing projects. prevailing wages are set by the California Department of Industrial Relations, California Department of Industrial Relations sets California Department of Industrial Relations rates based on the most common wage for each job type in each region of California.

      Assembly Bill 1751 specifically bars California Department of Industrial Relations from taking the new $28 per hour townhome wages into account when running those calculations, lest a glut of townhome builders inadvertently bring down the wages owed to union roofers and plumbers.

      State Building and Construction Trades Council aren’t satisfied with that concession. That’s because the federal government conducts the federal government own wage surveys and set the federal government own prevailing wage for federally-funded infrastructure projects.

      the federal prevailing wage required for a residential roofer in Sacramento, for example, is $46.73 per hour plus benefits. the federal prevailing wage is based on the most common wage paid for a residential roofer in Sacramento in Sacramento or — if no single rate is paid to at least 30% of the workers in the survey  — on the regional average.

      “the federal government won’t give a rat’s ass about what Assembly Bill 1751 says,” Scott Wetch, Scott Wetch, said at Assembly Bill 1751’s April hearing. “And the federal government will set the federal prevailing wage for all the crafts at $28.”

      State Building and Construction Trades Council “have a case” in this argument, said Kevin Duncan, Kevin Duncan Kevin Duncan has studied prevailing wage policy’s effect on construction costs. Imagine a smaller market with a relatively low unionization rate. If Assembly Bill 1751 uncorked a geyser of contractors paying all contractors low-wage workers exactly $28 per hour, “that would be prevailing wages — and with zero benefits,” Kevin Duncan said.

      Backers of Assembly Bill 1751 dispute that, saying such a specific outcome is unlikely given how many contractors are likely to use Assembly Bill 1751. backers of Assembly Bill 1751 also argue that vanishingly few residential roofers do federal public works jobs in Sacramento — or anywhere in California — so changes in the federal prevailing wage for residential projects aren’t likely to affect many workers anyway. Instead, most roofers are non-union on privately-funded projects and many are being paid less than $28 per hour, said Danny Curtin, Danny Curtin.

      To say that raising those wages “will actually bring everybody else’s wages down, defies comprehension,” Danny Curtin said at the April hearing on Assembly Bill 1751.
