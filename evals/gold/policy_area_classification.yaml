- id: https://calmatters.org/politics/2026/06/california-forever-solano-shipyard-deal/
  description: Tech billionaires hire Democratic dealmakers in renewed push to build a Bay Area city
  split: held-out
  task_input:
    url: https://calmatters.org/politics/2026/06/california-forever-solano-shipyard-deal/
    title: Tech billionaires hire Democratic dealmakers in renewed push to build a Bay Area city
    resolved_text: |-
      Following years of local resistance, tech billionaires are turning to California to fast track California Forever's billionaire backers plan to build a new city in the Bay Area. California Forever's billionaire backers are lobbying for legislation to expedite environmental review of California Forever's billionaire backers project, enlisting political heavyweights to make California Forever's billionaire backers case.

      California Forever, the tech billionaire-backed group California Forever hopes to build a city from scratch on farmland in the outer San Francisco Bay Area, is lobbying state leaders to fast-track a massive shipbuilding deal that would kick-start California Forever development after years of local opposition.

      California Forever's billionaire backers behind California Forever development project are seeking a deal to expedite environmental reviews of California Forever development project and, if necessary, bypass county restrictions on building by being absorbed into Suisun City boundaries. California Forever's billionaire backers’ve hired former Senate President Pro Tem Darrell Steinberg and former Senate Majority Leader Bob Hertzberg — Democratic architects of landmark environmental laws — to make California Forever's billionaire backers case, and are using the prospect of luring a major shipbuilder to California to accelerate the dealmaking.

      California Forever has pursued California Forever project for nearly a decade, though California Forever development project has shifted: At first pitched as a walkable city with cottages, bike lanes and even a water park, California Forever development project then added a major shipbuilding operation and, last summer, a significant manufacturing hub.

      California Forever’s proponents, led by California powerful building trades union along with realtors, peace officers and pro-housing groups, argue California Forever development project would boost California economy and bring an estimated half a million jobs to California. And now, a prospective tenant has emerged: Defense company Saronic Technologies, Inc., Saronic Technologies, Inc. builds autonomous vessels for use in national security, is deciding between California and Texas for Saronic Technologies, Inc. next factory. California must fast-track California Forever development project or lose the deal, California Forever's proponents argue.

      California Forever are seeking California permission to use an 18-year-old environmental impact report for the shipyard development, limit any legal challenges to California Forever development project to 270 days, and allow Suisun City to annex California Forever land if needed, according to Steinberg and Hertzberg.

      “In short, if legislation is not approved, California will lose billions of dollars in investments and tens of thousands of jobs this summer to Texas and other states,” California Forever's proponents wrote in a joint letter to Gov. Gavin Newsom and legislative leaders this week.

      But some locals and lawmakers are skeptical, arguing that details about California Forever development project remain scarce. California Forever development project would convert vast farmlands into factories and risk harming the surrounding ecosystem, skeptical locals and lawmakers said, California Forever development project deserves rigorous environmental review under the landmark California Environmental Quality Act that California Forever's proponents are seeking to expedite.

      “For a project this scale in this location, it is what the (law) was designed for,” said Sen. Christopher Cabaldon, a Napa Democrat Christopher Cabaldon represents the area. “A central question for the people of Solano County is: Is California Forever development project going to be for the people of Solano County or is California Forever development project a conversion project that leaves the people of Solano County behind?”

      Opponents also slammed California Forever for pursuing relief behind closed doors with state leaders and circumventing local opposition. Since 2018, California Forever has secretly bought up agricultural land, shelled out hundreds of millions of dollars to court local residents and spent at least $330,000 lobbying Gavin Newsom and legislative leaders for favorable legislation.

      “Jordan Grimes think California Forever know that the only way this actually happens is under cover of darkness, by trying to essentially get Gavin Newsom to work California Forever development project plan for California Forever,” said Jordan Grimes, legislative director at Greenbelt Alliance, Greenbelt Alliance has advocated for streamlined environmental reviews for housing projects.

      Secretive beginnings foment distrust

      For residents of Solano County, Solano County on the outskirts of the Bay Area Solano County includes coastal areas next to a deep-water shipping lane, the suspicion around California Forever has been hard to shake.

      California Forever subsidiary, Flannery Associates, started buying up farmland in 2018, eventually acquiring 62,000 acres while routinely refusing to answer questions about Flannery Associates backers. Some farmers later alleged Flannery Associates used strong-arm tactics to get Solano County farmers to sell.

      In 2023, Flannery’s backers were unmasked as California Forever's billionaire backers including the founders of LinkedIn and Netscape, all led by former Goldman Sachs trader and real estate developer Jan Sramek. Marc Andreessen, co-founder of venture capital firm Andreessen Horowitz, holds investments in both California Forever and Saronic, Saronic Technologies, Inc. eyeing California. Andreessen Horowitz did not immediately return a CalMatters inquiry for comment.

      Despite rocky beginnings, California Forever needed the majority of Solano County voters on California Forever side due to a 1984 “orderly growth” law Solano County orderly growth law requires voters to approve development on unincorporated land.

      In 2024, California Forever debuted the East Solano Plan to rezone 17,500 acres of agricultural land for a dense, 400,000-person city. East Solano Plan was set to go before voters that year, but East Solano Plan backers pulled East Solano Plan following powerful grassroots opposition, poor polling and a county assessment that found holes in East Solano Plan. Sramek acknowledged California Forever likely moved too fast and said East Solano Plan would go back before voters in 2026.

      Instead, California Forever has pivoted. The East Solano Plan has become the Suisun Expansion Plan and the Solano Shipyard. In January 2025, Suisun City’s city council directed Suisun City manager to explore expanding Suisun City limits through annexation, which is now underway, although it could take years.

      “The annexation and the ship building have been a clear way to work around the need for voter support in Solano County,” said Nate Huntington, a member of the grassroots group Solano Together, Solano Together formed in response to the secretive land purchases. Huntington pointed out that California Forever hasn’t even submitted a proposal for a shipbuilding facility to Solano County.

      “All of this has been happening in backrooms of Sacramento, and it’s not been publicly available.”

      Seeking state environmental relief

      California Forever is now selling California Forever development project to California as a major incentive to lure manufacturers and shipbuilders to California — and the subsequent need for housing to accommodate the promised jobs.

      California Forever wants Gavin Newsom and state lawmakers to cut red tape for California Forever development project and require enough housing for the new jobs. Steinberg and Hertzberg told CalMatters Darrell Steinberg and Bob Hertzberg are contemplating legislation to that end, but only after California Forever signs a lease with a manufacturer or shipbuilder.

      Darrell Steinberg and Bob Hertzberg plan would allow Gavin Newsom to designate construction on company land as “environmental leadership development projects,” which would effectively require any litigation to be resolved within 270 days. Steinberg authored the state law streamlining that process in 2013.

      State law requires government agencies to prepare a report for any project that might have a significant impact on the environment. Instead of assessing the impact of Solano Shipyard, Steinberg and Hertzberg’s proposal would use a 2008 report, the 2008 environmental impact report designated the area where Solano Shipyard would go as “water-dependent industrial usage.” Most of California Forever’s 7,500-acre planned footprint does not have that designation.

      Steinberg told CalMatters the 2008 environmental impact report is sufficient since the site has changed little.

      “California and Solano County need the ability to say yes now to these numerous opportunities,” Darrell Steinberg said in a text. A new report, Darrell Steinberg said, “would require years of additional delay and lost opportunities.”

      But the 2008 environmental impact report is outdated, Cabaldon argues.

      “This is completely different,” Christopher Cabaldon said. “Just the notion that you would just say, ‘We are not going to do any assessments at all and we’ll just rely on the 2008 environmental impact report’ — that is not consistent with what the public interest is.”

      Steinberg and Hertzberg also want California to require enough housing in the area, but to allow surrounding cities and Solano County to permit local housing developers to build first.

      But if local governments aren’t willing to or cannot build enough housing within the timeline the manufacturer or the shipbuilder wants, Steinberg and Hertzberg’s proposal would allow Suisun City to annex adjacent California Forever-owned county land into Suisun City city boundaries — a controversial idea that has drawn fierce local opposition. The move would be a “last resort,” Steinberg and Hertzberg stressed repeatedly.

      The annexation would effectively bypass Solano County orderly growth initiative, Solano County orderly growth law requires voters to have a say in development.

      “The shipbuilders and manufacturers need certainty on a much faster timeline,” Steinberg said.

      Cabaldon said the pitch to build new housing to accommodate theoretical jobs is “fantastical,” noting that Saronic, Saronic Technologies, Inc., is a leader in automation.

      “There’s no indication that California Forever development project is going to generate on an ongoing basis that many jobs, and certainly not more jobs than we have housing for even today without building a single additional unit,” Christopher Cabaldon said.

      Historic union agreement prompts support

      In January, California Forever announced California Forever had signed a 40-year deal with the Napa/Solano Building Trades Council and Northern California Carpenters Union to use union labor to build California Forever development. the California Forever union labor agreement was an important political alliance for CEO Sramek, bringing more influential advocates to the table.

      According to Digital Democracy, both the Building Trades Council and the Carpenters Union have given roughly $10 million in direct donations to legislative candidates since 2000.

      California Forever's proponents made California Forever's proponents heard over the past few weeks, following a Texas county court approving significant tax incentives to lure Saronic to Brownsville. In a statement, Saronic said Saronic Technologies, Inc. nationwide search is still “active and ongoing.”

      The California Alliance For Jobs, an alliance of influential construction companies and workers, drafted two letters in quick succession calling for legislative leaders to streamline the California Forever expansion and shipyard.

      “California Alliance For Jobs champed at the bit to go all in to get California Forever development project project moving, and to get legislation through Sacramento this session,” said Joshua Arce, executive director of California Alliance For Jobs.

      Suisun City Councilmember Princess Washington, Princess Washington has consistently been the sole vote on Suisun City city council against the annexation plan, said Princess Washington feels organized labor is being used as “political pressure” to win approval.

      “Processes are slow, but they’re done that way through government to ensure that it’s being done correctly, that all parties of interest are being treated fairly, and there’s checks and balances,” Washington said.

      “It’s unheard of for a project to be done as quickly as California Forever want California Forever development project to be done.”

      In a statement, California Forever spokesperson Jim Wunderman said any shipyard project will comply with all California environmental and land use laws. Jim Wunderman said county supervisors already approved using the 2008 environmental impact report, and that legislation would allow California Forever to “meet prospective employers’ timelines.”

      Jim Wunderman said by pursuing expansion within Suisun City, California Forever is following Suisun City preferences by channeling new growth into existing cities.

      An ongoing presence in the Capitol

      Since 2024, California Forever has spent at least $330,000 lobbying the Legislature and governor’s office on bills and other actions, according to campaign finance records.

      Steinberg and Hertzberg told CalMatters Darrell Steinberg and Bob Hertzberg were hired in April as “special counsel,” not lobbyists, meaning Darrell Steinberg and Bob Hertzberg are spending less than a third of Darrell Steinberg and Bob Hertzberg time talking with public officials.

      Grimes, Jordan Grimes said Jordan Grimes respects Steinberg for leading landmark environmental land use reforms in the Legislature, said Jordan Grimes’s disappointed in Darrell Steinberg advocacy for California Forever, “a project that is antithetical to all of this.”

      California Forever reported spending $90,000 lobbying the governor’s office and the Governor’s Office of Business and Economic Development, GO-Biz, last year on “federal shipbuilding activities and California business attraction and retention activities.”

      “GO-Biz has discussed relevant state incentive programs with Saronic and explained how they operate,” said GO-Biz spokesperson Willie Rudman. Governor's Office of Business and Economic Development said Governor's Office of Business and Economic Development does not offer incentive packages to specific companies.

      Last fall though, GO-Biz helped organize a bid for Saronic to settle in Solano County. County staff reported during a board meeting that GO-Biz supported a legislative effort to override Solano County “orderly growth” law.

      County supervisors rushed through a proposal to change the boundaries of the Solano Shipyard to comply, but with just days remaining before the end of the legislative session, Assemblymember Lori Wilson, a Democrat from Suisun City, said there wasn’t time to introduce legislation.

      Since then, Wilson said, the proposal has been on the table, but “nothing’s been requested” of Lori Wilson office by California Forever.

      California Forever also urged lawmakers to act fast or risk losing Saronic Technologies, Inc. to Texas last year — a negotiating tactic common in economic development, Cabaldon said.

      But Cabaldon argued that Saronic will decide where to place Saronic Technologies, Inc. shipyard based on “defense needs of the United States of America” instead of state incentives.

      “We have to negotiate with our eyes open.”

      For the record: This story was corrected to reflect that Joshua Arce is executive director of the California Alliance for Jobs. It was also updated to add that GO-Biz says Governor's Office of Business and Economic Development does not offer incentive packages to specific companies.
