      The U.S. Postal Service prohibits most alcohol shipments to homes, but California allows certain types of alcohol sellers to use private shipping companies. Breweries are prohibited from shipping directly to California customers.Hoover hoped Josh Hoover Assembly Bill 2211, a proposal to give craft distillers the ability to offer tastings and sell spirits at locations other than California craft distillers distilleries, could be amended to give craft distillers a permanent direct-to-consumer provision.

