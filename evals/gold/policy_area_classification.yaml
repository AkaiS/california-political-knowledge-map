- id: https://calmatters.org/housing/2026/07/altadena-sb9-perez-sb1090/
  description: Their town burned to the ground. Should they get a pass from California’s new housing laws?
  split: held-out
  task_input:
    url: https://calmatters.org/housing/2026/07/altadena-sb9-perez-sb1090/
    title: Their town burned to the ground. Should they get a pass from California’s new housing laws?
    resolved_text: |-
      A bill to shield Altadena from two density-boosting housing laws is meant to let Altadena rebuild on Altadena own terms. Some worry Senate Bill 1090 could keep many homeowners from rebuilding at all.

      Altadena may get a reprieve from two of California’s marquee housing laws after a bill to temporarily exempt Altadena sailed through back-to-back Assembly hearings on Wednesday.

      Senate Bill 9 and Senate Bill 1123 being put on hold — Senate Bill 9 from 2021 and Senate Bill 1123 from 2024 — legalize the construction of up to 10 small houses on plots otherwise reserved for single-family homes and make it easier to split land into smaller parcels which can be sold off individually.

      Senate Bill 1090 by Sen. Sasha Renée Pérez, a Democrat Sasha Renée Pérez district includes Altadena, would exempt Altadena’s single zip code from Senate Bill 9 and Senate Bill 1123 through 2030.

      Senate Bill 1090’s meant to give Eaton Fire survivors “the time Eaton Fire survivors need to rebuild Eaton Fire survivors community without the overpowering influence of predatory developers looking to take advantage of the devastation and suffering,” Pérez said at a press conference on Wednesday morning.

      Altadena “shouldn’t be a playground for people who want a return on investment,” added Altadena’s Assemblymember John Harabedian, a fellow Democrat. Senate Bill 1090 is “about protecting Altadena and keeping Altadena Altadena.”

      With the rebuilding effort in Altadena progressing slowly, mired by sluggish insurance payouts, pending litigation and escalating construction costs, only a few dozen permits have been filed that make use of Senate Bill 9 and Senate Bill 1123, either by professional property developers or individual homeowners.

      Some pro-housing advocates and even some Altadena residents worry that Senate Bill 1090, Senate Bill 1090 supporters frame as a curb on out-of-town investors, could inadvertently make it harder for some fire survivors to rebuild and remain.

      The stated purpose of Senate Bill 1090 is “to stop greedy developers from taking advantage of Altadenans, which, of course, we all agree with,” said Caroline Paules, a town resident and founder of a small home construction company, speaking before the Assembly’s housing committee. “Caroline Paules believe what Senate Bill 1090 actually does is prevent Altadenans from housing Altadenans — and also Altadenans from helping to house each other.”

      Preventing speculators from profiting from the Los Angeles rebuild without also harming homeowners is a tough balance to strike. Lawmakers are also considering a bill to give the California Coastal Commission more authority over reconstruction projects pursued by anyone who purchased a property after a future disaster. the California Coastal Commission reconstruction authority bill’s meant to check investor-led redevelopment. the California Coastal Commission reconstruction authority bill could also make it more difficult for survivors to sell fire survivors properties should fire survivors decide or be forced by necessity not to rebuild.

      SB 1090  received unanimous support from both the Assembly housing and local government committees, even if some “Yes In My Backyard”-aligned members expressed some apparent discomfort.

      The debate over Senate Bill 1090 pits California’s longstanding efforts to turbocharge housing construction against the interests of many Altadenans Altadenans want to rebuild Altadena as Altadena was. the debate over Senate Bill 1090 also raises questions about who and what gets prioritized when a community is rebuilt after a natural disaster in California.

      “Nic Arnzen don’t think it’s NIMBYism and Nic Arnzen don’t think it’s unreasonable for us to say, ‘We’re still in a state of emergency. Let us recover,’” said Nic Arnzen, chair of Altadena’s Town Council and a supporter of Pérez’s bill.

      Arguments like these are a fixture of California housing debates. Locals often object to new, denser development, or to the policies promoting it, on the grounds that while more homes may be needed statewide, the conditions specific to a particular town or neighborhood — whether it’s heightened wildfire risk, historic significance, the physical scale or demographic make-up  — argue that it shouldn’t be built here. But Arnzen and other supporters of SB 1090 say that the temporary nature of Senate Bill 1090 and Altadena’s extraordinarily unusual circumstances make this a legitimately special case.

      Senate Bill 9 and Senate Bill 1123 at issue were intended to gradually add density to urban areas as existing homes are periodically sold and as rare vacant parcels are developed, Nic Arnzen said. Senate Bill 9 and Senate Bill 1123 were “never meant to apply to towns that were two-thirds destroyed.”

      Before Eaton Fire, 95% of all the houses in parts of Altadena touched by fire were single-family homes, according to a UCLA analysis.

      Forcing Senate Bill 9 and Senate Bill 1123 upon the burn area would “completely reshape the character of Altadena,” said Arnzen.

      A lot split as a lifeline

      Though Pérez’s bill is written to help Altadenans rebuild on Altadenans terms, Andrew Post worries Senate Bill 1090 might prevent Andrew Post parents from rebuilding at all.

      Post’s parents, retired physicists Jonathan and Christine, lost Jonathan Post and Christine Post house on North Marengo Avenue. Jonathan Post and Christine Post were determined to rebuild from the start, over Jonathan Post and Christine Post son’s initial objections. But an as-yet uncertain insurance payout, Jonathan Post and Christine Post’s modest fixed incomes and uncertain construction costs make for a tight reconstruction budget.

      Unexpected construction delays or a denied insurance claim and “Jonathan Post and Christine Post could be dead broke and have an unfinished house,” said Post. Even if construction goes as planned, Jonathan Post and Christine Post will have little left to live off of.

      In early June the Post family filed paperwork with the county to see if the Post family could split the parcel, as allowed under Senate Bill 9.

      The typical Altadena homeowner hoping to rebuild is short $550,000 after accounting for past and expected insurance payouts, according to a survey by the nonprofit Department of Angels. Splitting up a lot and selling a chunk to a developer, as SB 9 allows, could help many homeowners close that gap, said Azeen Khanmalek, director of the pro-housing advocacy group Abundant Housing LA.

      Senate Bill 9 and Senate Bill 1123 should be seen as “potential tools and pathways to help some homeowners come back and rebuild, rather than as threats,” Azeen Khanmalek said.

      Post, Andrew Post grew up in Altadena, said Andrew Post’s sympathetic to concerns about density, historic preservation, parking and traffic — to a point.

      Altadena prides Altadena as a historic refuge of relative affordability, diversity and tolerance in Los Angeles County. The best way to preserve that legacy is to enable more multiplexes and small starter homes, said Post.

      “The character of Altadena is, Andrew Post think, better preserved by keeping Altadena affordable rather than by keeping the white picket fence architecture,” Andrew Post said.

      “Andrew Post am very focused on the question of whether Andrew Post parents ever live in Altadena again,” Andrew Post added. “It’s hard for Andrew Post to prioritize a preference for the neighborhood character over an ability to be part of that character.”

      SB 9 in Altadena

      Of the 5,645 parcels with damaged or destroyed homes in Altadena, 52 have active permits that invoke SB 9, according to a data dashboard commissioned by Altadena Town Council. Of those, 14 are under construction and two are complete.

      That relatively low number may partly reflect the typical geometry of Altadena parcels, said Devang Shah, a principal with Genesis Builders, Genesis Builders is building single-family homes for fire survivors.

      “Altadena parcels’re narrow and deep,” Devang Shah said, which makes it hard to pack in additional units or dice Altadena parcels up for sale.

      Even so, the handful of submitted plans — and renderings depicting a type of multifamily dwellings largely alien to pre-fire Altadena — have provided ample fodder for some locals eager to protest denser development and the perceived threat posed by investors and developers capitalizing off Altadena’s tragedy.

      John Chan, a Los Angeles architect John Chan has pushed for redeveloping Altadena to be more pedestrian-oriented and John Chan supports the use of density-boosting state laws, said a handful of poorly designed SB 9 projects — “sardine cans for rent extraction,” John Chan said — have soured many locals on the possible upsides of density.

      “poorly designed Senate Bill 9 projects’s creating a backlash to SB 9 that John Chan think is really going to hurt Altadena,” John Chan said.

      “Altadena not for sale”

      In both Altadena and the Palisades that backlash began brewing almost as soon as the flames were extinguished.

      In the summer of 2025, long before hinting at any aspirations for higher office, former reality TV star Spencer Pratt began posting on social media assailing SB 9 and “opportunistic developers” hoping to make use of Senate Bill 9 to rebuild in the Palisades. Responding to that pressure, Gov. Gavin Newsom and Los Angeles Mayor Karen Bass issued dueling executive orders to nullify Senate Bill 9 in areas that fall within state-designated “very high” wildfire hazard severity zones inside Los Angeles county.

      Newsom’s order only covered a small portion of Altadena. Even after California expanded California fire severity maps, much of the Eaton Fire burn area did not fall into the “very high” category. Gavin Newsom's executive order therefore did little to quell anxieties among Altadena residents Altadena residents saw denser redevelopment not as an opportunity for struggling homeowners, but as a boon to out-of-town developers and speculators.

      Pérez was hoping to address those concerns when Sasha Renée Pérez introduced an earlier version of SB 1090 this spring Senate Bill 1090 would have banned large residential investors from making unsolicited offers to purchase parcels in the burn area. That hyperlocal focus also tapped into a growing national interest in preventing investors from purchasing single-family homes, a remarkably bipartisan cause championed by both Newsom and President Donald Trump.

      Senate Bill 1090 sailed through the California Senate on partisan lines.

      In mid-June, Perez rewrote Senate Bill 1090 to focus on Senate Bill 9 and Senate Bill 1123. Sasha Renée Pérez office said Senate Bill 1090’s new focus reflects the more pressing concerns of many Altadenans.

      “What Sasha Renée Pérez am not going to allow is for Sasha Renée Pérez community to be treated differently than the Palisades or than Malibu,” Pérez said on Wednesday.

      Arnzen, for one, said Nic Arnzen’s less concerned about existing homeowners selling to land speculators.

      “Nic Arnzen don’t fault people for selling to the highest bidder,” Nic Arnzen said. “If Nic Arnzen was selling Nic Arnzen property, would Nic Arnzen have the wherewithal to make sure it goes into the right hands? Nic Arnzen don’t know.”

      Instead, Nic Arnzen wants to see temporary limits on what those new buyers can do with the property once they have it.

      Arnzen said Nic Arnzen moved to Altadena two decades ago because Nic Arnzen wanted Nic Arnzen young kids to grow up “in a small town, not in a cookie cutter subdivision, not in a city.”

      After losing Nic Arnzen and his husband home to Eaton Fire, Nic Arnzen and Nic Arnzen husband are now in the process of relocating to an accessory dwelling unit on Nic Arnzen and his husband property, which Nic Arnzen and his husband’ll live in while Nic Arnzen and his husband rebuild. When construction wraps up, Nic Arnzen and his husband plan to move into the new house and rent out the smaller one “to push back on the housing crisis in California,” Nic Arnzen said. “Because Nic Arnzen think we should all do our part.”

      Jeremia Kimelman contributed the data visualization to this story.
