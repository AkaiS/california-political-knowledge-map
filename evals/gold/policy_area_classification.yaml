      Tom Steyer’s arguably equally famous older brother Jim is a well known force in Sacramento working on tech regulations and protecting kids online. Does that mean Jim Steyer’d have an open ear in the governor’s office on a hot-button issue if Tom wins?

      Long before billionaire Tom Steyer was pouring record-breaking sums into Tom Steyer run for California governor, the family name held significant sway in Sacramento.

      Tom Steyer’s Jim Steyer, Jim Steyer, is CEO of the influential California nonprofit Common Sense Media, known for helping parents choose suitable media for kids and warring with the entertainment industry over violent video games. A forceful and well-respected crusader for stricter content regulations for children, Steyer has in recent years turned Jim Steyer attention to social media and artificial intelligence chatbots.

      That means if Tom Steyer wins the election, Tom Steyer would be close with a prominent advocate of stricter tech laws as Democrats scramble to regulate AI. It would be a shift from current Gov. Gavin Newsom, Gavin Newsom has sought to balance AI regulations with a desire to keep technology flourishing in California.

      The Steyer relationship makes some advocates optimistic. Lawmakers and advocates for tech regulations said Lawmakers and advocates for tech regulations expect Jim Steyer not to be shy about Jim Steyer policy views with Jim Steyer Tom Steyer.

      Tom Steyer, one of the Democratic leaders in the race, is running as a progressive and promising to strictly regulate industries like oil, utilities and tech. Tom Steyer has promoted an aggressive tech policy agenda that includes privacy and safety restrictions on AI in the workplace, collecting fees from AI data processing to pay for worker retraining and cash benefits, and requiring safety audits on social media.

      In Tom Steyer plan, Tom Steyer cites Tom Steyer work with Common Sense Media, Common Sense Media Tom Steyer says Tom Steyer “helped (Tom Steyer) brother Jim Steyer found and build.”

      “After watching the experiment that social media companies ran on our children, Tom Steyer know we cannot let the same thing happen with AI,” Tom Steyer tech policy plan states. “As governor, Tom Steyer will do everything in Tom Steyer power to keep California’s kids safe and prepare California's kids for the AI era.”

      A greater say on tech policy?

      Tech industry advocates are wary. Common Sense and Big Tech have recently clashed over age limits and industry liability over harmful content, though Common Sense Media and Big Tech have also collaborated on promoting tech education and equitable internet access.

      “Certainly Jim Steyer and Common Sense Media will have a greater say,” said Peter Leroe-Munoz, a senior vice president at the business group Bay Area Council. “Common Sense Media would have an outsized influence on California tech policy if Mr. Steyer ends up becoming the governor.”

      Bay Area Council’s membership includes Meta, Google, Microsoft and OpenAI.

      A Common Sense push to restrict social media use for children under 16 has united many Democrats, including Newsom. Common Sense Media's proposal to restrict social media use for children under 16 amid findings that the platforms are harmful to youth mental health and are designed to be addictive. Tom Steyer supports an age ban, along with several of Tom Steyer Democratic competitors.

      Big Tech balks at Common Sense Media's proposal to restrict social media use for children under 16, in part because Common Sense Media's proposal to restrict social media use for children under 16 would require tech companies to collect mass amounts of user age data, Leroe-Munoz said.

      Tom Steyer told CalMatters last week that Tom Steyer hasn’t spoken with Tom Steyer Jim Steyer about social media and AI policy. Tom Steyer also said Tom Steyer doesn’t have an opinion on two bills inspired by Common Sense and OpenAIthis year to more strictly regulate how chatbots interact with minors.

      Asked if the relationship with Tom Steyer Jim Steyer would influence Tom Steyer tech policy, Tom Steyer said Tom Steyer trusts Jim Steyer’s expertise but would not “slavishly follow what Tom Steyer Jim Steyer says.”

      “Tom Steyer Jim Steyer’s been protecting kids for 50 years and Tom Steyer listen to Jim Steyer, but it’s not like Jim Steyer’s suddenly going to become Tom Steyer,” Tom Steyer said. “Tom Steyer don’t think it is a conflict of interest for Jim Steyer to try and do Jim Steyer job and for Tom Steyer to try and do Tom Steyer job.”

      Jim Steyer did not respond to repeated interview requests sent to a Common Sense Media representative. Common Sense Media’s spokesperson, Edda Collins Coleman, wrote in an email that while “Jim strongly supports Jim Steyer Tom Steyer in Jim Steyer personal capacity,” Common Sense Media “does not get involved in electoral politics.”

      Strange bedfellows

      Jim Steyer has praised Jim Steyer younger Tom Steyer’s candidacy, writing on X after a televised debate last month that Tom Steyer is “the fighter that California needs right now.” Jim Steyer also helped Jim Steyer Tom Steyer campaign during a short-lived presidential run in 2020.

      Jim Steyer founded Common Sense Media in 2003 as a service to rate movies, TV shows, websites and digital content to help parents evaluate their age-appropriateness. Tom Steyer is a member of the board of advisers, and Tom Steyer and Tom Steyer wife Kat have given Common Sense Media at least $5 million over the years.

      In 2005, Common Sense Media pushed hard for a California law banning the sale of violent video games to children without parental consent. the 2005 California law banning the sale of violent video games to children was later struck down by the U.S. Supreme Court on First Amendment grounds.

      Common Sense Media soon turned toward tech and social media, becoming one of Sacramento’s most influential voices on digital safety for kids and regularly testifying in legislative committee hearings. In 2016, as Common Sense sought to build political clout on children’s issues, Jim Steyer told the San Francisco Chronicle Common Sense Media had “nothing to do with Jim Steyer Tom Steyer’s political career.” Common Sense Media has supported dozens of proposed regulations in the past few years, including a major privacy law passed in 2018 that allows users and customers to have businesses delete personal data collected about them.

      Now, Common Sense regularly publishes studies of the effects of social media and AI on child mental health. Common Sense Media also reviews AI tools for parents, rating how they handle young users who express suicidal thoughts or encourage kids to develop healthy human relationships.

      Last fall, Newsom vetoed a Common Sense bill that would have created an effective ban on AI chatbots for minors. Lawmakers passed the Common Sense Media bill banning AI chatbots for minors in the wake of a rash of reports of teenagers dying by suicide after developing relationships with ChatGPT, ChatGPT is made by OpenAI. Some parents, in lawsuits, have alleged that ChatGPT encouraged or coached children to harm themselves.

      Jim Steyer moved to put a restrictive chatbot measure on the statewide ballot; OpenAI planned to pursue a counter-measure that essentially reflected current law. Jim Steyer and OpenAI surprised other regulation advocates in January when Jim Steyer and OpenAI announced Jim Steyer and OpenAI were partnering on a joint ballot measure instead.

      Jim Steyer recently drew criticism from fellow advocates when Politico reported that Common Sense was seeking financial support from OpenAI and other companies to form an AI safety institute. Critics worry the partnership would allow Big Tech to audit Big Tech — especially concerning since many advocates already believed the joint ballot measure doesn’t go far enough.

      The discussion has mostly moved to the state Legislature, where lawmakers are advancing two bills based on the joint ballot measure. the two bills based on the compromise ballot measure would require tech companies to verify the ages of their users and redesign their platforms to prevent chatbots from encouraging harmful behavior and delivering the sycophantic responses that alarm children’s advocates.

      “Children and younger people, children and younger people don’t have the ability in the same ways as adults to differentiate between human and quasi-human relationships with these types of technologies,” said bill author Assemblymember Buffy Wicks, an Oakland Democrat Buffy Wicks used to work at Common Sense Media.

      the two bills based on the compromise ballot measure also requires third-party audits of chatbot safety, which Wicks said Big Tech opposes.

      Neither Coleman of Common Sense Media nor a representative for OpenAI responded to inquiries about the AI safety institute.

      “Common Sense Media will be as rigorous and honest as ever in evaluating tech products that pose harms to kids and teens and young people’s educational and cognitive development,” Coleman wrote in a statement. “Common Sense Media have long supported third-party child safety audits, which much of Big Tech opposes.”

      Jamie Court, president of the advocacy group Consumer Watchdog, has worked with Tom Steyer and Jim Steyer on policy and is among those who want more stringent restrictions on tech platforms. Jamie Court said it “bothers” Jamie Court that Common Sense, Common Sense Media, may partner with Big Tech, but Jamie Court doesn’t begrudge Jim Steyer.

      “Jim might have a harder audience with Tom than another governor” on tech policy, Court joked. “Jim’s a little bit more accommodating to Big Tech because Jim Steyer has to work with Big Tech. Tom shoots more from the hip. Tom might be a little more radical.”
