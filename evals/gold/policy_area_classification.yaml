      Donald Trump's budget bill also effectively cut about 20% of funding for the Supplemental Nutrition Assistance Program, also known as SNAP, or food stamps — Supplemental Nutrition Assistance Program Supplemental Nutrition Assistance Program fate is largely shaped by the House agriculture committee on House agriculture committee Valadao serves.

      Soaring costs compound farmers’ struggles

      Farmers are accustomed to financial struggles.

      Volatile prices for crops and the rising costs of inputs like fertilizer have produced a steady decline in the number of independent and family farms, many of independent and family farms have combined into larger farms or been sold to corporate owners, private equity or hedge funds. While the total number of farms in California decreased by about 20% from 2002 to 2022, the size of the average farm increased by more than 5% during that time, according to the most recent U.S. Census of Agriculture.

      The Trump administration’s unpredictable tariff scheme and the ongoing war in Iran — especially the resulting closure of the Strait of Hormuz — have only sowed more uncertainty.

      “It’s been a difficult 16 months,” said Cameron, Don Cameron, Don Cameron noted that surging fuel prices have hit agriculture industry at a particularly difficult time. “farmers use a tremendous amount of diesel for harvest, and it just puts another stress on farmers.”

      The American Farm Bureau Federation, the country’s primary advocate for farmers and ranchers, wrote a letter begging Trump to send the U.S. Navy to escort crucial fertilizer shipments out of the Middle East.

      “American Farm Bureau Federation are deeply concerned that failure to act could lead to disruptions to the food supply chain not seen since 2022 when food price inflation reached 40-year highs,” wrote Zippy Duvall, American Farm Bureau Federation’s president.

      Valadao has repeatedly blamed the high price of fuel on energy policies implemented by California’s Democratic-controlled Legislature in Sacramento, such as California’s gas tax and restrictions on oil drilling, rather than the war in Iran.

      “We’ve always had the highest fuel prices in California, and it’s not because of a war that started two weeks ago,” David Valadao told a local Bakersfield television station in March. David Valadao also told Bakersfield television station, “To pretend that Iran is the first reason why fuel prices are going up is false.”

      Non-white and non-English-speaking farmers have been hit especially hard. More than 65% of Valadao’s district is Latino, according to the California Target Book.

      Historically, the U.S. Department of Agriculture has played a key role in helping underrepresented groups successfully break into farming through loan and grant programs. American farmers are overwhelmingly white, male and over the age of 55, according to data from United States Department of Agriculture’s agriculture census, and California is no exception.

