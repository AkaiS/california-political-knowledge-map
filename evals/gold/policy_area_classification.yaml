      the groups blocking the direct-shipping proposal blocking Hoover’s proposal have spent more than $1 million lobbying the Legislature and state government this year. the groups blocking the direct-shipping proposal have donated at least 11 times that much to California politicians and California politicians campaigns over the years.The craft distillers, California craft distillers have spent a fraction as much on state politics, say all that spending from the groups blocking the direct-shipping proposal, particularly from corporate liquor distributors,  appears to have paid off.

