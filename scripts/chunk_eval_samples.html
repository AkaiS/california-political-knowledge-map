<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chunk review samples</title>
<style>:root{font:16px/1.6 system-ui,sans-serif;color:#192422;background:#f5f6f5}body{margin:0}main{max-width:800px;margin:auto;padding:40px 24px}h1{font-size:28px}a{color:#08776b}.sample{display:block;background:white;padding:22px;border:1px solid #dbe2df;border-radius:8px;text-decoration:none;color:inherit;margin:16px 0}.sample:hover{border-color:#188476}.meta{font-size:14px;color:#586c68}</style></head>
<body><main><a href="/">RAG runs</a><h1>Chunk relevance review</h1><p>One question and one chunk. High, Low or Defer. Descriptions are optional.</p><div id="samples">Loading samples…</div></main>
<script>
fetch('/api/chunks').then(r=>{if(!r.ok)throw new Error(`Load failed: ${r.status}`);return r.json();}).then(samples=>{const root=document.getElementById('samples');root.replaceChildren();if(!samples.length)root.textContent='No samples yet. Build one with scripts/build_chunk_review_sample.py.';for(const s of samples){const a=document.createElement('a');a.className='sample';a.href=`/chunks/${encodeURIComponent(s.id)}`;const title=document.createElement('strong');title.textContent=s.id;a.append(title);const text=document.createElement('div');text.className='meta';text.textContent=`${s.case_count} query–chunk pairs · ${s.pass_count} High · ${s.fail_count} Low · ${s.defer_count} Deferred`;a.append(text);root.append(a);}}).catch(e=>{document.getElementById('samples').textContent=e.message;});
</script></body></html>
