[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/knowledge-map-supervisor.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/knowledge-map-supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/knowledge-map-supervisor.sock

[program:neo4j]
command=/var/lib/neo4j/bin/neo4j console
priority=10
startsecs=10
startretries=3
autorestart=false
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:embeddings]
command=/usr/local/bin/llama-server --model %(ENV_EMBED_GGUF)s --alias embeddinggemma --embeddings --ctx-size 2048 --batch-size 2048 --ubatch-size 2048 --parallel 1 --n-gpu-layers 0 --threads 2 --threads-batch 2 --host 127.0.0.1 --port 8081
priority=20
startsecs=10
startretries=3
autorestart=false
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/app/.venv/bin/python -m knowledge_map.cloud_runtime web
directory=/app
priority=30
startsecs=10
startretries=3
autorestart=false
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
