version: 1
purpose: Graph-backed construction examples for issue 05; not a formal Evaluation Gold Set.
as_of_date: '2026-09-08'
model_input_fields:
- question
construction_instruction: Construct a read-only retrieval query for this verified-answerable question against the supplied persisted News Ontology. Query the graph to retrieve evidence; do not predict missing coverage or answer from general knowledge.
cases:
- id: C-E1-01
  family: E1
  question: What stored reporting mentions Steve Hilton?
  grounding: evidence-grounded
  scope_note: Entity dossier over recorded mentions, without demanding a complete biography.
  reference:
    cypher: "MATCH (n:Politician)-[:MENTIONED_IN]->(c:Chunk)<-[:HAS_CHUNK]-(a:NewsArticle)\nWHERE n.name = $name \nRETURN DISTINCT n.id AS subject_id,n.name AS subject,a.id AS article_id,\n       a.title AS article_title,[{kind:'entity_mention',ids:[c.id]}] AS evidence_groups"
    parameters:
      name: Steve Hilton
- id: C-E1-02
  family: E1
  question: What stored reporting mentions Gail Pellerin?
  grounding: evidence-grounded
  scope_note: A second named Politician; no vote is inferred from being a bill proponent.
  reference:
    cypher: "MATCH (n:Politician)-[:MENTIONED_IN]->(c:Chunk)<-[:HAS_CHUNK]-(a:NewsArticle)\nWHERE n.name = $name \nRETURN DISTINCT n.id AS subject_id,n.name AS subject,a.id AS article_id,\n       a.title AS article_title,[{kind:'entity_mention',ids:[c.id]}] AS evidence_groups"
    parameters:
      name: Gail Pellerin
- id: C-E2-01
  family: E2
  question: What reporting is attached to SB 9 in the 2025-2026 legislative session?
  grounding: evidence-grounded
  scope_note: The session is explicit so seed resolution does not require guessing.
  reference:
    cypher: |-
      MATCH (n:Bill)-[:MENTIONED_IN]->(c:Chunk)<-[:HAS_CHUNK]-(a:NewsArticle)
      WHERE n.name = $name AND n.session = $session
      RETURN DISTINCT n.id AS subject_id,n.name AS subject,a.id AS article_id,
             a.title AS article_title,[{kind:'entity_mention',ids:[c.id]}] AS evidence_groups
    parameters:
      name: SB 9
      session: 2025-2026
- id: C-E2-02
  family: E2
  question: What stored reporting is attached to Proposition 38?
  grounding: evidence-grounded
  scope_note: Retrieves the currently recorded proposition and reporting, not every historical measure numbered 38.
  reference:
    cypher: "MATCH (n:Prop)-[:MENTIONED_IN]->(c:Chunk)<-[:HAS_CHUNK]-(a:NewsArticle)\nWHERE n.name = $name \nRETURN DISTINCT n.id AS subject_id,n.name AS subject,a.id AS article_id,\n       a.title AS article_title,[{kind:'entity_mention',ids:[c.id]}] AS evidence_groups"
    parameters:
      name: Proposition 38
- id: C-E3-01
  family: E3
  question: Which stored articles discuss housing and community development in July 2026?
  grounding: evidence-grounded
  scope_note: Uses article-level topic assignments and an explicit half-open publication window.
  reference:
    cypher: |-
      MATCH (a:NewsArticle)-[:DISCUSSES_TOPIC]->(p:PolicyArea),(a)-[:HAS_CHUNK]->(c:Chunk)
      WHERE p.name=$area AND date(substring(a.published_date,0,10)) >= date($start)
       AND date(substring(a.published_date,0,10)) < date($end)
      RETURN a.id AS article_id,a.title AS article_title,a.published_date AS published_date,
       [{kind:'article_topic_grounding',ids:collect(DISTINCT c.id)}] AS evidence_groups
    parameters:
      area: Housing & Community Development
      start: '2026-07-01'
      end: '2026-08-01'
- id: C-E3-02
  family: E3
  question: Which stored articles discuss labor and employment in July 2026?
  grounding: evidence-grounded
  scope_note: A second temporal sweep; published_date is stored as a string.
  reference:
    cypher: |-
      MATCH (a:NewsArticle)-[:DISCUSSES_TOPIC]->(p:PolicyArea),(a)-[:HAS_CHUNK]->(c:Chunk)
      WHERE p.name=$area AND date(substring(a.published_date,0,10)) >= date($start)
       AND date(substring(a.published_date,0,10)) < date($end)
      RETURN a.id AS article_id,a.title AS article_title,a.published_date AS published_date,
       [{kind:'article_topic_grounding',ids:collect(DISTINCT c.id)}] AS evidence_groups
    parameters:
      area: Labor & Employment
      start: '2026-07-01'
      end: '2026-08-01'
- id: C-E3-03
  family: E3
  question: How many stored articles discuss each policy area? Include the source articles behind every count.
  grounding: structure-derived
  scope_note: Counts stored article assignments. Each entry chunk navigates to its source article; it is not an independent chunk-level topic classification.
  reference:
    cypher: |-
      MATCH (a:NewsArticle)-[:DISCUSSES_TOPIC]->(p:PolicyArea),(a)-[:HAS_CHUNK]->(c:Chunk)
      WITH p,a,c ORDER BY c.index,c.id
      WITH p,a,head(collect(c.id)) AS entry_chunk
      RETURN p.id AS area_id,p.name AS area,count(DISTINCT a.id) AS article_count,
       collect(DISTINCT a.id) AS article_ids,
       collect(DISTINCT {kind:a.id,ids:[entry_chunk]}) AS evidence_groups
    parameters: {}
- id: C-R1-01
  family: R1
  question: Which labor unions have a recorded position on AB 1018 in the 2025-2026 session, and what reporting states that position?
  grounding: evidence-grounded
  scope_note: The text supplies the position; no missing alignment property is filtered or inferred.
  reference:
    cypher: |-
      MATCH (s:Organization:LaborUnion)-[r:DECLARED_STANCE]->(t:Bill)
      WHERE t.name=$measure AND t.session=$session
      RETURN DISTINCT s.id AS subject_id,s.name AS subject,t.id AS target_id,t.name AS target,
       type(r) AS relationship,[{kind:'relationship_claim',ids:r.chunks}] AS evidence_groups
    parameters:
      measure: AB 1018
      session: 2025-2026
- id: C-R1-02
  family: R1
  question: Which organizations are reported to have endorsed the Steve Hilton campaign?
  grounding: evidence-grounded
  scope_note: Uses explicit endorsement edges; duplicate graph nodes may share one project id.
  reference:
    cypher: |-
      MATCH (s:Organization)-[r:ENDORSED]->(t:Campaign)
      WHERE t.name=$campaign
      RETURN DISTINCT s.id AS subject_id,s.name AS subject,t.id AS target_id,t.name AS target,
       type(r) AS relationship,[{kind:'relationship_claim',ids:r.chunks}] AS evidence_groups
    parameters:
      campaign: Steve Hilton campaign
