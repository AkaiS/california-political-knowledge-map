- id: C-M1-01
  family: M1
  question: Which policy areas are connected to Catalina Media Development LLC through Bills it has a recorded lobbying relationship with?
  grounding: structure-derived
  scope_note: Follows observed lobbying and article-grounded Bill topic edges; does not infer causal influence.
  reference:
    cypher: |-
      MATCH (o:Organization)-[r:LOBBIED_FOR|LOBBIED_AGAINST]->(b:Bill)-[t:ABOUT_TOPIC]->(p:PolicyArea)
      WHERE o.name=$actor
      MATCH (a:NewsArticle)-[:HAS_CHUNK]->(c:Chunk) WHERE a.id IN t.articles
      WITH o,r,b,p,collect(DISTINCT c.id) AS topic_chunks
      RETURN DISTINCT o.id AS actor_id,o.name AS actor,b.id AS bill_id,b.name AS bill,
       b.session AS session,p.id AS area_id,p.name AS area,
       [{kind:'actor_bill',ids:r.chunks},{kind:'bill_topic_article',ids:topic_chunks}] AS evidence_groups
    parameters:
      actor: Catalina Media Development LLC
- id: C-M1-02
  family: M1
  question: Which policy areas are connected to Stand With Survivors through Bills it has a recorded lobbying relationship with?
  grounding: structure-derived
  scope_note: A second populated policy footprint. Duplicate stored ids are deduplicated in reference rows.
  reference:
    cypher: |-
      MATCH (o:Organization)-[r:LOBBIED_FOR|LOBBIED_AGAINST]->(b:Bill)-[t:ABOUT_TOPIC]->(p:PolicyArea)
      WHERE o.name=$actor
      MATCH (a:NewsArticle)-[:HAS_CHUNK]->(c:Chunk) WHERE a.id IN t.articles
      WITH o,r,b,p,collect(DISTINCT c.id) AS topic_chunks
      RETURN DISTINCT o.id AS actor_id,o.name AS actor,b.id AS bill_id,b.name AS bill,
       b.session AS session,p.id AS area_id,p.name AS area,
       [{kind:'actor_bill',ids:r.chunks},{kind:'bill_topic_article',ids:topic_chunks}] AS evidence_groups
    parameters:
      actor: Stand With Survivors
- id: C-M2-01
  family: M2
  question: Which other organizations are recorded as lobbying for AB 186 alongside Walt Disney in the 2025-2026 session?
  grounding: structure-derived
  scope_note: Same-side intersection uses two explicit LOBBIED_FOR edges, preserving the category without missing stance alignment.
  reference:
    cypher: |-
      MATCH (o:Organization)-[r:LOBBIED_FOR]->(b:Bill)<-[s:LOBBIED_FOR]-(peer:Organization)
      WHERE o.name=$actor AND b.name=$measure AND b.session=$session AND o.id<>peer.id
      RETURN DISTINCT peer.id AS peer_id,peer.name AS peer,b.id AS bill_id,b.name AS bill,
       [{kind:'seed_support',ids:r.chunks},{kind:'peer_support',ids:s.chunks}] AS evidence_groups
    parameters:
      actor: Walt Disney
      measure: AB 186
      session: 2025-2026
- id: C-M2-02
  family: M2
  question: Which other organizations are recorded as lobbying for AB 186 alongside Creative Artists Agency in the 2025-2026 session?
  grounding: structure-derived
