- id: C-R3-01
  family: R3
  question: Which organizations are recorded as funding the Yes on Proposition 38 campaign, and what reporting supports those links?
  grounding: evidence-grounded
  scope_note: News funding links exist. Amount and date are absent from the Claim Key, so this asks for entities and reporting.
  reference:
    cypher: |-
      MATCH (s:Organization)-[r:FUNDED]->(t:Campaign)
      WHERE t.name=$campaign
      RETURN DISTINCT s.id AS subject_id,s.name AS subject,t.id AS target_id,t.name AS target,
       type(r) AS relationship,[{kind:'relationship_claim',ids:r.chunks}] AS evidence_groups
    parameters:
      campaign: Yes on Proposition 38 campaign
- id: C-R3-02
  family: R3
  question: Which PACs are recorded as funding the Ed Musgrove campaign, and what reporting supports those links?
  grounding: evidence-grounded
  scope_note: The reporting describes campaign support by a super PAC; this does not assert a direct candidate contribution.
  reference:
