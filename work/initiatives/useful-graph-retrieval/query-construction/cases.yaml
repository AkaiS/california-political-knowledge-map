      session: 2025-2026
- id: C-M3-01
  family: M3
  question: Which organizations appear in the same stored reporting chunks as Steve Hilton?
  grounding: evidence-grounded
  scope_note: Co-mention means sharing a Chunk; it does not imply a financial or political relationship.
  reference:
    cypher: "MATCH (p:Politician)-[:MENTIONED_IN]->(c:Chunk)<-[:MENTIONED_IN]-(o:Organization),\n (a:NewsArticle)-[:HAS_CHUNK]->(c)\nWHERE p.name=$politician \nRETURN DISTINCT o.id AS organization_id,o.name AS organization,a.id AS article_id,\n [{kind:'shared_reporting_chunk',ids:[c.id]}] AS evidence_groups"
    parameters:
      politician: Steve Hilton
- id: C-M3-02
  family: M3
  question: Which organizations appear in the same reporting chunks as Gavin Newsom in the article titled Newsom pushes environmental carve-out for campaign donor’s Santa Monica project?
  grounding: evidence-grounded
  scope_note: Names the source article to make the subject and reporting scope resolvable.
  reference:
    cypher: |-
      MATCH (p:Politician)-[:MENTIONED_IN]->(c:Chunk)<-[:MENTIONED_IN]-(o:Organization),
       (a:NewsArticle)-[:HAS_CHUNK]->(c)
      WHERE p.name=$politician AND a.title=$title
      RETURN DISTINCT o.id AS organization_id,o.name AS organization,a.id AS article_id,
       [{kind:'shared_reporting_chunk',ids:[c.id]}] AS evidence_groups
    parameters:
      politician: Gavin Newsom
      title: Newsom pushes environmental carve-out for campaign donor’s Santa Monica project
- id: C-M4-01
  family: M4
  question: Which candidates are connected to California Leads through campaigns it is recorded as funding? Include the campaign and reporting for each link.
  grounding: structure-derived
  scope_note: Populated two-hop influence-chain prefix. The original extension from candidate to Bill has zero matches.
  reference:
    cypher: |-
      MATCH (o:Organization)-[f:FUNDED]->(c:Campaign)-[r:CAMPAIGN_FOR]->(t:Politician)
      WHERE o.name=$funder
      RETURN DISTINCT c.id AS campaign_id,c.name AS campaign,t.id AS target_id,t.name AS target,
       [{kind:'funding_support',ids:f.chunks},{kind:'campaign_target',ids:r.chunks}] AS evidence_groups
    parameters:
      funder: California Leads
- id: C-M4-02
  family: M4
  question: Which ballot measures are connected to Michelson Center For Public Policy through campaigns it is recorded as funding? Include the campaign and reporting for each link.
  grounding: structure-derived
  scope_note: Same two-hop chain with the Prop arm of CAMPAIGN_FOR. No causal influence or funding total is inferred.
  reference:
    cypher: |-
      MATCH (o:Organization)-[f:FUNDED]->(c:Campaign)-[r:CAMPAIGN_FOR]->(t:Prop)
      WHERE o.name=$funder
      RETURN DISTINCT c.id AS campaign_id,c.name AS campaign,t.id AS target_id,t.name AS target,
       [{kind:'funding_support',ids:f.chunks},{kind:'campaign_target',ids:r.chunks}] AS evidence_groups
    parameters:
      funder: Michelson Center For Public Policy
- id: C-M5-01
  family: M5
  question: What vote is recorded for Catherine Blakespear on SB 1007 in the 2025-2026 session, and which reporting states it?
  grounding: evidence-grounded
  scope_note: An individually reported vote using the News Ontology shortcut; no complete roll call or event date is assumed.
  reference:
    cypher: |-
      MATCH (p:Politician)-[v:VOTED_AYE|VOTED_NO|ABSTAINED]->(e:LegislativeEvent)-[r:ACTION_ON]->(b:Bill)
      WHERE p.name=$politician AND b.name=$measure AND b.session=$session
      RETURN DISTINCT p.id AS politician_id,p.name AS politician,type(v) AS position,
       e.id AS event_id,b.id AS bill_id,b.name AS bill,
       [{kind:'reported_vote',ids:v.chunks},{kind:'event_bill',ids:r.chunks}] AS evidence_groups
    parameters:
      politician: Catherine Blakespear
      measure: SB 1007
      session: 2025-2026
- id: C-M5-02
  family: M5
  question: What vote is recorded for Scott Wiener on SB 1229 in the 2025-2026 session, and which reporting states it?
  grounding: evidence-grounded
  scope_note: The attached quote explicitly says he voted no. The stored event sub-label is Hearing, so matching only Vote would miss it.
  reference:
    cypher: |-
      MATCH (p:Politician)-[v:VOTED_AYE|VOTED_NO|ABSTAINED]->(e:LegislativeEvent)-[r:ACTION_ON]->(b:Bill)
      WHERE p.name=$politician AND b.name=$measure AND b.session=$session
      RETURN DISTINCT p.id AS politician_id,p.name AS politician,type(v) AS position,
       e.id AS event_id,b.id AS bill_id,b.name AS bill,
       [{kind:'reported_vote',ids:v.chunks},{kind:'event_bill',ids:r.chunks}] AS evidence_groups
    parameters:
      politician: Scott Wiener
      measure: SB 1229
      session: 2025-2026
- id: C-C1-01
  family: C1
  question: Which Bills from the 2025-2026 session are recorded as referred to the Senate Appropriations Committee?
  grounding: evidence-grounded
  scope_note: The original committee-hearing question is narrowed to the populated referral relationship.
  reference:
    cypher: |-
      MATCH (s:Bill)-[r:REFERRED_TO]->(t:Committee)
      WHERE t.name=$committee AND s.session=$session
      RETURN DISTINCT s.id AS subject_id,s.name AS subject,t.id AS target_id,t.name AS target,
       type(r) AS relationship,[{kind:'relationship_claim',ids:r.chunks}] AS evidence_groups
    parameters:
      committee: Senate Appropriations Committee
      session: 2025-2026
- id: C-C1-02
  family: C1
  question: Which committees is AB 2540 in the 2025-2026 session recorded as having been referred to?
  grounding: evidence-grounded
  scope_note: Reverse lookup of the same recorded referrals. Does not silently call referrals hearings.
  reference:
    cypher: |-
      MATCH (s:Bill)-[r:REFERRED_TO]->(t:Committee)
      WHERE s.name=$measure AND s.session=$session
      RETURN DISTINCT s.id AS subject_id,s.name AS subject,t.id AS target_id,t.name AS target,
       type(r) AS relationship,[{kind:'relationship_claim',ids:r.chunks}] AS evidence_groups
    parameters:
      measure: AB 2540
      session: 2025-2026
