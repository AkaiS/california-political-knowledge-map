title: Synthetic Chat Session questions
created: '2026-09-30'
status: draft_for_review
purpose: 100 authored synthetic inputs, five for each of the 20 user-reviewed dimension tuples. No model
  answers or human answer labels are generated.
format_note: This review draft is not the executable chat Evaluation Data Set. Its dimension and evidence-requirement
  fields have not been wired into the chat task's metadata schema.
scenario_validation: pending_corpus_review
review_notes:
- Scenarios describe intended request and evidence conditions, not observed pipeline outcomes. A sufficient-evidence
  case remains a happy-path case when the current system fails it.
- Evidence requirements are assumptions to verify against the corpus or a deliberately controlled source
  collection before interpreting results by scenario. No sources, quotations, or contradictions are fabricated
  here.
- The historical source-case references identify related subjects and traversals. They do not establish
  that the new request is fully answerable, that a conflict exists, or that the current corpus meets its
  evidence requirement.
- Genuine conflicting reporting requires incompatible accounts of the same fact, identity, period, and
  event. Opposing opinions, omissions, corrections, and different event stages are not automatically contradictions.
- Required data not ingested means an absent public-record collection, not retrieval failure or low-relevance
  Grounding Evidence. Those retrieval-specific cases remain captured in work/inbox.md as ME-06.
- Each question starts an independent Chat Session. Ambiguous cases cannot use unstated context from another
  question; a scoped proposal may be appropriate where the current approval workflow cannot ask a separate
  clarification question.
- No one-to-one relationship between domain familiarity and question complexity is assumed. Expert inputs
  may omit identifiers, and layperson inputs may require multiple relationships.
- Hop requirements describe semantic relationships requested, excluding terminal provenance hops. Source-discovery
  cases do not become Relational Questions merely because retrieval hydrates passages.
- paired_case_id identifies a shared information need expressed at another familiarity level; wording
  and requested presentation may differ.
- All questions are development and error-discovery material, not held-out evidence. The file has not
  been run through the Chat Agent.
references:
  dimension_method: https://hamel.dev/blog/posts/llm-judge/
  historical_construction_cases: work/initiatives/useful-graph-retrieval/query-construction/cases.yaml
  historical_construction_observations: work/initiatives/useful-graph-retrieval/query-construction/verified-results.json
  construction_observations_as_of: '2026-09-08'
  broader_targets_and_controls: work/initiatives/useful-graph-retrieval/question-set.md
  current_chat_training_inputs: evals/unlabeled/chat.yaml
  answer_review: docs/evaluation/chat-answer-review.md
dimensions:
  feature:
    entity_information: Find reporting and passages about a politician, organization, bill, proposition,
      or campaign, including its reported connections.
    topic_discovery: Find reporting about a policy subject without requiring a single named entity as
      the starting point.
    comparison: Present relevant evidence about two or more subjects or accounts so the reader can inspect
      similarities and differences.
    change_over_time: Present a supported chronology of reported events or positions, preserving distinctions
      between event dates and publication dates.
    evidence_checking: Find evidence that supports, disputes, or does not resolve a specified claim, without
      adjudicating beyond the sources.
    intersection_of_constraints: Find items satisfying several requested conditions, preserving each condition
      and its Grounding Evidence.
  scenario:
    sufficient_evidence: A clear, permitted request with enough available reporting to support the requested
      information need.
    ambiguous_request: The question leaves material identity, scope, or relationship unresolved across
      credible alternatives.
    partial_coverage: Available reporting supports part of the request while identifiable portions remain
      unsupported.
    conflicting_reporting: Available sources contain incompatible accounts of a materially identical claim;
      a useful Retrieval Answer preserves the disagreement.
    required_data_not_ingested: A legitimate request depends on a public-record collection absent from
      current coverage, making it Deferred.
    outside_permitted_scope: The requested outcome is permanently outside the application's question policy,
      making it Declined.
  domain_familiarity:
    layperson: Expresses an issue or desired outcome in everyday language; translating actors, processes,
      or measures may be necessary.
    familiar: Uses common political actors and processes, but may omit identifying details or distinctions
      needed to resolve the request.
    expert: Uses precise domain terms and distinctions that the Query Rewrite and Retrieval Answer need
      to preserve; precision does not imply a correct premise.
